<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mundo de Corazón de Maíz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@1,700;1,800&family=Alegreya+Sans:wght@500;700;800&family=Cinzel:wght@700&display=swap" rel="stylesheet">
<style>
/* Página de prueba del arte del mundo. */
* { box-sizing: border-box; }
body { margin: 0; background: #14110f; color: #f3e6cf; font-family: 'Alegreya Sans', system-ui, sans-serif; }
.page { max-width: 1240px; margin: 0 auto; padding: 32px 16px 70px; }
h1 { font: 700 36px 'Cinzel', serif; margin: 0 0 6px; text-align: center; }
.lead { text-align: center; color: #c9b89a; margin: 0 auto 22px; max-width: 760px; font-size: 17px; text-wrap: pretty; }
h2 { font: italic 800 24px 'Alegreya', serif; margin: 36px 0 4px; }
h2 + p { margin: 0 0 12px; color: #c9b89a; }
.wrap { overflow: auto; border-radius: 8px; box-shadow: 0 12px 30px rgba(0,0,0,.5); max-width: 100%; }
#mundo { position: relative; overflow: hidden; margin: 0 auto; background: #7dbf52; }
#mundo .ground { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#mundo .agua { position: absolute; top: 0; background-size: 48px 48px; box-shadow: inset 3px 0 0 #5f9e3c, inset -3px 0 0 #5f9e3c; }
#mundo .actors, #mundo .fx { position: absolute; inset: 0; }
#mundo .crop { position: absolute; display: block; }
#mundo .actor { position: absolute; left: 0; top: 0; display: block; }
#mundo .fx { z-index: 1000; pointer-events: none; }
.pop { position: absolute; transform: translateX(-12px); display: flex; align-items: center; gap: 4px; padding: 2px 10px; border-radius: 3px; white-space: nowrap; font: 800 15px 'Alegreya Sans', sans-serif; color: #fff;
  background: linear-gradient(#2f56b4, #16306e); box-shadow: inset 0 0 0 1.5px #0f2458, inset 0 0 0 3px #d39a26, 0 3px 6px rgba(0,0,0,.4); animation: pop 1.6s ease-out forwards; }
@keyframes pop { 0% { opacity: 0; translate: 0 10px; scale: .6 } 15% { opacity: 1; scale: 1.08 } 25% { scale: 1 } 80% { opacity: 1 } 100% { opacity: 0; translate: 0 -24px } }
.polvo, .gota { position: absolute; width: 7px; height: 7px; border-radius: 50%; animation: puff .8s ease-out forwards; }
.polvo { background: #b9875a; box-shadow: 0 0 0 1px #6e4628; }
.gota { background: #7fb4ea; box-shadow: 0 0 0 1px #2f5fa8; border-radius: 50% 50% 50% 0; rotate: -45deg; }
@keyframes puff { from { opacity: 1; transform: translate(0, 0) scale(1) } to { opacity: 0; transform: translate(var(--dx), -18px) scale(.4) } }
.sheet img, .chars img { display: block; background: repeating-conic-gradient(#3a332c 0 25%, #2a241f 0 50%) 0 0 / 16px 16px; border-radius: 4px; image-rendering: auto; }
.chars { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 14px; }
.chars figure, .tiles figure, .seeds figure { margin: 0; text-align: center; }
.chars figcaption, .tiles figcaption, .seeds figcaption { margin-top: 4px; font: italic 700 15px 'Alegreya', serif; }
.tiles, .seeds { display: flex; flex-wrap: wrap; gap: 12px; }
.tiles img { display: block; width: 64px; height: 64px; background: repeating-conic-gradient(#3a332c 0 25%, #2a241f 0 50%) 0 0 / 16px 16px; }
.crops .row { display: flex; align-items: flex-end; gap: 8px; padding: 6px 10px; margin-bottom: 6px; border-radius: 6px; background: #9a6a42; }
.crops .row b { width: 90px; color: #fff3d2; font: italic 800 16px 'Alegreya', serif; align-self: center; }
.crops img { display: block; width: 48px; height: 96px; }
.seeds figure { background: #f4ead2; border-radius: 6px; padding: 6px 6px 2px; color: #16306e; }
</style>
</head>
<body>
<main class="page">
  <h1>El mundo de Corazón de Maíz</h1>
  <p class="lead">Personajes caminando, terreno y cultivos en el mismo trazo que los retratos y los menús. El jugador ara, riega y cosecha; Kaya, Yeyetzi, Mei y Naara andan por el pueblo.</p>
  <div class="wrap"><div id="mundo"></div></div>
  <div id="hojas"></div>
</main>
<script>
// Flat-vector chibi characters for Tlaxcallan, matching the game's current look
// (plaza NPCs): big head, small body, clean fills with a soft brown outline.
// One parametric builder draws the whole cast; see CAST for each character.
"use strict";
(function () {
  const L = '#4a2e22';           // outline
  const sw = 'stroke="' + L + '" stroke-width="1.6" stroke-linejoin="round"';
  const shade = (h, k) => '#' + [1, 3, 5].map(i => Math.round(parseInt(h.slice(i, i + 2), 16) * k)).map(v => Math.min(255, v).toString(16).padStart(2, '0')).join('');

  // Embroidery strip: alternating triangles, the most common huipil/cueitl motif.
  const tri = (x0, x1, y, h, c) => { let d = ''; for (let x = x0; x < x1 - 1; x += 6) d += `M${x} ${y + h}l3 ${-h}l3 ${h}Z`; return `<path d="${d}" fill="${c}"/>`; };

  function hairBack(p) {
    const c = p.hair, s = p.hairStyle;
    if (s === 'afro') return `<circle cx="60" cy="56" r="47" fill="${c}" ${sw}/>${Array.from({ length: 16 }, (_, i) => { const a = i / 16 * Math.PI * 2; return `<circle cx="${60 + Math.cos(a) * 43}" cy="${56 + Math.sin(a) * 43}" r="9" fill="${c}"/>`; }).join('')}`;
    if (s === 'rizos') return Array.from({ length: 22 }, (_, i) => { const side = i % 2 ? 1 : -1, k = Math.floor(i / 2); return `<circle cx="${60 + side * (30 + (k % 3) * 4)}" cy="${48 + k * 7}" r="11" fill="${c}" ${sw}/>`; }).join('') + `<path d="M24 50 C 24 110 96 110 96 50 Z" fill="${c}"/>`;
    if (s === 'largo') return `<path d="M24 52 C 22 90 24 112 28 124 L92 124 C 96 112 98 90 96 52 Z" fill="${c}" ${sw}/>`;
    if (s === 'coleta') return `<path d="M88 40 C 108 46 110 80 100 104 C 96 90 92 70 84 56 Z" fill="${c}" ${sw}/>`;
    if (s === 'chongo') return `<circle cx="60" cy="20" r="14" fill="${c}" ${sw}/><path d="M48 22 h24" stroke="${p.acc2 || '#c0392b'}" stroke-width="4"/>`;
    return '';
  }
  function hairFront(p) {
    const c = p.hair, hi = shade(c === '#1a1210' ? '#3a2a24' : c, 1.25), s = p.hairStyle;
    let g = `<path d="M26 58 C 22 26 44 16 60 16 C 78 16 98 26 94 58 C 88 44 78 38 70 36 C 64 42 52 44 44 40 C 38 44 32 50 26 58 Z" fill="${c}" ${sw}/>`;
    if (s === 'rizos' || s === 'afro') g = `<path d="M26 58 C 22 26 44 16 60 16 C 78 16 98 26 94 58 C 86 46 78 42 60 42 C 42 42 34 46 26 58 Z" fill="${c}" ${sw}/>` + [30, 40, 50, 60, 70, 80, 90].map((x, i) => `<circle cx="${x}" cy="${26 + Math.abs(i - 3) * 4}" r="${8}" fill="${c}"/>`).join('');
    g += `<path d="M40 24 C 48 19 58 18 66 20" stroke="${hi}" stroke-width="3" fill="none" stroke-linecap="round"/>`;
    // Ixtlapalli: hair twisted into two "horns" over the forehead.
    if (s === 'cuernos') g += [46, 74].map(x => `<path d="M${x - 7} 22 C ${x - 8} 8 ${x + 8} 8 ${x + 7} 22 Z" fill="${c}" ${sw}/>`).join('');
    if (s === 'trenzas') g += [24, 96].map(x => `${Array.from({ length: 7 }, (_, i) => `<ellipse cx="${x + (x < 60 ? 2 : -2)}" cy="${62 + i * 9}" rx="6" ry="6" fill="${c}" ${sw}/>`).join('')}<path d="M${x - 4} 124 l4 8 l4 -8" fill="${p.acc2 || '#c0392b'}"/><rect x="${x - 5}" y="120" width="10" height="4" fill="${p.acc2 || '#c0392b'}"/>`).join('');
    return g;
  }
  function headwear(p) {
    const h = p.head; if (!h) return '';
    if (h === 'plumas') { const cs = p.feathers || ['#2f8f8a', '#7cb04a', '#e9b33e', '#c0392b', '#e9b33e', '#7cb04a', '#2f8f8a']; return cs.map((c, i) => { const a = (i - (cs.length - 1) / 2) * 15; return `<path transform="rotate(${a} 60 36)" d="M60 36 C 52 22 54 6 60 -2 C 66 6 68 22 60 36 Z" fill="${c}" ${sw}/>`; }).join('') + `<path d="M28 40 C 44 32 76 32 92 40 L92 47 C 76 40 44 40 28 47 Z" fill="#e9b33e" ${sw}/>${[38, 50, 60, 70, 82].map(x => `<circle cx="${x}" cy="41" r="2.2" fill="#2f8f8a"/>`).join('')}`; }
    if (h === 'pluma') return `<path transform="rotate(20 86 34)" d="M86 34 C 78 20 80 4 88 -4 C 96 6 94 22 86 34 Z" fill="${p.acc2 || '#c0392b'}" ${sw}/><path d="M28 40 C 44 32 76 32 92 40 L92 46 C 76 39 44 39 28 46 Z" fill="${p.band || '#c0392b'}" ${sw}/>`;
    if (h === 'banda') return `<path d="M27 42 C 44 34 76 34 93 42 L93 49 C 76 41 44 41 27 49 Z" fill="${p.band || '#c0392b'}" ${sw}/>${[40, 52, 64, 76].map(x => `<rect x="${x}" y="40" width="4" height="4" fill="#f6efe2" transform="rotate(45 ${x + 2} 42)"/>`).join('')}`;
    if (h === 'flor') return `<g transform="translate(86 30)">${[0, 72, 144, 216, 288].map(a => `<ellipse cy="-6" rx="5" ry="7" transform="rotate(${a})" fill="${p.flower || '#e05a7a'}" ${sw}/>`).join('')}<circle r="3.6" fill="#f2c94c" ${sw}/></g>`;
    if (h === 'cempa') return [26, 38, 50, 62, 74, 86, 94].map((x, i) => `<circle cx="${x}" cy="${34 - Math.sin(i / 6 * Math.PI) * 8}" r="7" fill="${i % 2 ? '#f29a1e' : '#f6b81e'}" ${sw}/><circle cx="${x}" cy="${34 - Math.sin(i / 6 * Math.PI) * 8}" r="2.4" fill="#d06a12"/>`).join('');
    return '';
  }

  function body(p) {
    const bw = [0, 7, 14][p.build || 0], sk = p.skin, skS = shade(sk, .82);
    const top = p.top || '#f3ede2', topS = shade(top, .86), trim = p.trim || '#c0392b', skirt = p.skirt || '#2f5fa8';
    let g = '';
    // Legs + sandals (cactli).
    g += `<rect x="47" y="140" width="10" height="17" rx="4" fill="${sk}" ${sw}/><rect x="63" y="140" width="10" height="17" rx="4" fill="${skS}" ${sw}/>`;
    g += `<ellipse cx="51" cy="158" rx="8" ry="3.6" fill="#8a5a34" ${sw}/><ellipse cx="69" cy="158" rx="8" ry="3.6" fill="#8a5a34" ${sw}/>`;
    // Cueitl (wrap skirt) with embroidered hem.
    const w0 = 20 + bw / 2, w1 = 26 + bw / 2;
    g += `<path d="M${60 - w0} 110 L${60 + w0} 110 L${60 + w1} 146 L${60 - w1} 146 Z" fill="${skirt}" ${sw}/><path d="M${60 + w0 - 6} 112 L${60 + w1 - 8} 145" stroke="${shade(skirt, .75)}" stroke-width="2"/>`;
    g += `<rect x="${60 - w1 + 1}" y="137" width="${2 * w1 - 2}" height="8" fill="${p.hem || '#f3ede2'}"/>${tri(60 - w1 + 2, 60 + w1 - 2, 137, 7, trim)}`;
    // Arms (behind the top's sleeves).
    const ax = 21 + bw / 2;
    g += `<path d="M${60 - ax} 94 C ${60 - ax - 6} 104 ${60 - ax - 6} 116 ${60 - ax - 2} 124" stroke="${L}" stroke-width="11" stroke-linecap="round" fill="none"/><path d="M${60 - ax} 94 C ${60 - ax - 6} 104 ${60 - ax - 6} 116 ${60 - ax - 2} 124" stroke="${sk}" stroke-width="8" stroke-linecap="round" fill="none"/>`;
    g += `<path d="M${60 + ax} 94 C ${60 + ax + 6} 104 ${60 + ax + 6} 116 ${60 + ax + 2} 124" stroke="${L}" stroke-width="11" stroke-linecap="round" fill="none"/><path d="M${60 + ax} 94 C ${60 + ax + 6} 104 ${60 + ax + 6} 116 ${60 + ax + 2} 124" stroke="${skS}" stroke-width="8" stroke-linecap="round" fill="none"/>`;
    // Top: huipil, quechquémitl over a blouse, or ichcahuipilli (quilted cotton armour).
    const tw = 22 + bw / 2;
    if (p.style === 'quech') {
      g += `<path d="M${60 - tw + 2} 90 L${60 + tw - 2} 90 L${60 + tw} 118 L${60 - tw} 118 Z" fill="${p.blouse || '#f3ede2'}" ${sw}/>`;
      g += `<path d="M${60 - tw - 6} 92 C ${60 - tw} 88 ${60 + tw} 88 ${60 + tw + 6} 92 L60 128 Z" fill="${top}" ${sw}/><path d="M${60 - tw - 2} 96 L60 124 L${60 + tw + 2} 96" stroke="${trim}" stroke-width="3" fill="none"/><path d="M60 128 l-3 6 h6Z" fill="${trim}"/>`;
      g += `<path d="M${60 + tw - 4} 92 L60 128 L${60 + tw + 6} 92Z" fill="${topS}" opacity=".6"/>`;
    } else if (p.style === 'armadura') {
      g += `<path d="M${60 - tw} 88 L${60 + tw} 88 L${60 + tw + 2} 124 L${60 - tw - 2} 124 Z" fill="${top}" ${sw}/>`;
      for (let y = 94; y < 124; y += 7) g += `<path d="M${60 - tw} ${y} H${60 + tw}" stroke="${topS}" stroke-width="1.6"/>`;
      for (let x = 60 - tw + 7; x < 60 + tw; x += 8) g += `<path d="M${x} 88 V124" stroke="${topS}" stroke-width="1.2"/>`;
      g += `<rect x="${60 - tw - 2}" y="118" width="${2 * tw + 4}" height="7" fill="${trim}" ${sw}/>${Array.from({ length: Math.floor((2 * tw) / 7) }, (_, i) => `<path d="M${60 - tw + 2 + i * 7} 125 v8" stroke="${trim}" stroke-width="3"/>`).join('')}`;
    } else {
      g += `<path d="M${60 - tw - 4} 90 C ${60 - tw} 86 ${60 + tw} 86 ${60 + tw + 4} 90 L${60 + tw + 2} 126 L${60 - tw - 2} 126 Z" fill="${top}" ${sw}/><path d="M${60 + tw - 6} 90 L${60 + tw - 2} 126 L${60 + tw + 2} 126 L${60 + tw + 4} 90Z" fill="${topS}"/>`;
      g += `<path d="M50 88 L50 100 L70 100 L70 88" fill="none" stroke="${trim}" stroke-width="3.4"/>`;
      g += `<rect x="${60 - tw - 1}" y="117" width="${2 * tw + 2}" height="7" fill="${p.band2 || trim}"/>${tri(60 - tw, 60 + tw, 117, 6, p.hem2 || '#f3ede2')}`;
      if (p.stars) g += [[48, 108], [72, 106], [60, 112]].map(([x, y]) => `<path d="M${x} ${y - 3} l1 2 l2 1 l-2 1 l-1 2 l-1 -2 l-2 -1 l2 -1Z" fill="#f2c94c"/>`).join('');
    }
    // Hands.
    g += `<circle cx="${60 - ax - 2}" cy="125" r="4.6" fill="${sk}" ${sw}/><circle cx="${60 + ax + 2}" cy="125" r="4.6" fill="${skS}" ${sw}/>`;
    // Jade bead necklace.
    if (p.jade) g += `<path d="M48 90 C 52 98 68 98 72 90" fill="none" stroke="${L}" stroke-width="1"/>` + [50, 55, 60, 65, 70].map((x, i) => `<circle cx="${x}" cy="${91 + (i === 0 || i === 4 ? 0 : i === 2 ? 5 : 3.5)}" r="2.6" fill="#3fa37a" ${sw}/>`).join('');
    return g;
  }

  function face(p) {
    const sk = p.skin, skS = shade(sk, .82), ey = 64;
    let g = `<rect x="54" y="80" width="12" height="10" fill="${skS}"/>`;
    g += `<ellipse cx="27" cy="62" rx="5" ry="7" fill="${sk}" ${sw}/><ellipse cx="93" cy="62" rx="5" ry="7" fill="${skS}" ${sw}/>`;
    if (p.orejeras) g += [27, 93].map(x => `<circle cx="${x}" cy="66" r="4" fill="#e9b33e" ${sw}/><circle cx="${x}" cy="66" r="1.6" fill="#2f8f8a"/>`).join('');
    g += `<path d="M60 22 C 84 22 94 38 94 58 C 94 78 80 88 60 88 C 40 88 26 78 26 58 C 26 38 36 22 60 22 Z" fill="${sk}" ${sw}/>`;
    g += `<path d="M84 34 C 92 44 94 60 88 74 C 86 70 86 60 84 52 Z" fill="${skS}" opacity=".7"/>`;
    g += [46, 74].map(x => `<ellipse cx="${x}" cy="${ey}" rx="5" ry="6.2" fill="#fff"/><ellipse cx="${x}" cy="${ey + .6}" rx="3.8" ry="5" fill="${p.eye || '#2a1712'}"/><circle cx="${x + 1.6}" cy="${ey - 1.6}" r="1.6" fill="#fff"/><path d="M${x - 6} ${ey - 3} C ${x - 3} ${ey - 8} ${x + 3} ${ey - 8} ${x + 6} ${ey - 4}" stroke="${L}" stroke-width="2.2" fill="none" stroke-linecap="round"/><path d="M${x + (x < 60 ? -6 : 6)} ${ey - 3} l${x < 60 ? -3 : 3} -2" stroke="${L}" stroke-width="1.8" stroke-linecap="round"/>`).join('');
    g += [46, 74].map(x => `<path d="M${x - 5} ${ey - 12} q5 -3 10 0" stroke="${shade(p.hair, 1)}" stroke-width="2.4" fill="none" stroke-linecap="round"/>`).join('');
    g += `<ellipse cx="38" cy="74" rx="5.5" ry="3" fill="#e0846e" opacity=".5"/><ellipse cx="82" cy="74" rx="5.5" ry="3" fill="#e0846e" opacity=".5"/>`;
    if (p.freckles) g += [[36, 70], [40, 72], [34, 73], [80, 70], [84, 72], [86, 69]].map(([x, y]) => `<circle cx="${x}" cy="${y}" r=".9" fill="${shade(sk, .6)}"/>`).join('');
    g += `<path d="M56 78 Q60 82 64 78" stroke="#8a3a2a" stroke-width="2.2" fill="none" stroke-linecap="round"/>`;
    if (p.paint) g += `<path d="M30 66 h8 M82 66 h8" stroke="${p.paint}" stroke-width="2.4" stroke-linecap="round"/>`;
    return g;
  }

  function prop(p, phase) {
    const a = p.prop, bw = [0, 7, 14][p.build || 0], rx = 60 + 21 + bw / 2 + 2, lx = 60 - 21 - bw / 2 - 2;
    if (!a) return '';
    if (a === 'lanza' && phase === 'back') return `<path d="M${rx + 2} 158 L${rx + 2} 10" stroke="${L}" stroke-width="5.4" stroke-linecap="round"/><path d="M${rx + 2} 158 L${rx + 2} 10" stroke="#9a6438" stroke-width="3"/><path d="M${rx + 2} -2 l-6 14 h12Z" fill="#2a2a3a" ${sw}/><path d="M${rx - 3} 20 l-4 6 M${rx + 7} 20 l4 6" stroke="#c0392b" stroke-width="3" stroke-linecap="round"/>`;
    if (a === 'arco' && phase === 'back') return `<path d="M${rx + 6} 70 C ${rx + 24} 96 ${rx + 24} 136 ${rx + 6} 160" stroke="${L}" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M${rx + 6} 70 C ${rx + 24} 96 ${rx + 24} 136 ${rx + 6} 160" stroke="#8a5a34" stroke-width="3" fill="none"/><path d="M${rx + 6} 70 L${rx + 6} 160" stroke="#f3ede2" stroke-width="1.2"/>`;
    if (a === 'escudo' && phase === 'front') return `<g transform="translate(${lx - 4} 116)"><circle r="20" fill="#f3ede2" ${sw}/><circle r="15" fill="${p.shield || '#2f5fa8'}" ${sw}/><path d="M-15 0 H15 M0 -15 V15" stroke="#f3ede2" stroke-width="3"/><circle r="5" fill="#e9b33e" ${sw}/>${[-12, -4, 4, 12].map(x => `<path d="M${x} 18 l-2 10 h4Z" fill="${['#2f8f8a', '#c0392b', '#e9b33e', '#2f8f8a'][(x + 12) / 8]}" ${sw}/>`).join('')}</g>`;
    if (a === 'canasta' && phase === 'front') return `<g transform="translate(${lx - 6} 122)"><path d="M-14 -4 C -14 -26 14 -26 14 -4" stroke="#8a5a34" stroke-width="3.4" fill="none"/><path d="M-16 -4 H16 L12 16 H-12 Z" fill="#d8a85a" ${sw}/><path d="M-14 3 H14 M-13 9 H13" stroke="#a87a3a" stroke-width="2"/>${[-8, 0, 8].map((x, i) => `<circle cx="${x}" cy="-6" r="5" fill="${['#c0392b', '#f2c94c', '#7cb04a'][i]}" ${sw}/>`).join('')}</g>`;
    if (a === 'jicara' && phase === 'front') return `<g transform="translate(60 124)"><path d="M-16 -4 C -16 10 16 10 16 -4 Z" fill="#a8522e" ${sw}/><ellipse cy="-4" rx="16" ry="4" fill="${p.bowl || '#ecd3a0'}" ${sw}/><path d="M-10 2 h20" stroke="#f1dcb0" stroke-width="2"/></g>`;
    if (a === 'flores' && phase === 'front') return `<g transform="translate(${lx - 2} 116)"><path d="M0 12 L-4 -8 M0 12 L4 -10 M0 12 L0 -12" stroke="#4f8a36" stroke-width="2.4"/>${[[-4, -10], [4, -12], [0, -15]].map(([x, y]) => `<circle cx="${x}" cy="${y}" r="5" fill="#f6a81e" ${sw}/><circle cx="${x}" cy="${y}" r="1.8" fill="#d06a12"/>`).join('')}</g>`;
    if (a === 'cacao' && phase === 'front') return `<g transform="translate(${lx - 4} 118)"><path d="M0 -14 C 10 -10 10 10 0 14 C -10 10 -10 -10 0 -14 Z" fill="#a8521e" ${sw}/><path d="M0 -12 V12 M-4 -10 C -6 0 -6 6 -4 10 M4 -10 C 6 0 6 6 4 10" stroke="#7a3418" stroke-width="1.4" fill="none"/></g>`;
    if (a === 'red' && phase === 'front') return `<g transform="translate(${lx - 6} 120)"><path d="M-12 -14 L12 -14 L8 14 L-8 14 Z" fill="none" stroke="#c8b48a" stroke-width="2"/>${[-8, -2, 4, 10].map(y => `<path d="M-11 ${y} H11" stroke="#c8b48a" stroke-width="1.4"/>`).join('')}${[-6, 0, 6].map(x => `<path d="M${x} -14 V14" stroke="#c8b48a" stroke-width="1.4"/>`).join('')}<path d="M-6 4 C 0 -2 6 4 0 8 C -2 8 -4 6 -6 4 Z" fill="#7fa8c8" ${sw}/></g>`;
    if (a === 'tambor' && phase === 'front') return `<g transform="translate(${lx - 2} 124)"><rect x="-11" y="-12" width="22" height="26" rx="4" fill="#a8522e" ${sw}/><ellipse cy="-12" rx="11" ry="4" fill="#ecd3a0" ${sw}/><path d="M-11 0 H11" stroke="#f1dcb0" stroke-width="2"/></g>`;
    if (a === 'panal' && phase === 'front') return `<g transform="translate(${lx - 4} 120)"><rect x="-8" y="-14" width="16" height="28" rx="6" fill="#c89a50" ${sw}/><path d="M-8 -6 H8 M-8 2 H8" stroke="#8a5a34" stroke-width="1.6"/><circle cx="12" cy="-16" r="2.4" fill="#f2c94c" ${sw}/><circle cx="-12" cy="-20" r="2" fill="#f2c94c" ${sw}/></g>`;
    return '';
  }

  // Returns an inline <svg> string. viewBox fits headdresses and props.
  function chibi(p, cls = '') {
    return `<svg class="chibi ${cls}" viewBox="-14 -14 148 182" role="img" aria-label="${p.name}">

<script>

// que los retratos Códice Borgia y los menús de Talavera.

"use strict";
(function () {
  const K = '#1a1410';
  const ink = (w = 3) => `stroke="${K}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round"`;

      () => mound + `<path d="M32 111 V84 M32 100 L24 90 M32 96 L40 88" stroke="#4f8a36" stroke-width="2.2" stroke-linecap="round" fill="none"/>` + [[26, 100], [38, 98]].map(([x, y], i) => `<path d="M${x} ${y} l${i % 2 ? 6 : -6} -2 l${i % 2 ? -2 : 2} 4Z" fill="#5f9a3e" ${ink(1)}/>`).join('') + [[32, 80, 7.4], [22, 88, 6.4], [42, 86, 6.4]].map(([x, y, r]) => `<g transform="translate(${x} ${y})">${Array.from({ length: 10 }, (_, i) => `<ellipse cy="${-r * .55}" rx="${r * .36}" ry="${r * .5}" transform="rotate(${i * 36})" fill="#f29a1e" stroke="${K}" stroke-width="1"/>`).join('')}<circle r="${r * .5}" fill="#f6b81e" stroke="${K}" stroke-width="1"/></g>`).join(''),

  const O = `stroke="${K}" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"`;
  const SEEDS = {
    maiz: { bag: '#e8cf98', tie: '#c0392b', seed: (x, y) => `<path d="M${x - 2.6} ${y + 2} C ${x - 3} ${y - 2} ${x - 1} ${y - 3.6} ${x} ${y - 3.6} C ${x + 1} ${y - 3.6} ${x + 3} ${y - 2} ${x + 2.6} ${y + 2}Z" fill="#f2c94c" stroke="${K}" stroke-width="1.1"/>`, tag: `<ellipse cx="0" cy="0" rx="5" ry="9" transform="rotate(20)" fill="#f2c94c" stroke="${K}" stroke-width="1.6"/>` },
    maizAzul: { bag: '#c8d4ee', tie: '#2f5fa8', seed: (x, y) => `<path d="M${x - 2.6} ${y + 2} C ${x - 3} ${y - 2} ${x - 1} ${y - 3.6} ${x} ${y - 3.6} C ${x + 1} ${y - 3.6} ${x + 3} ${y - 2} ${x + 2.6} ${y + 2}Z" fill="#3d63b8" stroke="${K}" stroke-width="1.1"/>`, tag: `<ellipse cx="0" cy="0" rx="5" ry="9" transform="rotate(20)" fill="#3d63b8" stroke="${K}" stroke-width="1.6"/>` },
    frijol: { bag: '#ead8b4', tie: '#8f2a24', seed: (x, y) => `<ellipse cx="${x}" cy="${y}" rx="3.4" ry="2.4" fill="#8f2a24" stroke="${K}" stroke-width="1.1"/><path d="M${x - 1} ${y - .6} h1.6" stroke="#f1dcc0" stroke-width="1"/>`, tag: `<path d="M-2 -9 C -4 -1 -3 6 1 9 C 2 4 2 -2 2 -9Z" fill="#8cc95a" stroke="${K}" stroke-width="1.4"/>` },

    cempa: { bag: '#f0e2b8', tie: '#f29a1e', seed: (x, y) => `<path d="M${x - 3} ${y + 2} L${x + 3} ${y - 2}" stroke="${K}" stroke-width="2" stroke-linecap="round"/><path d="M${x + 3} ${y - 2} l1.4 -1" stroke="#f6efe0" stroke-width="1.4"/>`, tag: `${Array.from({ length: 8 }, (_, i) => `<ellipse cy="-4.6" rx="2.6" ry="3.6" transform="rotate(${i * 45})" fill="#f29a1e" stroke="${K}" stroke-width="1"/>`).join('')}<circle r="3.2" fill="#f6b81e" stroke="${K}" stroke-width="1"/>` },

<script>
// Escena de prueba del arte del mundo: terreno, cultivos, vecinas caminando y el jugador
// arando, regando y cosechando en un ciclo. También arma las hojas de sprites de abajo.
"use strict";
(function () {
  const M = window.CdmMundo, { CAST, PLAYER } = window.TlaxChars;
  const T = 48, COLS = 20, ROWS = 12;                 // cuadro de 32 px mostrado a 1.5×
  const cache = new Map();
  const img = (key, make, w, h) => { if (!cache.has(key)) cache.set(key, M.url(M.svg(make(), w, h))); return cache.get(key); };
  const frameUrl = (p, dir, f, act) => img(`${p.id}|${dir}|${f}|${act || ''}`, () => M.character(p, dir, f, act), 64, 96);

  // ---------------- Mapa
  const map = [];
  for (let y = 0; y < ROWS; y++) { map.push([]); for (let x = 0; x < COLS; x++) map[y].push(((x * 7 + y * 13) % 11 === 0) ? 'pasto-flores' : ((x * 5 + y * 3) % 13 === 0) ? 'pasto-piedras' : (x + y) % 3 ? 'pasto' : 'pasto-2'); }
  for (let x = 0; x < COLS; x++) map[3][x] = x % 4 ? 'camino' : 'camino-2';
  for (let y = 4; y < ROWS; y++) map[y][4] = y % 3 ? 'camino' : 'camino-2';
  for (let y = 0; y < ROWS; y++) map[y][17] = 'agua';
  const FIELD = { x0: 7, x1: 14, y0: 5, y1: 9 };
  for (let y = FIELD.y0; y <= FIELD.y1; y++) for (let x = FIELD.x0; x <= FIELD.x1; x++) map[y][x] = x <= 9 ? 'tierra-mojada' : 'tierra';
  const inField = (x, y) => x >= FIELD.x0 && x <= FIELD.x1 && y >= FIELD.y0 && y <= FIELD.y1;
  const isGrass = (x, y) => y >= 0 && y < ROWS && x >= 0 && x < COLS && map[y][x].startsWith('pasto');

  let ground = '';
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    const t = map[y][x];
    let tile = t === 'agua' ? '' : M.TILES[t]();
    if (!t.startsWith('pasto') && t !== 'agua') ['n', 's', 'e', 'w'].forEach(d => { const [dx, dy] = { n: [0, -1], s: [0, 1], e: [1, 0], w: [-1, 0] }[d]; if (isGrass(x + dx, y + dy) && (inField(x, y) || t.startsWith('camino'))) tile += M.TILES['orilla-' + d](); });
    if (t !== 'agua') ground += `<g transform="translate(${x * 64} ${y * 64})">${tile}</g>`;
  }
  const stage = document.getElementById('mundo');
  stage.style.width = COLS * T + 'px'; stage.style.height = ROWS * T + 'px';
  stage.innerHTML = `<div class="agua" style="left:${17 * T}px;width:${T}px;height:${ROWS * T}px"></div><img class="ground" alt="" src="${M.url(M.svg(ground, COLS * 64, ROWS * 64))}"><div class="actors"></div><div class="fx"></div>`;
  const agua = stage.querySelector('.agua'), actors = stage.querySelector('.actors'), fx = stage.querySelector('.fx');
  const water = [img('agua1', () => M.TILES['agua-1'](), 64, 64), img('agua2', () => M.TILES['agua-2'](), 64, 64)];
  let wf = 0; setInterval(() => { agua.style.backgroundImage = `url("${water[wf ^= 1]}")`; }, 600); agua.style.backgroundImage = `url("${water[0]}")`;

  // ---------------- Cultivos
  const crops = new Map();
  const cropEl = (x, y, tipo, etapa) => {
    const k = `${x},${y}`; let el = crops.get(k);
    if (!el) { el = document.createElement('img'); el.className = 'crop'; el.alt = ''; actors.appendChild(el); crops.set(k, el); }
    el.src = img(`c|${tipo}|${etapa}`, () => M.crop(tipo, etapa), 64, 128);
    Object.assign(el.style, { left: x * T + 'px', top: (y - 1) * T + 'px', width: T + 'px', height: 2 * T + 'px', zIndex: y * 10 + 5 });
    return el;
  };
  const removeCrop = (x, y) => { const k = `${x},${y}`; const el = crops.get(k); if (el) el.remove(); crops.delete(k); };
  const layout = [['maiz', 4], ['maiz', 4], ['milpa', 0], ['maiz', 3], ['frijol', 4], ['frijol', 3], ['calabaza', 4], ['calabaza', 3], ['chile', 4], ['cempa', 3], ['maiz', 2], ['frijol', 2], ['calabaza', 2], ['chile', 3], ['cempa', 2], ['maiz', 1]];
  let li = 0;
  for (let y = FIELD.y0 + 1; y <= FIELD.y1; y++) for (let x = FIELD.x0; x <= FIELD.x1; x++) { if ((x + y) % 2 && li < layout.length * 2) { const [t, e] = layout[li++ % layout.length]; cropEl(x, y, t, e); } }
  removeCrop(8, 5); removeCrop(12, 5);
  cropEl(12, 5, 'maiz', 4);

  // ---------------- Personajes
  class Actor {
    constructor(p, x, y, dir = 'down') {
      this.p = p; this.x = x; this.y = y; this.dir = dir; this.f = 0; this.act = null; this.af = 0;
      this.el = document.createElement('img'); this.el.className = 'actor'; this.el.alt = p.name || '';
      Object.assign(this.el.style, { width: T + 'px', height: T * 1.5 + 'px' }); actors.appendChild(this.el);
    }
    draw() {
      this.el.src = frameUrl(this.p, this.dir, this.act ? this.af : this.f, this.act);
      this.el.style.transform = `translate(${(this.x * T).toFixed(1)}px, ${((this.y - .5) * T).toFixed(1)}px)`;
      this.el.style.zIndex = Math.round(this.y * 10 + 6);
    }
  }
  const dirTo = (dx, dy) => Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up');
  // A script is a list of steps; each actor runs its own, looping.
  function run(actor, steps) {
    let i = 0, t0 = 0, from = null;
    return (now, dt) => {
      const s = steps[i];
      if (!from) { from = [actor.x, actor.y]; t0 = now; if (s.start) s.start(actor); }
      const el = (now - t0) / 1000;
      if (s.to) {
        const [tx, ty] = s.to, dx = tx - from[0], dy = ty - from[1], dist = Math.hypot(dx, dy), dur = dist / (s.speed || 2.4);
        const k = Math.min(1, el / dur);
        actor.x = from[0] + dx * k; actor.y = from[1] + dy * k; actor.dir = dirTo(dx, dy); actor.act = null;
        actor.f = Math.floor(el * 8) % 4;
        if (k >= 1) next();
      } else if (s.act) {
        actor.dir = s.dir; actor.act = s.act;
        actor.af = s.act === 'cosechar' ? (el < .5 ? 0 : 1) : Math.floor(el / (s.act === 'arar' ? .32 : .28)) % 2;
        if (el >= s.dur) { actor.act = null; next(); }
      } else if (s.wait != null) {
        actor.dir = s.dir || actor.dir; actor.act = null; actor.f = 0;
        if (el >= s.wait) next();
      }
      actor.draw();
      function next() { if (s.end) s.end(actor); i = (i + 1) % steps.length; from = null; }
    };
  }
  const pop = (x, y, html) => { const el = document.createElement('div'); el.className = 'pop'; el.innerHTML = html; el.style.left = x * T + 'px'; el.style.top = (y - 1.6) * T + 'px'; fx.appendChild(el); setTimeout(() => el.remove(), 1600); };
  const dust = (x, y, cls) => { for (let i = 0; i < 6; i++) { const d = document.createElement('i'); d.className = cls; d.style.left = (x + .2 + Math.random() * .6) * T + 'px'; d.style.top = (y + .4 + Math.random() * .4) * T + 'px'; d.style.setProperty('--dx', (Math.random() * 30 - 15) + 'px'); fx.appendChild(d); setTimeout(() => d.remove(), 800); } };
  const cob = `<svg viewBox="0 0 64 64" width="22" height="22">${'<ellipse cx="32" cy="30" rx="11" ry="20" transform="rotate(22 32 30)" fill="#f2c94c" stroke="#1a1410" stroke-width="3"/>'}</svg>`;

  const tu = new Actor(PLAYER, 5, 4, 'right');
  const scripts = [run(tu, [
    { wait: .6, dir: 'right' },
    { to: [8, 4] }, { wait: .3, dir: 'down' },
    { act: 'arar', dir: 'down', dur: 1.9, start: () => setTimeout(() => dust(8, 5, 'polvo'), 300), end: () => { cropEl(8, 5, 'maiz', 0); } },
    { act: 'regar', dir: 'down', dur: 1.7, start: () => dust(8, 5, 'gota'), end: () => { cropEl(8, 5, 'maiz', 1); pop(8, 5, '¡Sembrado!'); } },
    { to: [12, 4] }, { wait: .3, dir: 'down' },
    { act: 'cosechar', dir: 'down', dur: 1.8, start: () => setTimeout(() => removeCrop(12, 5), 450), end: () => pop(12, 5, `${cob} +1 maíz`) },
    { to: [12, 4.01] }, { to: [5, 4] }, { wait: 1.2, dir: 'down', end: () => { removeCrop(8, 5); cropEl(12, 5, 'maiz', 4); } },
  ])];
  const kaya = new Actor(CAST[4], 0, 3.4, 'right');
  scripts.push(run(kaya, [{ to: [15, 3.4], speed: 1.6 }, { wait: 1.4, dir: 'down' }, { to: [0.5, 3.4], speed: 1.6 }, { wait: 1, dir: 'down' }]));
  const yey = new Actor(CAST[9], 4, 11, 'up');
  scripts.push(run(yey, [{ to: [4, 4.4], speed: 1.4 }, { wait: 1.6, dir: 'right' }, { to: [4, 11], speed: 1.4 }, { wait: 1.2, dir: 'up' }]));
  const mei = new Actor(CAST[12], 15.4, 1.6, 'left'), naara = new Actor(CAST[8], 2, 1.4, 'right');
  scripts.push(run(mei, [{ wait: 3, dir: 'left' }, { wait: 2, dir: 'down' }]), run(naara, [{ wait: 2.5, dir: 'right' }, { wait: 2.5, dir: 'down' }]));

  let last = performance.now();
  const loop = now => { const dt = now - last; last = now; scripts.forEach(s => s(now, dt)); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);

  // ---------------- Hojas de sprites
  const sheet = (inner, w, h, scale = 1) => `<img alt="" src="${M.url(M.svg(inner, w, h, w * scale / 2, h * scale / 2))}">`;
  const charSheet = p => { let s = ''; M.DIRS.forEach((d, r) => { for (let f = 0; f < 4; f++) s += `<g transform="translate(${f * 64} ${r * 96})">${M.character(p, d, f)}</g>`; }); return sheet(s, 256, 384, 1); };
  const actSheet = () => { let s = ''; M.DIRS.forEach((d, r) => M.ACTS.forEach((a, ai) => [0, 1].forEach(f => { s += `<g transform="translate(${(ai * 2 + f) * 64} ${r * 96})">${M.character(PLAYER, d, f, a)}</g>`; }))); return sheet(s, 384, 384, 2); };
  const tileSheet = () => Object.keys(M.TILES).map(k => `<figure><img alt="" src="${M.url(M.svg(M.TILES[k](), 64, 64, 64, 64))}"><figcaption>${k}</figcaption></figure>`).join('');
  const cropSheet = () => Object.keys(M.CROPS).map(t => `<div class="row"><b>${t}</b>${M.CROPS[t].map((_, e) => `<img alt="" src="${M.url(M.svg(M.crop(t, e), 64, 128, 48, 96))}">`).join('')}</div>`).join('');
  document.getElementById('hojas').innerHTML = `
    <h2>Jugador · acciones</h2><p>Por fila: abajo, izquierda, derecha, arriba. Por columna: arar ×2, regar ×2, cosechar ×2.</p><div class="sheet">${actSheet()}</div>
    <h2>Personajes caminando</h2><p>Cada hoja: 4 filas (abajo, izquierda, derecha, arriba) × 4 cuadros de caminar. Cuadro de 32×48 px.</p>
    <div class="chars">${[PLAYER, ...CAST].map(p => `<figure>${charSheet(p)}<figcaption>${p.name}</figcaption></figure>`).join('')}</div>
    <h2>Terreno</h2><p>Cuadros de 32×32 px. Las orillas de pasto se ponen encima de la tierra o el camino donde tocan pasto.</p><div class="tiles">${tileSheet()}</div>
    <h2>Cultivos por etapa</h2><p>Cada etapa mide 32×64 px y se apoya en la parte de abajo del cuadro.</p><div class="crops">${cropSheet()}</div>
    <h2>Costales de semilla</h2><div class="seeds">${Object.keys(M.SEEDS).map(k => `<figure><svg viewBox="0 0 64 64" width="88" height="88">${M.semilla(k)}</svg><figcaption>${k}</figcaption></figure>`).join('')}</div>`;
})();
</script>
</body>
</html>
