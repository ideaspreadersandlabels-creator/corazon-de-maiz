<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Corazón de Maíz Intro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,500;0,700;1,500;1,600;1,700&family=Alegreya+Sans:wght@500;700&family=Cinzel:wght@700&display=swap" rel="stylesheet">
<style>
/* Corazón de Maíz · intro. 960×540 stage scaled to the window; Talavera caption panel. */
:root { --cob: #1b3a8a; --och: #d39a26; --navy: #16306e; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #0d1124; overflow: hidden; font-family: 'Alegreya Sans', system-ui, sans-serif; }
#stage { position: fixed; left: 50%; top: 50%; width: 960px; height: 540px; overflow: hidden; transform-origin: center; background: #f6f1e6; cursor: pointer; user-select: none; }
.layer { position: absolute; inset: 0; opacity: 0; transition: opacity .9s ease; }
.layer.on { opacity: 1; }
.mural { position: absolute; inset: 0; width: 100%; height: 100%; transform: scale(1.07); transition: transform 11s linear; }
.layer.on .mural { transform: scale(1) translateX(var(--pan, 0)); }
.fig { position: absolute; transform: translateX(-50%) translateY(14px); opacity: 0; transition: opacity 1s ease .5s, transform 1.4s ease .5s; }
.layer.on .fig { opacity: 1; transform: translateX(-50%); }
.fig svg { height: 100%; width: auto; display: block; filter: drop-shadow(0 4px 3px rgba(20,20,40,.25)); }
.fig--paint svg { filter: url(#cobalt); }
.fig--flip svg { transform: scaleX(-1); }

/* Talavera panel (same as the game menus). */
.cx { position: absolute; border: 20px solid transparent; border-radius: 4px; color: var(--navy);
  background: linear-gradient(rgba(255,252,245,.86), rgba(255,250,240,.9)) padding-box, var(--plain) 0 0 / 120px padding-box, var(--deco) -1px -1px / 20px border-box;
  box-shadow: 0 0 0 3px #6a4a2e, 0 0 0 5px #3a2416, inset 0 0 0 2px var(--cob), inset 0 0 0 5px #f8f2e4, inset 0 0 0 7px var(--och), 0 14px 24px rgba(0,0,0,.45); }
.cap { left: 70px; right: 70px; bottom: 34px; min-height: 104px; padding: 12px 22px 10px; transition: opacity .4s; }
.cap__y { font: italic 700 14px 'Alegreya', serif; color: #8a5a14; letter-spacing: .5px; }
.cap__t { margin-top: 2px; font: 500 20px/1.35 'Alegreya', serif; text-wrap: pretty; min-height: 54px; }
.cap__t i { font-style: normal; opacity: 0; }
.cap__more { position: absolute; right: 12px; bottom: 6px; color: var(--cob); font-size: 14px; animation: bob 1s ease-in-out infinite alternate; opacity: 0; }
.cap.done .cap__more { opacity: 1; }
@keyframes bob { to { transform: translateY(3px); } }
.dots { position: absolute; left: 0; right: 0; bottom: 12px; display: flex; justify-content: center; gap: 6px; }
.dots i { width: 12px; height: 12px; border-radius: 2px; background: #f6f1e6; box-shadow: inset 0 0 0 1.5px var(--cob), 0 1px 0 rgba(0,0,0,.3); transition: background .3s; }
.dots i.on { background: var(--cobalt) 0 0 / 40px; box-shadow: inset 0 0 0 1.5px #0f2458, inset 0 0 0 3px var(--och); }
.keys { position: absolute; right: 14px; bottom: 10px; display: flex; gap: 12px; font-size: 13px; color: #fff; text-shadow: 0 1px 3px #000; }
kbd { display: inline-block; min-width: 20px; padding: 0 6px; margin-right: 4px; font: 700 12px 'Alegreya Sans', sans-serif; color: var(--navy); text-align: center; border-radius: 3px; background: var(--plain) 0 0 / 60px; box-shadow: inset 0 0 0 1.5px var(--cob), 0 2px 0 #8a7a60; text-shadow: none; }
.skip { position: absolute; right: 14px; top: 12px; }

/* Title card on the last scene. */
.title { left: 50%; top: 24px; width: 560px; display: flex; gap: 14px; align-items: center; padding: 8px 18px; transform: translateX(-50%) scale(.92); opacity: 0; transition: opacity 1.2s ease 1.2s, transform 1.2s ease 1.2s; }
.layer.on .title { opacity: 1; transform: translateX(-50%); }
.title svg { width: 64px; flex: none; }
.title__n { font: 700 38px/1 'Cinzel', serif; color: var(--cob); text-shadow: 0 1px 0 #fff, 0 2px 0 rgba(27,58,138,.25); }
.title__t { font: italic 600 14px 'Alegreya', serif; color: #8a5a14; margin-top: 4px; }
.start { position: absolute; left: 50%; bottom: 150px; transform: translateX(-50%); padding: 8px 22px; border-radius: 3px; font: italic 700 18px 'Alegreya', serif; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.5); background: var(--cobalt) 0 0 / 120px; box-shadow: inset 0 0 0 2px #0f2458, inset 0 0 0 4px rgba(255,255,255,.18), inset 0 0 0 5px var(--och), 0 3px 0 #0b1a44, 0 6px 12px rgba(0,0,0,.4); opacity: 0; transition: opacity .6s; }
.start.on { opacity: 1; animation: glow 1.6s ease-in-out infinite alternate; }
@keyframes glow { to { box-shadow: inset 0 0 0 2px #0f2458, inset 0 0 0 4px rgba(255,255,255,.18), inset 0 0 0 5px var(--och), 0 3px 0 #0b1a44, 0 0 22px rgba(211,154,38,.8); } }
/* Compact caption at the very bottom so the mural and figures stay visible. */
.cap { left: 60px; right: 60px; bottom: 8px; min-height: 0; border-width: 16px; padding: 6px 18px 6px; }
.cap__y { font-size: 13px; }
.cap__t { font-size: 18px; line-height: 1.3; min-height: 47px; }
.dots { top: 14px; bottom: auto; justify-content: flex-start; left: 16px; }
.keys { top: 12px; bottom: auto; }
.start { bottom: 132px; }
.title { top: 18px; }
</style>
</head>
<body>
<!-- Paints background figures in cobalt, like the rest of the tile mural. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><filter id="cobalt" color-interpolation-filters="sRGB"><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncR type="table" tableValues="0.05 0.12 0.24 0.62 0.98"/><feFuncG type="table" tableValues="0.09 0.2 0.36 0.72 0.96"/><feFuncB type="table" tableValues="0.3 0.5 0.7 0.9 0.92"/></feComponentTransfer></filter></svg>
<div id="stage" role="img" aria-label="Intro de Corazón de Maíz"></div>
<script>
// Flat-vector chibi characters for Tlaxcallan, matching the game's current look
// (plaza NPCs): big head, small body, clean fills with a soft brown outline.
// One parametric builder draws the whole cast; see CAST for each character.
"use strict";
(function () {
  const L = '#4a2e22';           // outline
  const sw = 'stroke="' + L + '" stroke-width="1.6" stroke-linejoin="round"';
  const shade = (h, k) => '#' + [1, 3, 5].map(i => Math.round(parseInt(h.slice(i, i + 2), 16) * k)).map(v => Math.min(255, v).toString(16).padStart(2, '0')).join('');

  // Embroidery strip: alternating triangles, the most common huipil/cueitl motif.
  const tri = (x0, x1, y, h, c) => { let d = ''; for (let x = x0; x < x1 - 1; x += 6) d += `M${x} ${y + h}l3 ${-h}l3 ${h}Z`; return `<path d="${d}" fill="${c}"/>`; };

  function hairBack(p) {
    const c = p.hair, s = p.hairStyle;
    if (s === 'afro') return `<circle cx="60" cy="56" r="47" fill="${c}" ${sw}/>${Array.from({ length: 16 }, (_, i) => { const a = i / 16 * Math.PI * 2; return `<circle cx="${60 + Math.cos(a) * 43}" cy="${56 + Math.sin(a) * 43}" r="9" fill="${c}"/>`; }).join('')}`;
    if (s === 'rizos') return Array.from({ length: 22 }, (_, i) => { const side = i % 2 ? 1 : -1, k = Math.floor(i / 2); return `<circle cx="${60 + side * (30 + (k % 3) * 4)}" cy="${48 + k * 7}" r="11" fill="${c}" ${sw}/>`; }).join('') + `<path d="M24 50 C 24 110 96 110 96 50 Z" fill="${c}"/>`;
    if (s === 'largo') return `<path d="M24 52 C 22 90 24 112 28 124 L92 124 C 96 112 98 90 96 52 Z" fill="${c}" ${sw}/>`;
    if (s === 'coleta') return `<path d="M88 40 C 108 46 110 80 100 104 C 96 90 92 70 84 56 Z" fill="${c}" ${sw}/>`;
    if (s === 'chongo') return `<circle cx="60" cy="20" r="14" fill="${c}" ${sw}/><path d="M48 22 h24" stroke="${p.acc2 || '#c0392b'}" stroke-width="4"/>`;
    return '';
  }
  function hairFront(p) {
    const c = p.hair, hi = shade(c === '#1a1210' ? '#3a2a24' : c, 1.25), s = p.hairStyle;
    let g = `<path d="M26 58 C 22 26 44 16 60 16 C 78 16 98 26 94 58 C 88 44 78 38 70 36 C 64 42 52 44 44 40 C 38 44 32 50 26 58 Z" fill="${c}" ${sw}/>`;
    if (s === 'rizos' || s === 'afro') g = `<path d="M26 58 C 22 26 44 16 60 16 C 78 16 98 26 94 58 C 86 46 78 42 60 42 C 42 42 34 46 26 58 Z" fill="${c}" ${sw}/>` + [30, 40, 50, 60, 70, 80, 90].map((x, i) => `<circle cx="${x}" cy="${26 + Math.abs(i - 3) * 4}" r="${8}" fill="${c}"/>`).join('');
    g += `<path d="M40 24 C 48 19 58 18 66 20" stroke="${hi}" stroke-width="3" fill="none" stroke-linecap="round"/>`;
    // Ixtlapalli: hair twisted into two "horns" over the forehead.
    if (s === 'cuernos') g += [46, 74].map(x => `<path d="M${x - 7} 22 C ${x - 8} 8 ${x + 8} 8 ${x + 7} 22 Z" fill="${c}" ${sw}/>`).join('');
    if (s === 'trenzas') g += [24, 96].map(x => `${Array.from({ length: 7 }, (_, i) => `<ellipse cx="${x + (x < 60 ? 2 : -2)}" cy="${62 + i * 9}" rx="6" ry="6" fill="${c}" ${sw}/>`).join('')}<path d="M${x - 4} 124 l4 8 l4 -8" fill="${p.acc2 || '#c0392b'}"/><rect x="${x - 5}" y="120" width="10" height="4" fill="${p.acc2 || '#c0392b'}"/>`).join('');
    return g;
  }
  function headwear(p) {
    const h = p.head; if (!h) return '';
    if (h === 'plumas') { const cs = p.feathers || ['#2f8f8a', '#7cb04a', '#e9b33e', '#c0392b', '#e9b33e', '#7cb04a', '#2f8f8a']; return cs.map((c, i) => { const a = (i - (cs.length - 1) / 2) * 15; return `<path transform="rotate(${a} 60 36)" d="M60 36 C 52 22 54 6 60 -2 C 66 6 68 22 60 36 Z" fill="${c}" ${sw}/>`; }).join('') + `<path d="M28 40 C 44 32 76 32 92 40 L92 47 C 76 40 44 40 28 47 Z" fill="#e9b33e" ${sw}/>${[38, 50, 60, 70, 82].map(x => `<circle cx="${x}" cy="41" r="2.2" fill="#2f8f8a"/>`).join('')}`; }
    if (h === 'pluma') return `<path transform="rotate(20 86 34)" d="M86 34 C 78 20 80 4 88 -4 C 96 6 94 22 86 34 Z" fill="${p.acc2 || '#c0392b'}" ${sw}/><path d="M28 40 C 44 32 76 32 92 40 L92 46 C 76 39 44 39 28 46 Z" fill="${p.band || '#c0392b'}" ${sw}/>`;
    if (h === 'banda') return `<path d="M27 42 C 44 34 76 34 93 42 L93 49 C 76 41 44 41 27 49 Z" fill="${p.band || '#c0392b'}" ${sw}/>${[40, 52, 64, 76].map(x => `<rect x="${x}" y="40" width="4" height="4" fill="#f6efe2" transform="rotate(45 ${x + 2} 42)"/>`).join('')}`;
    if (h === 'flor') return `<g transform="translate(86 30)">${[0, 72, 144, 216, 288].map(a => `<ellipse cy="-6" rx="5" ry="7" transform="rotate(${a})" fill="${p.flower || '#e05a7a'}" ${sw}/>`).join('')}<circle r="3.6" fill="#f2c94c" ${sw}/></g>`;
    if (h === 'cempa') return [26, 38, 50, 62, 74, 86, 94].map((x, i) => `<circle cx="${x}" cy="${34 - Math.sin(i / 6 * Math.PI) * 8}" r="7" fill="${i % 2 ? '#f29a1e' : '#f6b81e'}" ${sw}/><circle cx="${x}" cy="${34 - Math.sin(i / 6 * Math.PI) * 8}" r="2.4" fill="#d06a12"/>`).join('');
    return '';
  }

  function body(p) {
    const bw = [0, 7, 14][p.build || 0], sk = p.skin, skS = shade(sk, .82);
    const top = p.top || '#f3ede2', topS = shade(top, .86), trim = p.trim || '#c0392b', skirt = p.skirt || '#2f5fa8';
    let g = '';
    // Legs + sandals (cactli).
    g += `<rect x="47" y="140" width="10" height="17" rx="4" fill="${sk}" ${sw}/><rect x="63" y="140" width="10" height="17" rx="4" fill="${skS}" ${sw}/>`;
    g += `<ellipse cx="51" cy="158" rx="8" ry="3.6" fill="#8a5a34" ${sw}/><ellipse cx="69" cy="158" rx="8" ry="3.6" fill="#8a5a34" ${sw}/>`;
    // Cueitl (wrap skirt) with embroidered hem.
    const w0 = 20 + bw / 2, w1 = 26 + bw / 2;
    g += `<path d="M${60 - w0} 110 L${60 + w0} 110 L${60 + w1} 146 L${60 - w1} 146 Z" fill="${skirt}" ${sw}/><path d="M${60 + w0 - 6} 112 L${60 + w1 - 8} 145" stroke="${shade(skirt, .75)}" stroke-width="2"/>`;
    g += `<rect x="${60 - w1 + 1}" y="137" width="${2 * w1 - 2}" height="8" fill="${p.hem || '#f3ede2'}"/>${tri(60 - w1 + 2, 60 + w1 - 2, 137, 7, trim)}`;
    // Arms (behind the top's sleeves).
    const ax = 21 + bw / 2;
    g += `<path d="M${60 - ax} 94 C ${60 - ax - 6} 104 ${60 - ax - 6} 116 ${60 - ax - 2} 124" stroke="${L}" stroke-width="11" stroke-linecap="round" fill="none"/><path d="M${60 - ax} 94 C ${60 - ax - 6} 104 ${60 - ax - 6} 116 ${60 - ax - 2} 124" stroke="${sk}" stroke-width="8" stroke-linecap="round" fill="none"/>`;
    g += `<path d="M${60 + ax} 94 C ${60 + ax + 6} 104 ${60 + ax + 6} 116 ${60 + ax + 2} 124" stroke="${L}" stroke-width="11" stroke-linecap="round" fill="none"/><path d="M${60 + ax} 94 C ${60 + ax + 6} 104 ${60 + ax + 6} 116 ${60 + ax + 2} 124" stroke="${skS}" stroke-width="8" stroke-linecap="round" fill="none"/>`;
    // Top: huipil, quechquémitl over a blouse, or ichcahuipilli (quilted cotton armour).
    const tw = 22 + bw / 2;
    if (p.style === 'quech') {
      g += `<path d="M${60 - tw + 2} 90 L${60 + tw - 2} 90 L${60 + tw} 118 L${60 - tw} 118 Z" fill="${p.blouse || '#f3ede2'}" ${sw}/>`;
      g += `<path d="M${60 - tw - 6} 92 C ${60 - tw} 88 ${60 + tw} 88 ${60 + tw + 6} 92 L60 128 Z" fill="${top}" ${sw}/><path d="M${60 - tw - 2} 96 L60 124 L${60 + tw + 2} 96" stroke="${trim}" stroke-width="3" fill="none"/><path d="M60 128 l-3 6 h6Z" fill="${trim}"/>`;
      g += `<path d="M${60 + tw - 4} 92 L60 128 L${60 + tw + 6} 92Z" fill="${topS}" opacity=".6"/>`;
    } else if (p.style === 'armadura') {
      g += `<path d="M${60 - tw} 88 L${60 + tw} 88 L${60 + tw + 2} 124 L${60 - tw - 2} 124 Z" fill="${top}" ${sw}/>`;
      for (let y = 94; y < 124; y += 7) g += `<path d="M${60 - tw} ${y} H${60 + tw}" stroke="${topS}" stroke-width="1.6"/>`;
      for (let x = 60 - tw + 7; x < 60 + tw; x += 8) g += `<path d="M${x} 88 V124" stroke="${topS}" stroke-width="1.2"/>`;
      g += `<rect x="${60 - tw - 2}" y="118" width="${2 * tw + 4}" height="7" fill="${trim}" ${sw}/>${Array.from({ length: Math.floor((2 * tw) / 7) }, (_, i) => `<path d="M${60 - tw + 2 + i * 7} 125 v8" stroke="${trim}" stroke-width="3"/>`).join('')}`;
    } else {
      g += `<path d="M${60 - tw - 4} 90 C ${60 - tw} 86 ${60 + tw} 86 ${60 + tw + 4} 90 L${60 + tw + 2} 126 L${60 - tw - 2} 126 Z" fill="${top}" ${sw}/><path d="M${60 + tw - 6} 90 L${60 + tw - 2} 126 L${60 + tw + 2} 126 L${60 + tw + 4} 90Z" fill="${topS}"/>`;
      g += `<path d="M50 88 L50 100 L70 100 L70 88" fill="none" stroke="${trim}" stroke-width="3.4"/>`;
      g += `<rect x="${60 - tw - 1}" y="117" width="${2 * tw + 2}" height="7" fill="${p.band2 || trim}"/>${tri(60 - tw, 60 + tw, 117, 6, p.hem2 || '#f3ede2')}`;
      if (p.stars) g += [[48, 108], [72, 106], [60, 112]].map(([x, y]) => `<path d="M${x} ${y - 3} l1 2 l2 1 l-2 1 l-1 2 l-1 -2 l-2 -1 l2 -1Z" fill="#f2c94c"/>`).join('');
    }
    // Hands.
    g += `<circle cx="${60 - ax - 2}" cy="125" r="4.6" fill="${sk}" ${sw}/><circle cx="${60 + ax + 2}" cy="125" r="4.6" fill="${skS}" ${sw}/>`;
    // Jade bead necklace.
    if (p.jade) g += `<path d="M48 90 C 52 98 68 98 72 90" fill="none" stroke="${L}" stroke-width="1"/>` + [50, 55, 60, 65, 70].map((x, i) => `<circle cx="${x}" cy="${91 + (i === 0 || i === 4 ? 0 : i === 2 ? 5 : 3.5)}" r="2.6" fill="#3fa37a" ${sw}/>`).join('');
    return g;
  }

  function face(p) {
    const sk = p.skin, skS = shade(sk, .82), ey = 64;
    let g = `<rect x="54" y="80" width="12" height="10" fill="${skS}"/>`;
    g += `<ellipse cx="27" cy="62" rx="5" ry="7" fill="${sk}" ${sw}/><ellipse cx="93" cy="62" rx="5" ry="7" fill="${skS}" ${sw}/>`;
    if (p.orejeras) g += [27, 93].map(x => `<circle cx="${x}" cy="66" r="4" fill="#e9b33e" ${sw}/><circle cx="${x}" cy="66" r="1.6" fill="#2f8f8a"/>`).join('');
    g += `<path d="M60 22 C 84 22 94 38 94 58 C 94 78 80 88 60 88 C 40 88 26 78 26 58 C 26 38 36 22 60 22 Z" fill="${sk}" ${sw}/>`;
    g += `<path d="M84 34 C 92 44 94 60 88 74 C 86 70 86 60 84 52 Z" fill="${skS}" opacity=".7"/>`;
    g += [46, 74].map(x => `<ellipse cx="${x}" cy="${ey}" rx="5" ry="6.2" fill="#fff"/><ellipse cx="${x}" cy="${ey + .6}" rx="3.8" ry="5" fill="${p.eye || '#2a1712'}"/><circle cx="${x + 1.6}" cy="${ey - 1.6}" r="1.6" fill="#fff"/><path d="M${x - 6} ${ey - 3} C ${x - 3} ${ey - 8} ${x + 3} ${ey - 8} ${x + 6} ${ey - 4}" stroke="${L}" stroke-width="2.2" fill="none" stroke-linecap="round"/><path d="M${x + (x < 60 ? -6 : 6)} ${ey - 3} l${x < 60 ? -3 : 3} -2" stroke="${L}" stroke-width="1.8" stroke-linecap="round"/>`).join('');
    g += [46, 74].map(x => `<path d="M${x - 5} ${ey - 12} q5 -3 10 0" stroke="${shade(p.hair, 1)}" stroke-width="2.4" fill="none" stroke-linecap="round"/>`).join('');
    g += `<ellipse cx="38" cy="74" rx="5.5" ry="3" fill="#e0846e" opacity=".5"/><ellipse cx="82" cy="74" rx="5.5" ry="3" fill="#e0846e" opacity=".5"/>`;
    if (p.freckles) g += [[36, 70], [40, 72], [34, 73], [80, 70], [84, 72], [86, 69]].map(([x, y]) => `<circle cx="${x}" cy="${y}" r=".9" fill="${shade(sk, .6)}"/>`).join('');
    g += `<path d="M56 78 Q60 82 64 78" stroke="#8a3a2a" stroke-width="2.2" fill="none" stroke-linecap="round"/>`;
    if (p.paint) g += `<path d="M30 66 h8 M82 66 h8" stroke="${p.paint}" stroke-width="2.4" stroke-linecap="round"/>`;
    return g;
  }

  function prop(p, phase) {
    const a = p.prop, bw = [0, 7, 14][p.build || 0], rx = 60 + 21 + bw / 2 + 2, lx = 60 - 21 - bw / 2 - 2;
    if (!a) return '';
    if (a === 'lanza' && phase === 'back') return `<path d="M${rx + 2} 158 L${rx + 2} 10" stroke="${L}" stroke-width="5.4" stroke-linecap="round"/><path d="M${rx + 2} 158 L${rx + 2} 10" stroke="#9a6438" stroke-width="3"/><path d="M${rx + 2} -2 l-6 14 h12Z" fill="#2a2a3a" ${sw}/><path d="M${rx - 3} 20 l-4 6 M${rx + 7} 20 l4 6" stroke="#c0392b" stroke-width="3" stroke-linecap="round"/>`;
    if (a === 'arco' && phase === 'back') return `<path d="M${rx + 6} 70 C ${rx + 24} 96 ${rx + 24} 136 ${rx + 6} 160" stroke="${L}" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M${rx + 6} 70 C ${rx + 24} 96 ${rx + 24} 136 ${rx + 6} 160" stroke="#8a5a34" stroke-width="3" fill="none"/><path d="M${rx + 6} 70 L${rx + 6} 160" stroke="#f3ede2" stroke-width="1.2"/>`;
    if (a === 'escudo' && phase === 'front') return `<g transform="translate(${lx - 4} 116)"><circle r="20" fill="#f3ede2" ${sw}/><circle r="15" fill="${p.shield || '#2f5fa8'}" ${sw}/><path d="M-15 0 H15 M0 -15 V15" stroke="#f3ede2" stroke-width="3"/><circle r="5" fill="#e9b33e" ${sw}/>${[-12, -4, 4, 12].map(x => `<path d="M${x} 18 l-2 10 h4Z" fill="${['#2f8f8a', '#c0392b', '#e9b33e', '#2f8f8a'][(x + 12) / 8]}" ${sw}/>`).join('')}</g>`;
    if (a === 'canasta' && phase === 'front') return `<g transform="translate(${lx - 6} 122)"><path d="M-14 -4 C -14 -26 14 -26 14 -4" stroke="#8a5a34" stroke-width="3.4" fill="none"/><path d="M-16 -4 H16 L12 16 H-12 Z" fill="#d8a85a" ${sw}/><path d="M-14 3 H14 M-13 9 H13" stroke="#a87a3a" stroke-width="2"/>${[-8, 0, 8].map((x, i) => `<circle cx="${x}" cy="-6" r="5" fill="${['#c0392b', '#f2c94c', '#7cb04a'][i]}" ${sw}/>`).join('')}</g>`;
    if (a === 'jicara' && phase === 'front') return `<g transform="translate(60 124)"><path d="M-16 -4 C -16 10 16 10 16 -4 Z" fill="#a8522e" ${sw}/><ellipse cy="-4" rx="16" ry="4" fill="${p.bowl || '#ecd3a0'}" ${sw}/><path d="M-10 2 h20" stroke="#f1dcb0" stroke-width="2"/></g>`;
    if (a === 'flores' && phase === 'front') return `<g transform="translate(${lx - 2} 116)"><path d="M0 12 L-4 -8 M0 12 L4 -10 M0 12 L0 -12" stroke="#4f8a36" stroke-width="2.4"/>${[[-4, -10], [4, -12], [0, -15]].map(([x, y]) => `<circle cx="${x}" cy="${y}" r="5" fill="#f6a81e" ${sw}/><circle cx="${x}" cy="${y}" r="1.8" fill="#d06a12"/>`).join('')}</g>`;

<script>
// Procedural "realistic" materials for Tlaxcallan v2, drawn on canvas at load:

    g.fillStyle = COB; for (let k = 0; k < 4; k++) for (let i = 30; i <= 70; i += 6) { g.globalAlpha = .75; const p = [[i, 8], [92, i], [i, 92], [8, i]][k]; g.beginPath(); g.arc(t.x + p[0] * u, t.y + p[1] * u, 1.5 * u, 0, Math.PI * 2); g.fill(); }

  }

  function plainTiles(S = 128, seed = 9) {

  }
  // Cobalt-glazed tile for primary buttons and selected states.
  function cobaltTile(S = 128, seed = 5) {
    const c = canvas(S, S), g = c.getContext('2d'), R = rnd(seed);
    const t = tileBase(g, S, 0, ['#2f56b4', '#16306e'], R);
    for (let i = 0; i < 40; i++) { g.fillStyle = `rgba(10,20,60,${R() * .2})`; g.beginPath(); g.ellipse(R() * S, R() * S, 4 + R() * 12, 2 + R() * 6, R() * 3, 0, Math.PI * 2); g.fill(); }
    t.done(); return c.toDataURL();
  }

  // Matte-painting landscape: sky, fbm clouds, La Malinche with ridges and gullies lit

  function landscape(W = 1280, H = 720) {
    const c = canvas(W, H), g = c.getContext('2d'), img = g.createImageData(W, H), d = img.data, N = noise2(7), M = noise2(19), R = rnd(4);
    const sunX = W * .8, sunY = H * .55;
    const sky = y => { const t = y / (H * .72); const st = [[24, 22, 56], [70, 44, 98], [176, 86, 98], [236, 146, 92], [248, 206, 140]]; const f = Math.min(.999, Math.max(0, t)) * (st.length - 1), i = Math.floor(f), k = f - i; return st[i].map((v, j) => mix(v, st[i + 1][j], k)); };

    const valley = x => H * .76 + (N(x / 200, 50) - .5) * H * .02;
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const i = (y * W + x) * 4; let [r, gg, b] = sky(y);
      // Sun glow.
      const sd = Math.hypot(x - sunX, (y - sunY) * 1.3) / W; const glow = Math.exp(-sd * 9) * .9 + Math.exp(-sd * 40) * .6;
      r = mix(r, 255, glow * .8); gg = mix(gg, 236, glow * .7); b = mix(b, 196, glow * .5);

  function cerco() {
    const R0 = rnd(7); let wall = '';
    for (let x = -10; x < 970; x += 48) wall += `<path d="M${x} 330 h44 v-12 h-12 v-10 h-20 v10 h-12Z" fill="#fbf8f0" ${br(2.4)}/>`;
    for (let r = 0; r < 6; r++) for (let x = -20 + (r % 2) * 24; x < 970; x += 48) wall += `<rect x="${x}" y="${330 + r * 20}" width="46" height="20" rx="3" fill="${r % 2 ? L : '#fbf8f0'}" ${br(1.8)}/>`;
    return mural('c', `${skyStrokes(R0, 16, R, 20, .9)}${sun(480, 250, 52, 20)}
      <path d="M-10 330 C 100 290 180 300 260 316 L340 300 L420 320 L520 296 L640 318 L760 300 L860 320 L970 304 V340 H-10Z" fill="${L}" ${br()}/>
      ${wall}${torch(60, 330)}${torch(900, 330)}<rect x="-10" y="450" width="980" height="100" fill="${C}" opacity=".85"/>`, '#f1e4dc');
  }

  // ---------- 4 · Tu milpa ----------
  function milpa() {
    const R0 = rnd(11); let rows = '';
    for (let r = 0; r < 5; r++) { const y = 420 + r * 26; rows += `<path d="M-10 ${y + 4} H970" stroke="${C}" stroke-width="1.6" opacity=".6"/>`; for (let x = 20 + (r % 2) * 20; x < 960; x += 44 + r * 4) rows += sprout(x, y, .8 + r * .12); }
    return mural('d', `${skyStrokes(R0, 8, C, 30, .4)}${sun(820, 110, 30)}
      ${malinche(-230)}<path d="${wave(392, 10, .012, .5)}" fill="${G}" opacity=".85" ${br()}/>
      <rect x="-10" y="400" width="980" height="150" fill="#f3e6cc"/>${rows}
      ${jacal(760, 404, 1.6)}${agave(900, 412, 1.1)}${agave(80, 410, .8)}`);
  }

  // ---------- 5 · Xicohténcatl ----------
  function tlatoani() {
    const R0 = rnd(13);
    return mural('e', `${skyStrokes(R0, 12, C, 20, .6)}
      <path d="M-10 360 C 120 330 240 340 360 320 C 480 300 640 330 760 318 C 860 310 920 322 970 318 V420 H-10Z" fill="${L}" ${br()}/>
      <rect x="-10" y="410" width="980" height="140" fill="#f3e6cc"/>${Array.from({ length: 12 }, (_, i) => `<rect x="${i * 84}" y="${430 + (i % 2) * 30}" width="70" height="4" rx="2" fill="${O}" opacity=".5"/>`).join('')}
      ${teocalli(480, 430, 2.2, G)}${banner(200, 440, 1.1)}${banner(760, 440, 1.1)}`);
  }

  // ---------- 6 · Casas que flotan ----------
  function barco() {
    const R0 = rnd(17), stars = Array.from({ length: 40 }, () => `<circle cx="${R0() * 960}" cy="${R0() * 260}" r="${1 + R0() * 1.4}" fill="${L}"/>`).join('');
    const waves = Array.from({ length: 30 }, (_, i) => `<path d="M${R0() * 940} ${340 + i * 7} q 10 -6 20 0 q 10 -6 20 0" fill="none" stroke="${L}" stroke-width="2" opacity=".8"/>`).join('');
    const ship = `<g transform="translate(470 330)"><path d="M-110 0 L110 0 L84 34 L-90 34Z" fill="${C}" stroke="#fbf8f0" stroke-width="2"/><path d="M-120 -6 L-100 0 M110 0 L126 -14" stroke="#fbf8f0" stroke-width="3"/>
      ${[[-50, 110], [10, 150], [66, 100]].map(([x, h]) => `<path d="M${x} 0 V${-h}" stroke="#fbf8f0" stroke-width="3"/>${[0, 1].map(k => `<path d="M${x - 30 + k * 4} ${-h + 18 + k * 46} h${60 - k * 8} v40 h${-60 + k * 8}Z" fill="#fbf8f0" ${br(2)}/><path d="M${x} ${-h + 28 + k * 46} v20 M${x - 10} ${-h + 38 + k * 46} h20" stroke="${R}" stroke-width="4"/>`).join('')}`).join('')}
      <path d="M10 -150 l18 6 l-18 6Z" fill="${R}"/></g>`;
    return mural('f', `<rect width="960" height="330" fill="#22356e"/>${stars}${moon(780, 110, 34)}
      <rect y="330" width="960" height="220" fill="#2f4a8a"/>${waves}<path d="M700 360 h120" stroke="${L}" stroke-width="3" opacity=".9"/>${ship}
      <path d="M-10 470 C 120 448 260 452 380 470 V560 H-10Z" fill="${C}" stroke="#fbf8f0" stroke-width="2"/>`, '#22356e');
  }

  // ---------- 7 · Amanecer: título ----------
  function amanecer() {
    const R0 = rnd(19);
    return mural('h', `${skyStrokes(R0, 12, O, 30, .8)}${sun(480, 300, 46, 20)}
      ${volcanoes(40, 300, 1.25)}${malinche(150)}
      <path d="${wave(424, 8, .016, 2)}" fill="${L2}" ${br()}/>${Array.from({ length: 34 }, (_, i) => corn(10 + i * 29, 530 + (i % 2) * 6, 1)).join('')}
      ${heron(220, 120, 1.1)}${heron(270, 140, .8)}`);
  }

  // figs: [param or cast index, x%, bottom%, height%, painted?] — painted = cobalt background figure.
  const SCENES = [
    { scene: valle, year: 'Año 1-Ácatl · 1519', text: 'Año 1 Caña. En el valle, a la sombra de la Matlalcueye, vive un pueblo que nunca se ha rendido: el señorío libre de Tlaxcallan.', figs: [] },
    { scene: tenochtitlan, year: 'Al poniente', text: 'Al poniente, Tenochtitlan brilla sobre su lago. Los mexicas cobran tributo a todos los pueblos de la tierra… a todos, menos a nosotros.', figs: [] },
    { scene: cerco, year: 'La frontera', text: 'Por eso nos tienen cercados: sin sal, sin algodón, sin cacao. Cada año vienen por guerreros para sus altares. Pero Tlaxcallan resiste.', figs: [0, 1, 2, 3, 4, 5].map(i => [guard(i), 8 + i * 16.8, 21, 30, true]) },
    { scene: milpa, year: 'Tu herencia', text: 'Tu padre te dejó una milpa pequeña al pie del monte, una choza, unas semillas y una coa. Es poco… pero es tuyo.', figs: [['PLAYER', 46, 21, 42, false]] },
    { scene: tlatoani, year: 'Tizatlán', text: 'El tlatoani Xicohténcatl busca gente valiente: quien dé de comer a los guerreros, quien cuide la frontera, quien se gane un nombre.', figs: [[{ id: 'xico', name: 'Xicohténcatl', skin: '#9a6a44', hair: '#e8e2d8', hairStyle: 'largo', style: 'huipil', top: '#f6efe0', trim: '#b8402e', band2: '#b8402e', skirt: '#f6efe0', hem: '#b8402e', head: 'plumas', jade: true, orejeras: true, prop: 'lanza' }, 49, 38, 26, false], [guard(0), 12, 21, 28, true], [guard(1), 24, 21, 28, true], [guard(2), 74, 21, 28, true], [guard(3), 86, 21, 28, true]] },
    { scene: barco, year: 'El mar del oriente', text: 'Y dicen los ancianos que en el mar del oriente se han visto casas que flotan, con hombres de barba y de piel pálida…', figs: [[guard(5), 8, 21, 24, true], [{ id: 'anc', name: 'Anciano', skin: '#9a6a44', hair: '#e8e2d8', hairStyle: 'chongo', style: 'quech', top: '#7a8a3a', trim: '#e9b33e', skirt: '#5a4a2a' }, 20, 21, 22, true]] },
    { scene: amanecer, year: 'Tu historia', text: 'Los dioses te miran. Las mujeres del valle esperan conocerte. Tu historia empieza al amanecer.', title: true, figs: [4, 5, 8, 9, 12, 14].map((c, i) => [c, [8, 20, 32, 68, 80, 92][i], 21, 28, false]) },
  ];

  window.TlaxIntro = { SCENES, sun };
})();
</script>
<script>
// Intro player: crossfades the seven murals, types each caption, Enter/click to
// continue, Esc to jump to the title card. Fires `cdm:intro-end` when finished.
"use strict";
(function () {
  const X = window.TlaxTex, { SCENES } = window.TlaxIntro, F = window.TlaxFigs4, { CAST, PLAYER } = window.TlaxChars;
  const root = document.documentElement.style;
  root.setProperty('--deco', `url(${X.decoTile()})`); root.setProperty('--plain', `url(${X.plainTiles()})`); root.setProperty('--cobalt', `url(${X.cobaltTile()})`);

  // Logo: a heart of criollo maize kernels between two husk leaves.
  const pal = ['#f2c94c', '#f2c94c', '#f2c94c', '#e9a83a', '#c0392b', '#3d63b8', '#f6efe0', '#f2c94c', '#7a2a6a'];
  let kern = '', n = 0;
  for (let r = 0, y = 28; y < 96; y += 7, r++) for (let x = 18 + (r % 2) * 4; x < 104; x += 8) kern += `<ellipse cx="${x}" cy="${y}" rx="3.6" ry="3.1" fill="${pal[(n++ * 7 + r * 3) % pal.length]}" stroke="#1a1410" stroke-width="1"/>`;
  const heart = `<svg viewBox="0 0 120 110"><path d="M60 104 C 20 92 2 60 18 30 C 26 14 44 8 50 26" fill="#7cb04a" stroke="#1a1410" stroke-width="3.4"/><path d="M60 104 C 100 92 118 60 102 30 C 94 14 76 8 70 26" fill="#5fa040" stroke="#1a1410" stroke-width="3.4"/><path d="M60 96 C 30 78 16 58 20 40 C 24 24 44 18 60 34 C 76 18 96 24 100 40 C 104 58 90 78 60 96 Z" fill="#e9b33e" stroke="#1a1410" stroke-width="4"/><clipPath id="ih"><path d="M60 92 C 32 76 20 58 23 41 C 27 27 44 22 60 38 C 76 22 93 27 97 41 C 100 58 88 76 60 92 Z"/></clipPath><g clip-path="url(#ih)">${kern}</g><path d="M60 34 C 58 18 64 6 72 2" stroke="#e9b33e" stroke-width="3" fill="none"/><path d="M60 34 C 54 20 46 12 38 10" stroke="#d39a26" stroke-width="2.4" fill="none"/></svg>`;

  const stage = document.getElementById('stage');
  const person = p => p === 'PLAYER' ? PLAYER : typeof p === 'number' ? CAST[p] : p;
  const layers = SCENES.map((s, i) => {
    const el = document.createElement('div'); el.className = 'layer';
    el.style.setProperty('--pan', i % 2 ? '-14px' : '14px');
    el.innerHTML = s.scene() + s.figs.map(([p, x, b, h, paint]) => `<div class="fig${paint ? ' fig--paint' : ''}${x > 50 && !s.title && paint ? ' fig--flip' : ''}" style="left:${x}%;bottom:${b}%;height:${h}%">${F.borgia(person(p))}</div>`).join('')
      + (s.title ? `<div class="cx title">${heart}<div><div class="title__n">Corazón de Maíz</div><div class="title__t">Tlaxcallan · año 1-Ácatl · 1519</div></div></div>` : '');
    stage.appendChild(el); return el;
  });
  stage.insertAdjacentHTML('beforeend', `<div class="start">Enter · comenzar</div>
    <div class="cx cap"><div class="cap__y"></div><div class="cap__t"></div><div class="cap__more">▼</div></div>
    <div class="dots">${SCENES.map(() => '<i></i>').join('')}</div>
    <div class="keys"><span><kbd>Enter</kbd>seguir</span><span><kbd>Esc</kbd>saltar</span></div>`);
  const cap = stage.querySelector('.cap'), capY = cap.querySelector('.cap__y'), capT = cap.querySelector('.cap__t'), dots = [...stage.querySelectorAll('.dots i')], start = stage.querySelector('.start');

  let cur = -1, typing = null, ended = false;
  function type(text) {
    clearInterval(typing);
    capT.innerHTML = [...text].map(ch => `<i>${ch === ' ' ? ' ' : ch}</i>`).join('');
    const chars = [...capT.children]; let k = 0; cap.classList.remove('done');
    typing = setInterval(() => { if (k < chars.length) chars[k++].style.opacity = 1; else finish(); }, 26);
  }
  function finish() { clearInterval(typing); typing = null; capT.querySelectorAll('i').forEach(c => c.style.opacity = 1); cap.classList.add('done'); if (cur === SCENES.length - 1) start.classList.add('on'); }
  function go(i) {
    if (i >= SCENES.length) { if (!ended) { ended = true; window.dispatchEvent(new CustomEvent('cdm:intro-end')); } return; }
    cur = i; layers.forEach((l, j) => l.classList.toggle('on', j === i)); dots.forEach((d, j) => d.classList.toggle('on', j === i));
    start.classList.remove('on'); capY.textContent = SCENES[i].year; type(SCENES[i].text);
  }
  const next = () => typing ? finish() : go(cur + 1);
  addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); next(); } else if (e.key === 'Escape') go(SCENES.length - 1); });
  stage.addEventListener('click', next);
  window.addEventListener('cdm:intro-end', () => { start.textContent = '¡Que empiece tu historia!'; });

  const fit = () => { const k = Math.min(innerWidth / 960, innerHeight / 540); stage.style.transform = `translate(-50%, -50%) scale(${k})`; };
  addEventListener('resize', fit); fit();
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(() => go(0));
  window.CdmIntro = { go, next };
})();
</script>
