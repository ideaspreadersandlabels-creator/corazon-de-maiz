<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tlaxcallan Opciones</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,500;0,700;0,800;1,500;1,600;1,700;1,800&family=Alegreya+Sans:wght@400;500;700;800&family=Cinzel:wght@600;700&display=swap" rel="stylesheet">
<style>
/* Tlaxcallan v2 · Talavera de Tlaxcala. Tile textures come from textures.js as
   CSS variables: --deco (decorated tile), --plain (white tiles), --cobalt. */
:root { --ink: #16306e; --soft: #4d5a80; --cob: #1b3a8a; --och: #d39a26; --red: #b8402e; }
* { box-sizing: border-box; }
html, body { margin: 0; background: #14110f; color: #f3e6cf; font-family: 'Alegreya Sans', system-ui, sans-serif; }
.page { max-width: 1640px; margin: 0 auto; padding: 44px 16px 80px; }
.intro { max-width: 820px; margin: 0 auto 36px; text-align: center; }
.intro h1 { font: 700 46px/1.05 'Cinzel', serif; margin: 0 0 12px; letter-spacing: 2px; }
.intro p { font-size: 18px; color: #c9b89a; margin: 0; text-wrap: pretty; }
.sec { margin: 0 0 56px; }
.sec h2 { font: italic 800 30px 'Alegreya', serif; margin: 0 0 4px; }
.sec > p { margin: 0 0 20px; color: #c9b89a; font-size: 17px; max-width: 820px; text-wrap: pretty; }
.boards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 700px), 1fr)); gap: 28px; }
.board { margin: 0; }
.board figcaption { margin-top: 10px; font-size: 15px; color: #c9b89a; }
.board figcaption b { color: #f3e6cf; }
.fit { position: relative; width: 100%; aspect-ratio: 16 / 9; overflow: hidden; border-radius: 6px; box-shadow: 0 12px 34px rgba(0,0,0,.5); }
.fit > .ab { position: absolute; left: 0; top: 0; transform-origin: 0 0; transform: scale(var(--k, .5)); }
.fit--hero { max-width: 1280px; margin: 0 auto; }

/* ---------- Artboard ---------- */
.ab { width: 960px; height: 540px; overflow: hidden; color: var(--ink); font-size: 15px; background: #1a1410; }
.land { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.gbg { position: absolute; inset: -20px; background: center / cover; filter: blur(5px) saturate(.9); }
.dim { position: absolute; inset: 0; background: linear-gradient(rgba(12,18,40,.35), rgba(12,18,40,.6)); }
.dim--deep { background: rgba(10,14,32,.45); }

/* Talavera panel: decorated tiles as the frame, white glazed tiles inside, wooden molding outside. */
.pnl { position: absolute; border: 30px solid transparent; border-radius: 4px; color: var(--ink);
  background: linear-gradient(rgba(255,252,245,.8), rgba(255,250,240,.86)) padding-box, var(--plain) 0 0 / 120px padding-box, var(--deco) -1px -1px / 30px border-box;
  box-shadow: 0 0 0 3px #6a4a2e, 0 0 0 5px #3a2416, inset 0 0 0 2px var(--cob), inset 0 0 0 5px #f8f2e4, inset 0 0 0 7px var(--och), 0 16px 26px rgba(0,0,0,.55); }
.pnl--thin, .tmenu, .talk, .ph, .plist { border-width: 20px; background-size: auto, 120px, 20px; }
.sarape { height: 8px; margin: 2px 0; border-radius: 2px; background: linear-gradient(90deg, #b8402e 0 12%, #e07a28 12% 20%, #f2c94c 20% 30%, #1a1410 30% 31%, #3d7a46 31% 46%, #f6efe0 46% 49%, #1b3a8a 49% 66%, #1a1410 66% 67%, #7a3a8a 67% 80%, #e05a7a 80% 90%, #b8402e 90%); box-shadow: inset 0 -2px 0 rgba(0,0,0,.15); }

.ic { display: block; filter: drop-shadow(0 2px 1px rgba(40,25,10,.35)); }
.mini { display: inline-block; width: 16px; height: 16px; vertical-align: -3px; }
.keys { position: absolute; left: 0; right: 0; bottom: 10px; display: flex; justify-content: center; gap: 18px; font-size: 14px; color: #f6efe0; text-shadow: 0 1px 3px #000; }
.pnl .keys { position: static; justify-content: center; color: var(--soft); text-shadow: none; font-size: 13px; margin-top: 2px; }
kbd { display: inline-block; min-width: 22px; padding: 1px 6px; margin-right: 5px; font: 700 12px 'Alegreya Sans', sans-serif; color: var(--ink); text-align: center; border-radius: 3px; background: var(--plain) 0 0 / 60px; box-shadow: inset 0 0 0 1.5px var(--cob), 0 2px 0 #8a7a60; }

/* Tile buttons. */
.btn, .tm, .tab, .chip { cursor: pointer; background: var(--plain) 0 0 / 80px; box-shadow: inset 0 0 0 2px var(--cob), inset 0 0 0 4px #fbf6ea, inset 0 0 0 5px rgba(211,154,38,.8), 0 3px 0 #9a8a6e, 0 4px 6px rgba(0,0,0,.25); border-radius: 3px; color: var(--ink); }
.btn:hover, .tm:hover, .tab:hover, .chip:hover { filter: brightness(1.04); box-shadow: inset 0 0 0 2px var(--cob), inset 0 0 0 4px #fbf6ea, inset 0 0 0 5px var(--och), 0 3px 0 #9a8a6e, 0 0 0 3px rgba(211,154,38,.45); }
.btn--main, .tm--on, .tab--on, .chip--on, .btn--main:hover, .tm--on:hover, .tab--on:hover, .chip--on:hover { background: var(--cobalt) 0 0 / 120px; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.5); box-shadow: inset 0 0 0 2px #0f2458, inset 0 0 0 4px rgba(255,255,255,.18), inset 0 0 0 5px var(--och), 0 3px 0 #0b1a44, 0 4px 8px rgba(0,0,0,.35); }
.btn { text-align: center; padding: 7px 14px; font: 700 15px 'Alegreya Sans', sans-serif; }
.row2 { display: flex; gap: 8px; }
.row2 .btn { flex: 1; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { padding: 4px 12px; font: italic 700 15px 'Alegreya', serif; }

/* Glazed bars. */
.m { height: 12px; border-radius: 6px; background: #e9e2d2; box-shadow: inset 0 0 0 1.5px var(--cob), inset 0 2px 3px rgba(0,0,0,.2); position: relative; overflow: hidden; }
.m i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 6px; box-shadow: inset 0 2px 0 rgba(255,255,255,.4); }
.m--s { height: 9px; }
.sld { position: relative; height: 12px; border-radius: 6px; background: #e9e2d2; box-shadow: inset 0 0 0 1.5px var(--cob), inset 0 2px 3px rgba(0,0,0,.2); }
.sld i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 6px; background: var(--cobalt) 0 0 / 60px; }
.sld b { position: absolute; top: 50%; width: 22px; height: 22px; margin: -11px 0 0 -11px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff6d8, #d39a26 55%, #8a5a14); box-shadow: 0 0 0 2px var(--cob), 0 2px 4px rgba(0,0,0,.4); }

/* Nicho: arched Talavera niche for characters. */
.niche { position: relative; display: flex; align-items: flex-end; justify-content: center; border-radius: 50% 50% 6px 6px / 26% 26% 6px 6px; border: 10px solid transparent; overflow: hidden;
  background: radial-gradient(circle at 50% 30%, #fbe8b8, #e6c48a 60%, #c99a5a) padding-box, var(--deco) 0 0 / 20px border-box; box-shadow: 0 0 0 2px #6a4a2e, 0 6px 12px rgba(0,0,0,.35), inset 0 0 0 2px var(--cob); }
.niche .chibi { width: 82%; margin-bottom: -6%; }
.niche--tall { width: 190px; height: 210px; }
.niche--big { width: 200px; height: 200px; }

/* ---------- Inicio ---------- */
.logo { left: 36px; top: 30px; width: 452px; padding: 12px 16px 10px; display: flex; gap: 14px; align-items: center; }
.glyph { width: 74px; flex: none; }
.logo__n { font: 700 40px/1 'Cinzel', serif; color: var(--cob); letter-spacing: 1px; text-shadow: 0 1px 0 #fff, 0 2px 0 rgba(27,58,138,.25); }
.logo__t { font: italic 600 15px 'Alegreya', serif; color: #8a5a14; margin-top: 4px; }
.tmenu { left: 56px; top: 226px; width: 340px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
.tm { padding: 8px 14px; display: flex; flex-direction: column; font: italic 700 20px 'Alegreya', serif; }
.tm small { font: 500 13px 'Alegreya Sans', sans-serif; opacity: .85; font-style: normal; }
.tm .mini { width: 14px; height: 14px; }
.tm--x { color: var(--red); }
.foot { position: absolute; left: 0; right: 0; bottom: 8px; text-align: center; font: italic 500 13px 'Alegreya', serif; color: #fbeed6; text-shadow: 0 1px 3px #000; }

/* ---------- Tabs ---------- */
.tabs { position: absolute; left: 60px; top: 14px; display: flex; gap: 8px; z-index: 2; }
.tab { padding: 6px 16px; font: italic 700 17px 'Alegreya', serif; }

/* ---------- Bolsa ---------- */
.bag { left: 30px; right: 30px; top: 56px; bottom: 30px; padding: 6px 8px; display: grid; grid-template-columns: 196px minmax(0, 1fr); gap: 18px; }
.bag__l { display: flex; flex-direction: column; gap: 8px; align-items: center; }
.who { width: 100%; display: flex; justify-content: space-between; align-items: baseline; }
.who b { font: italic 800 21px 'Alegreya', serif; }
.who span { font-size: 13px; color: #2f8f8a; font-weight: 700; }
.ms { width: 100%; display: grid; grid-template-columns: 56px 1fr 26px; gap: 6px 8px; align-items: center; font-size: 14px; }
.ms em { font-style: normal; font-weight: 800; text-align: right; }
.bag__r { display: flex; flex-direction: column; gap: 7px; min-width: 0; }
.item { display: grid; grid-template-columns: 70px minmax(0, 1fr) 160px; gap: 12px; align-items: center; padding: 8px 10px; border-radius: 4px; background: rgba(255,255,255,.65); box-shadow: inset 0 0 0 2px var(--cob), inset 0 0 0 4px #fff, inset 0 0 0 5px rgba(211,154,38,.7); }
.item__ic { width: 70px; height: 70px; display: flex; align-items: center; justify-content: center; border-radius: 50%; background: radial-gradient(circle, #fff 30%, #f1e2c0); box-shadow: inset 0 0 0 2px var(--cob); }
.item__ic .ic { width: 52px; height: 52px; }
.item__t b { font: italic 800 21px 'Alegreya', serif; display: block; line-height: 1.1; }
.item__t small { font: 800 11px 'Alegreya Sans', sans-serif; letter-spacing: 1.5px; text-transform: uppercase; color: var(--red); }
.item__t p { margin: 3px 0 0; font-size: 14px; line-height: 1.25; color: var(--soft); text-wrap: pretty; }
.item__s { display: flex; flex-direction: column; gap: 6px; }
.kv { display: flex; justify-content: space-between; font-size: 14px; }
.sh { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; color: var(--soft); }
.sh b { font: italic 800 16px 'Alegreya', serif; color: var(--ink); }
.sls { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 6px; }
/* Each slot is a single glazed tile with a hand-painted cobalt rim. */
.sl { position: relative; aspect-ratio: 1; display: flex; align-items: center; justify-content: center; cursor: pointer; border-radius: 3px; background: var(--plain) 0 0 / 100px;
  box-shadow: inset 0 0 0 2px rgba(27,58,138,.85), inset 0 0 1px 4px rgba(255,255,255,.7), 0 2px 0 #a8987a, 0 3px 4px rgba(0,0,0,.2); }
.sl:hover { box-shadow: inset 0 0 0 2px var(--cob), inset 0 0 0 4px var(--och), 0 2px 0 #a8987a; }
.sl--e { opacity: .75; }
.sl--on { box-shadow: inset 0 0 0 2px var(--cob), inset 0 0 0 5px var(--och), 0 0 0 3px rgba(211,154,38,.55), 0 2px 0 #a8987a; }
.sl .ic { width: 70%; height: 70%; }
.sl__k { position: absolute; left: 5px; top: 2px; font: italic 800 12px 'Alegreya', serif; color: var(--cob); }
.sl__n { position: absolute; right: 4px; bottom: 1px; font-weight: 800; font-size: 12px; color: #1a1410; text-shadow: 0 0 3px #fff, 0 0 3px #fff; }

/* ---------- Tianguis ---------- */
.seller { position: absolute; left: 30px; top: 20px; bottom: 34px; width: 250px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
.seller .niche { width: 220px; height: 230px; flex: none; }
.talk { position: relative; width: 250px; padding: 4px 6px; }
.talk__n { font: italic 800 18px 'Alegreya', serif; display: flex; justify-content: space-between; align-items: baseline; }
.talk__n small { font: 700 12px 'Alegreya Sans', sans-serif; color: #2f8f8a; }
.talk p { margin: 4px 0 6px; font-size: 15px; line-height: 1.3; text-wrap: pretty; }
.talk__f { display: flex; justify-content: space-between; align-items: center; color: var(--soft); }
.hearts { display: inline-flex; gap: 2px; }
.hearts svg { width: 15px; height: 14px; }
.hearts path { fill: #e0d6c2; stroke: #8a7a60; stroke-width: 1.4; }
.hearts path.on { fill: #d94a3a; stroke: #8f2a24; }
.shop { left: 300px; right: 30px; top: 20px; bottom: 34px; padding: 4px 8px; display: flex; flex-direction: column; gap: 8px; }
.shop__h { display: flex; justify-content: space-between; align-items: center; }
.shop__h b { font: 700 24px 'Cinzel', serif; color: var(--cob); }
.purse { display: flex; align-items: center; gap: 6px; font-weight: 800; font-size: 17px; padding: 3px 12px; border-radius: 3px; color: #fff3d2; background: var(--cobalt) 0 0 / 120px; box-shadow: inset 0 0 0 2px #0f2458, inset 0 0 0 4px var(--och); }
.prs { display: flex; flex-direction: column; gap: 6px; }
.pr { display: grid; grid-template-columns: 46px minmax(0, 1fr) 70px 98px; gap: 10px; align-items: center; padding: 4px 10px 4px 5px; cursor: pointer; border-radius: 3px; background: rgba(255,255,255,.72); box-shadow: inset 0 0 0 1.5px rgba(27,58,138,.7), 0 2px 0 rgba(140,120,90,.5); }
.pr:hover { background: #fff; }
.pr--on { background: #fff7e0; box-shadow: inset 0 0 0 2px var(--cob), inset 0 0 0 5px var(--och), 0 2px 0 rgba(140,120,90,.5); }
.pr__ic { width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle, #fff 30%, #f1e2c0); box-shadow: inset 0 0 0 1.5px var(--cob); }
.pr__ic .ic { width: 32px; height: 32px; }
.pr__t b { display: block; font-size: 16px; line-height: 1.15; }
.pr__t small { font-size: 13px; color: var(--soft); }
.pr__p { font-weight: 800; text-align: right; }
.qty { display: flex; align-items: center; justify-content: space-between; font-weight: 800; }
.qty u { text-decoration: none; cursor: pointer; width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; border-radius: 3px; background: var(--plain) 0 0 / 60px; box-shadow: inset 0 0 0 1.5px var(--cob), 0 2px 0 #9a8a6e; }
.shop__f { margin-top: auto; display: flex; justify-content: space-between; align-items: center; font-size: 17px; }
.shop__f .btn { padding: 7px 22px; font-size: 16px; }

/* ---------- Vecinos ---------- */
.vec { left: 30px; right: 30px; top: 56px; bottom: 30px; padding: 4px 6px; display: grid; grid-template-columns: minmax(0, 1fr) 236px; gap: 16px; }
.vec__g { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; align-content: start; }
.vc { cursor: pointer; display: flex; flex-direction: column; align-items: center; border-radius: 3px; padding: 2px 0 3px; background: rgba(255,255,255,.6); box-shadow: inset 0 0 0 1.5px rgba(27,58,138,.6); }
.vc:hover { background: #fff; }
.vc--on { background: #fff7e0; box-shadow: inset 0 0 0 2px var(--cob), inset 0 0 0 5px var(--och); }
.vc__a { width: 70px; height: 92px; overflow: hidden; display: flex; justify-content: center; }
.vc__a .chibi { width: 76px; height: 94px; flex: none; }
.vc b { font-size: 13px; line-height: 1; }
.love { color: #d94a3a; font-style: normal; }
.vec__s { display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; }
.vec__s .niche { width: 176px; height: 168px; }
.vec__n { font: 700 24px 'Cinzel', serif; color: var(--cob); line-height: 1; margin-top: 2px; }
.vec__r { font: italic 700 14px 'Alegreya', serif; color: var(--red); }
.vec__l { margin: 2px 0; font: italic 500 14px 'Alegreya', serif; color: var(--soft); text-wrap: pretty; }
.facts { display: grid; grid-template-columns: auto auto; gap: 2px 10px; font-size: 13px; text-align: left; width: 100%; padding: 4px 0; border-top: 1.5px dotted rgba(27,58,138,.4); }
.facts span { color: var(--soft); }
.vec__s .btn { width: 100%; }

/* ---------- Pausa ---------- */
.ph { left: 50%; top: 18px; transform: translateX(-50%); padding: 2px 18px 4px; text-align: center; white-space: nowrap; }
.ph__t { font: 700 40px/1.05 'Cinzel', serif; color: var(--cob); letter-spacing: 2px; }
.ph__d { font: italic 600 14px 'Alegreya', serif; color: #8a5a14; }
.plist { left: 90px; top: 142px; width: 260px; padding: 6px; display: flex; flex-direction: column; gap: 8px; }
.popts { left: 372px; right: 90px; top: 142px; padding: 6px 10px; display: flex; flex-direction: column; gap: 12px; }
.set { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 12px; align-items: center; font: italic 700 17px 'Alegreya', serif; }
.set--n { grid-template-columns: 96px minmax(0, 1fr) 24px; }
.set em { font-style: normal; font-weight: 800; text-align: right; font-family: 'Alegreya Sans', sans-serif; }
.cyc { display: flex; align-items: center; gap: 10px; }
.cyc b { min-width: 120px; text-align: center; padding: 3px 10px; border-radius: 3px; background: var(--plain) 0 0 / 80px; box-shadow: inset 0 0 0 1.5px var(--cob); }
.cyc u { text-decoration: none; cursor: pointer; }

/* Material sheet. */
.mats { display: flex; flex-wrap: wrap; gap: 20px; }
.mat { display: flex; flex-direction: column; gap: 8px; font-size: 15px; color: #c9b89a; }
.mat > div { width: 200px; height: 200px; border-radius: 4px; box-shadow: 0 8px 18px rgba(0,0,0,.4); }
.cast { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px; }
.cast figure { margin: 0; text-align: center; }
.cast .niche { width: 150px; height: 170px; margin: 0 auto; }
.cast figcaption { margin-top: 6px; font: italic 800 17px 'Alegreya', serif; color: #f3e6cf; }
.cast figcaption small { display: block; font: 500 13px 'Alegreya Sans', sans-serif; color: #c9b89a; }
</style>
<style>
.opts { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 700px), 1fr)); gap: 28px; }
.scene { position: absolute; inset: 0; width: 100%; height: 100%; }
.ab .foot { font-size: 14px; }
.styles { display: flex; flex-direction: column; gap: 34px; }
.srow h3 { font: italic 800 24px 'Alegreya', serif; margin: 0 0 2px; }
.srow h3 span { font: 700 13px 'Alegreya Sans', sans-serif; letter-spacing: 2px; color: #d39a26; margin-right: 10px; font-style: normal; }
.srow p { margin: 0 0 14px; color: #c9b89a; max-width: 820px; text-wrap: pretty; }
.line { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px; }
.line figure { margin: 0; text-align: center; }
.line figcaption { margin-top: 6px; font: italic 800 16px 'Alegreya', serif; color: #f3e6cf; }
.line figcaption small { display: block; font: 500 13px 'Alegreya Sans', sans-serif; color: #c9b89a; font-style: normal; }
.line .niche { width: 150px; height: 190px; margin: 0 auto; }
.niche .fig--cuento { width: 86%; margin-bottom: -2%; }
.cotton { width: 150px; height: 190px; margin: 0 auto; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 6px; border-radius: 3px;
  background: radial-gradient(circle at 30% 20%, #f4e9cf, #e4d3ac); box-shadow: inset 0 0 0 2px #2a1a10, inset 0 0 0 6px #ecdfc0, inset 0 0 0 7px #2a1a10, 0 6px 14px rgba(0,0,0,.4); }
.cotton .fig--lienzo { width: 84%; }
.tilefig { width: 150px; height: 190px; margin: 0 auto; display: flex; align-items: flex-end; justify-content: center; border: 12px solid transparent; border-radius: 3px;
  background: var(--plain) 0 0 / 80px padding-box, var(--deco) 0 0 / 24px border-box; box-shadow: 0 0 0 2px #6a4a2e, 0 6px 14px rgba(0,0,0,.4); }
.tilefig .chibi { width: 104%; filter: url(#cobalt); margin-bottom: -6%; }
.inicio .logo { left: 50%; top: 14px; transform: translateX(-50%); width: 500px; padding: 6px 14px; border-width: 20px; background-size: auto, 120px, 20px; }
.inicio .glyph { width: 56px; }
.inicio .logo__n { font-size: 36px; }
.inicio .logo__t { font-size: 14px; }
.inicio .tmenu { left: 50%; top: auto; bottom: 34px; transform: translateX(-50%); width: auto; flex-direction: row; padding: 4px; }
.inicio .tmenu .tm { width: 230px; }
.inicio .tmenu .keys { display: none; }
.inicio .tmenu { bottom: 24px; border-width: 16px; background-size: auto, 120px, 16px; gap: 6px; }
.inicio .tmenu .tm { width: 196px; padding: 5px 10px; font-size: 17px; }
.inicio .tmenu .tm small { font-size: 11.5px; }
</style>
</head>
<body>
<!-- Recolours any element to cobalt-on-white, like hand-painted Talavera. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><filter id="cobalt" color-interpolation-filters="sRGB"><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncR type="table" tableValues="0.05 0.12 0.24 0.62 0.98"/><feFuncG type="table" tableValues="0.09 0.2 0.36 0.72 0.96"/><feFuncB type="table" tableValues="0.3 0.5 0.7 0.9 0.92"/></feComponentTransfer></filter></svg>
<main class="page">
  <header class="intro">
    <h1>Tlaxcallan · 1519</h1>
    <p>Cuatro estilos para el paisaje de inicio y cuatro para los personajes, todos con los menús de azulejo. El juego ocurre durante la guerra contra Tenochtitlan: la fecha es el año 1-Ácatl (1519), y en lugar de iglesia hay un teocalli.</p>
  </header>
  <div id="app"></div>
</main>
<script>
// Flat-vector chibi characters for Tlaxcallan, matching the game's current look
// (plaza NPCs): big head, small body, clean fills with a soft brown outline.
// One parametric builder draws the whole cast; see CAST for each character.
"use strict";
(function () {
  const L = '#4a2e22';           // outline
  const sw = 'stroke="' + L + '" stroke-width="1.6" stroke-linejoin="round"';
  const shade = (h, k) => '#' + [1, 3, 5].map(i => Math.round(parseInt(h.slice(i, i + 2), 16) * k)).map(v => Math.min(255, v).toString(16).padStart(2, '0')).join('');

"use strict";
(function () {
  const rnd = s => () => (s = (s * 9301 + 49297) % 233280) / 233280;
  const svg = (defs, body) => `<svg class="scene" viewBox="0 0 960 540" preserveAspectRatio="xMidYMid slice"><defs>${defs}</defs>${body}</svg>`;
  const wave = (y0, amp, f, ph, bottom = 560) => { let d = `M-10 ${bottom}L-10 ${y0}`; for (let x = -10; x <= 970; x += 10) d += `L${x} ${(y0 + Math.sin(x * f + ph) * amp + Math.sin(x * f * 2.7 + ph * 2) * amp * .35).toFixed(1)}`; return d + `L970 ${bottom}Z`; };
  const MAL = 'M150 432 C 250 360 330 280 400 220 C 430 196 452 184 472 182 C 492 184 512 194 540 214 C 610 266 700 360 820 432 Z';

  // Stepped temple (teocalli) with shrine on top. c: colors {a: tier, b: tier shade, s: stairs, r: shrine roof, w: shrine wall}.
  function teocalli(x, y, s, c, stroke = '') {
    let g = '';
    [[120, 0], [98, 1], [76, 2], [54, 3]].forEach(([w, i]) => { const ty = y - (i + 1) * 15 * s; g += `<path d="M${x - w / 2 * s} ${ty + 15 * s} L${x - (w / 2 - 6) * s} ${ty} L${x + (w / 2 - 6) * s} ${ty} L${x + w / 2 * s} ${ty + 15 * s} Z" fill="${c.a}" ${stroke}/><path d="M${x + (w / 2 - 14) * s} ${ty} L${x + (w / 2 - 6) * s} ${ty} L${x + w / 2 * s} ${ty + 15 * s} L${x + (w / 2 - 12) * s} ${ty + 15 * s}Z" fill="${c.b}"/>`; });
    g += `<path d="M${x - 12 * s} ${y} L${x - 8 * s} ${y - 60 * s} L${x + 8 * s} ${y - 60 * s} L${x + 12 * s} ${y}Z" fill="${c.s}" ${stroke}/>`;
    for (let k = 1; k < 12; k++) g += `<path d="M${x - (12 - k * .35) * s} ${y - k * 5 * s} H${x + (12 - k * .35) * s}" stroke="${c.b}" stroke-width="${1.2 * s}"/>`;
    const ty = y - 60 * s;
    g += `<rect x="${x - 16 * s}" y="${ty - 22 * s}" width="${32 * s}" height="${22 * s}" fill="${c.w}" ${stroke}/><path d="M${x - 5 * s} ${ty} V${ty - 12 * s} H${x + 5 * s} V${ty}Z" fill="#2a1a14"/>`;
    g += `<path d="M${x - 20 * s} ${ty - 22 * s} L${x} ${ty - 40 * s} L${x + 20 * s} ${ty - 22 * s}Z" fill="${c.r}" ${stroke}/>`;
    for (let k = -1; k <= 1; k++) g += `<circle cx="${x + k * 7 * s}" cy="${ty - 26 * s}" r="${1.6 * s}" fill="#f6efe0"/>`;
    return g;
  }
  const corn = (x, y, s, c) => `<g transform="translate(${x} ${y}) scale(${s})"><path d="M0 0 V-46" stroke="${c.stem}" stroke-width="3.4"/><path d="M0 -12 C -10 -20 -18 -18 -22 -10 C -14 -14 -8 -12 0 -8Z M0 -22 C 10 -30 18 -28 22 -20 C 14 -24 8 -22 0 -18Z M0 -32 C -9 -40 -16 -38 -19 -31 C -12 -34 -6 -32 0 -28Z" fill="${c.leaf}"/>${c.cob ? `<ellipse cx="4" cy="-24" rx="3" ry="7" fill="${c.cob}" transform="rotate(15 4 -24)"/>` : ''}<path d="M0 -46 l-5 -6 M0 -46 l0 -8 M0 -46 l5 -6" stroke="${c.tas}" stroke-width="2.4" stroke-linecap="round"/></g>`;
  const agave = (x, y, s, cs, stroke = '') => `<g transform="translate(${x} ${y}) scale(${s})">${[-64, 64, -40, 40, -18, 18, 0].map((a, i) => `<path transform="rotate(${a})" d="M-6 0 C -6 -24 -2 -40 0 -46 C 2 -40 6 -24 6 0Z" fill="${cs[Math.min(2, Math.floor(i / 2))]}" ${stroke}/>`).join('')}</g>`;
  const heron = (x, y, s, fill, stroke = 'none', sw = 0) => `<path transform="translate(${x} ${y}) scale(${s})" d="M-26 -8 C -16 -14 -6 -12 0 0 C 6 -12 16 -14 26 -8 C 16 -8 8 -4 2 4 L14 6 L2 7 C -4 4 -14 -6 -26 -8 Z" fill="${fill}" stroke="${stroke}" stroke-width="${sw}" stroke-linejoin="round"/>`;
  const milpa = (c, R, area = [[420, .7, 520], [450, .86, 470], [482, 1, 430], [516, 1.16, 400]]) => area.map(([y, s, x1], r) => { let g = ''; for (let x = 6 + (r % 2) * 16; x < x1; x += 30 * s + R() * 6) g += corn(x, y, s, c); return g; }).join('');
  // Tlaxcalteca standard: white heron on a gold disc over a pole.
  const banner = (x, y, s) => `<g transform="translate(${x} ${y}) scale(${s})"><path d="M0 0 V-120" stroke="#5a3a22" stroke-width="5"/><circle cx="0" cy="-130" r="20" fill="#e9b33e" stroke="#7a4a14" stroke-width="3"/>${heron(0, -132, .55, '#fffaf0', '#3a2418', 2)}${['#2f8f8a', '#7cb04a', '#c0392b', '#7cb04a', '#2f8f8a'].map((c, i) => `<path transform="rotate(${(i - 2) * 22} 0 -130)" d="M0 -150 C -5 -162 -3 -172 0 -178 C 3 -172 5 -162 0 -150Z" fill="${c}"/>`).join('')}</g>`;

  // ---------- 1 · Plano geométrico ----------
  function plano() {
    const R = rnd(8);
    const defs = `<linearGradient id="p-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#241c4a"/><stop offset=".32" stop-color="#4c2f6a"/><stop offset=".58" stop-color="#b4506a"/><stop offset=".76" stop-color="#ef8f58"/><stop offset=".9" stop-color="#f8cf84"/></linearGradient>`;
    const stars = Array.from({ length: 50 }, () => `<circle cx="${R() * 960}" cy="${R() * 140}" r="${.8 + R()}" fill="#fff" opacity="${.3 + R() * .5}"/>`).join('');
    const body = `<rect width="960" height="540" fill="url(#p-sky)"/>${stars}
      ${[150, 110, 80].map((r, i) => `<circle cx="790" cy="330" r="${r}" fill="#ffd890" opacity="${.12 + i * .08}"/>`).join('')}<circle cx="790" cy="330" r="46" fill="#fff1c8"/>
      ${[[90, 150, 160], [620, 110, 200], [380, 70, 110], [840, 200, 130]].map(([x, y, w]) => `<rect x="${x}" y="${y}" width="${w}" height="16" rx="8" fill="#e08a8a" opacity=".5"/><rect x="${x + w * .2}" y="${y - 10}" width="${w * .5}" height="14" rx="7" fill="#e08a8a" opacity=".45"/>`).join('')}
      <path d="M-10 420 L110 296 L132 290 L150 298 L280 420Z" fill="#7c5a8e"/><path d="M132 290 L150 298 L280 420 L170 420Z" fill="#9a76a8"/><path d="M110 296 L132 290 L150 298 L140 312 L128 304 L118 314Z" fill="#f4e8f2"/>
      <path d="${MAL}" fill="#4b3874"/><path d="M472 182 C 492 184 512 194 540 214 C 610 266 700 360 820 432 L530 432 C 520 330 500 250 472 182Z" fill="#6c4f90"/>
      <path d="M472 182 L430 330 L380 432 M472 182 L560 300 L680 432" stroke="#3e2c64" stroke-width="3" fill="none" opacity=".45"/>
      <path d="M400 220 C 430 196 452 184 472 182 C 492 184 512 194 540 214 L520 222 L506 236 L492 222 L478 242 L464 220 L450 236 L436 222 L418 234 Z" fill="#cfc0dc"/><path d="M472 182 C 492 184 512 194 540 214 L520 222 L506 236 L492 222 L478 242 L472 230Z" fill="#fbeef4"/>
      <path d="M-10 412 Q 240 376 480 404 T 970 394 V540 H-10Z" fill="#3f7a3a"/>
      ${Array.from({ length: 22 }, (_, i) => `<circle cx="${20 + i * 44 + R() * 10}" cy="${398 + Math.sin(i) * 6}" r="${12 + R() * 6}" fill="#2f5e2e"/>`).join('')}
      ${teocalli(790, 412, 1, { a: '#e6d2a8', b: '#c8ae80', s: '#b8432f', r: '#3a6a3a', w: '#f2e8d4' })}
      <path d="M-10 442 Q 300 420 560 438 T 970 432 V540 H-10Z" fill="#4f9a3e"/>
      <path d="M560 540 C 600 500 640 470 690 452 L708 452 C 670 474 640 508 620 540Z" fill="#d8b07a"/>
      <g transform="translate(640 452)"><rect x="-10" y="-46" width="110" height="46" fill="#e8c69a"/><rect x="72" y="-46" width="28" height="46" fill="#d4ad7c"/><path d="M-20 -44 L110 -44 L80 -82 L10 -82Z" fill="#c8a050"/><path d="M-20 -44 L110 -44 L104 -50 L-14 -50Z" fill="#a8823a"/>${Array.from({ length: 9 }, (_, i) => `<path d="M${-14 + i * 14} -46 L${12 + i * 8} -80" stroke="#a8823a" stroke-width="1.6"/>`).join('')}<rect x="36" y="-30" width="18" height="30" fill="#5a3a24"/></g>
      ${milpa({ stem: '#3f7a2e', leaf: '#5fa040', cob: '#f2c94c', tas: '#e9b33e' }, R)}
      ${agave(470, 540, 1.2, ['#2f5a4e', '#3f7a68', '#5a9a84'])}${agave(770, 528, .9, ['#2f5a4e', '#3f7a68', '#5a9a84'])}${agave(910, 540, 1.3, ['#2f5a4e', '#3f7a68', '#5a9a84'])}
      ${banner(560, 470, .8)}
      ${heron(300, 120, .9, '#fffaf0')}${heron(340, 140, .7, '#fffaf0')}${heron(270, 150, .6, '#fffaf0')}`;
    return svg(defs, body);
  }

  // ---------- 2 · Papel recortado ----------
  function papel() {
    const R = rnd(14);
    const defs = `<linearGradient id="q-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5a2f6e"/><stop offset=".45" stop-color="#d0607a"/><stop offset=".8" stop-color="#f6b07a"/></linearGradient>
      <filter id="q-ds" x="-5%" y="-10%" width="110%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="3.5" flood-color="#2a1030" flood-opacity=".5"/></filter>
      <filter id="q-gr" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="3"/><feColorMatrix values="0 0 0 0 .4 0 0 0 0 .3 0 0 0 0 .2 0 0 0 -1.6 .9"/><feComponentTransfer><feFuncA type="linear" slope=".35"/></feComponentTransfer></filter>`;
    const cornRow = (y, s, x1, col) => { let d = ''; for (let x = 0; x < x1; x += 26 * s + R() * 5) d += corn(x, y, s, { stem: col, leaf: col, tas: col }); return `<g filter="url(#q-ds)"><path d="${wave(y - 4, 3, .04, 1)}" fill="${col}"/>${d}</g>`; };
    const body = `<rect width="960" height="540" fill="url(#q-sky)"/>
      <g filter="url(#q-ds)">${[120, 90, 64, 44].map((r, i) => `<circle cx="770" cy="300" r="${r}" fill="${['#f9c07a', '#fbd08a', '#fde0a2', '#fff1cc'][i]}"/>`).join('')}</g>
      <g filter="url(#q-ds)">${[[130, 130, 120], [560, 90, 150], [330, 180, 90]].map(([x, y, w]) => `<path d="M${x} ${y} a${w * .25} ${w * .25} 0 0 1 ${w * .4} -${w * .12} a${w * .3} ${w * .3} 0 0 1 ${w * .6} ${w * .12} Z" fill="#f6c2b8"/>`).join('')}</g>
      <g filter="url(#q-ds)"><path d="M-10 420 C 60 360 110 300 140 290 C 170 300 230 360 330 420Z" fill="#b0789a"/><path d="M118 300 C 128 292 152 290 162 298 L150 312 L140 304 L128 312Z" fill="#fbeef4"/></g>
      <g filter="url(#q-ds)"><path d="${MAL}" fill="#7a4a86"/></g>
      <g filter="url(#q-ds)"><path d="M400 220 C 430 196 452 184 472 182 C 492 184 512 194 540 214 C 528 226 516 222 506 232 C 494 222 484 238 472 228 C 460 238 450 224 438 232 C 428 222 414 228 400 220Z" fill="#fbeef4"/></g>
      <g filter="url(#q-ds)"><path d="${wave(400, 8, .012, 1)}" fill="#5a3f7a"/></g>
      <g filter="url(#q-ds)"><path d="${wave(424, 10, .016, 2)}" fill="#3e6e5a"/>${teocalli(780, 424, 1, { a: '#3e6e5a', b: '#335c4a', s: '#335c4a', r: '#c0392b', w: '#3e6e5a' })}</g>
      ${cornRow(468, .9, 560, '#2f5a48')}${cornRow(506, 1.05, 520, '#24463a')}
      <g filter="url(#q-ds)"><path d="${wave(520, 6, .02, 3)}" fill="#183028"/>${agave(700, 540, 1.4, ['#183028', '#183028', '#183028'])}${agave(880, 540, 1.7, ['#183028', '#183028', '#183028'])}${banner(610, 520, .8).replace(/#[0-9a-f]{6}/gi, m => m.toLowerCase() === '#fffaf0' ? m : '#183028')}</g>
      <g filter="url(#q-ds)">${heron(300, 110, 1, '#fffaf0')}${heron(350, 132, .8, '#fffaf0')}${heron(260, 140, .7, '#fffaf0')}</g>
      <rect width="960" height="540" filter="url(#q-gr)"/>`;
    return svg(defs, body);
  }

  // ---------- 3 · Lienzo de Tlaxcala ----------
  function lienzo() {
    const R = rnd(21), K = '#2a1a10', ink = `stroke="${K}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"`;
    const glosa = (x, y, t, s = 17) => `<text x="${x}" y="${y}" font-family="Alegreya, serif" font-style="italic" font-size="${s}" fill="#5a3418">${t}</text>`;
    const spiral = (x, y, s) => `<path d="M${x} ${y} c 0 ${-10 * s} ${15 * s} ${-10 * s} ${15 * s} 0 c 0 ${7 * s} ${-9 * s} ${7 * s} ${-9 * s} ${2 * s}" fill="none" ${ink}/>`;
    const foot = (x, y, a) => `<path transform="rotate(${a} ${x} ${y})" d="M${x} ${y} c -4 -10 6 -14 9 -6 c 2 6 -2 12 -9 6Z" fill="${K}"/>`;
    const plant = (x, y, s) => `<g transform="translate(${x} ${y}) scale(${s})"><path d="M0 0 V-90" ${ink}/>${[[-20, 1], [-40, -1], [-60, 1]].map(([yy, d]) => `<path d="M0 ${yy} C ${d * 20} ${yy - 22} ${d * 34} ${yy - 14} ${d * 38} ${yy + 4} C ${d * 26} ${yy - 4} ${d * 14} ${yy - 4} 0 ${yy + 6}Z" fill="#7aa45a" ${ink}/>`).join('')}<path d="M8 -50 C 2 -64 6 -76 14 -80 C 22 -76 24 -64 18 -50Z" fill="#e9b33e" ${ink}/><path d="M0 -90 l-8 -12 M0 -90 l0 -14 M0 -90 l8 -12" ${ink}/></g>`;
    const stains = Array.from({ length: 30 }, () => `<ellipse cx="${R() * 960}" cy="${R() * 540}" rx="${20 + R() * 70}" ry="${10 + R() * 40}" fill="#b8925a" opacity="${.05 + R() * .08}"/>`).join('');
    const defs = `<filter id="l-gr" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".7 .9" numOctaves="3" seed="5"/><feColorMatrix values="0 0 0 0 .45 0 0 0 0 .35 0 0 0 0 .2 0 0 0 -1.8 1"/><feComponentTransfer><feFuncA type="linear" slope=".45"/></feComponentTransfer></filter>
      <filter id="l-wob" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency=".04" numOctaves="2" seed="2"/><feDisplacementMap in="SourceGraphic" scale="3"/></filter>`;
    const body = `<rect width="960" height="540" fill="#ecdfc0"/>${stains}
      <g filter="url(#l-wob)">
        <rect x="14" y="14" width="932" height="512" fill="none" ${ink}/><rect x="22" y="22" width="916" height="496" fill="none" stroke="${K}" stroke-width="1.4"/>
        <g transform="translate(830 92)"><circle r="30" fill="#e9b33e" ${ink}/><circle r="16" fill="#c0392b" ${ink}/>${Array.from({ length: 8 }, (_, i) => `<path transform="rotate(${i * 45})" d="M-8 -32 L0 -50 L8 -32Z" fill="#e9b33e" ${ink}/>`).join('')}</g>
        <g transform="translate(470 0)"><path d="M-170 430 C -170 320 -110 196 0 188 C 110 196 170 320 170 430 Z" fill="#7aa45a" ${ink}/>
          <path d="M-160 350 C -100 332 100 332 160 350 C 166 380 170 410 170 430 L-170 430 C -170 410 -166 380 -160 350Z" fill="#4f86b8" ${ink}/>
          ${Array.from({ length: 6 }, (_, i) => spiral(-140 + i * 50, 398, 1.1)).join('')}
          ${[[-60, 260], [10, 230], [62, 290], [-24, 306], [100, 320], [-104, 316]].map(([x, y]) => `<circle cx="${x}" cy="${y}" r="7" fill="#c8e0a0" ${ink}/>`).join('')}
          <path d="M-28 196 C -18 172 18 172 28 196" fill="#f6efe0" ${ink}/>
          <rect x="-180" y="426" width="360" height="20" fill="#e9b33e" ${ink}/>${Array.from({ length: 9 }, (_, i) => `<rect x="${-172 + i * 40}" y="430" width="20" height="12" fill="#c0392b"/>`).join('')}</g>
        ${glosa(390, 178, 'matlalcueye')}
        ${teocalli(780, 446, 1.1, { a: '#f6efe0', b: '#d8c8a8', s: '#c0392b', r: '#c0392b', w: '#f6efe0' }, ink)}
        <path d="M780 300 c -10 -14 10 -22 0 -36 c -8 -12 8 -20 2 -30" fill="none" ${ink}/>
        ${glosa(728, 474, 'tlaxcallan · ocotelulco')}
        ${plant(90, 470, 1.2)}${plant(150, 480, .9)}${plant(210, 474, 1.05)}
        <path d="M30 500 C 200 488 360 520 520 500 C 680 482 800 512 930 498" stroke="#4f86b8" stroke-width="16" fill="none"/><path d="M30 500 C 200 488 360 520 520 500 C 680 482 800 512 930 498" stroke="${K}" stroke-width="2" fill="none" transform="translate(0 -9)"/><path d="M30 500 C 200 488 360 520 520 500 C 680 482 800 512 930 498" stroke="${K}" stroke-width="2" fill="none" transform="translate(0 9)"/>
        ${Array.from({ length: 14 }, (_, i) => `<circle cx="${50 + i * 64}" cy="${500 + Math.sin(i) * 6}" r="3" fill="#f6efe0" stroke="${K}" stroke-width="1.4"/>`).join('')}
        ${glosa(600, 530, 'atoyac', 14)}
        ${Array.from({ length: 10 }, (_, i) => foot(250 + i * 44, 470 - i * 4 + (i % 2) * 8, 80)).join('')}
        ${heron(250, 110, 1.2, '#fffaf0', K, 2.4)}${heron(310, 136, .9, '#fffaf0', K, 2.4)}
        <g transform="translate(660 486)"><path d="M0 0 C -2 -20 6 -34 18 -40 L28 -62 L24 -40 C 30 -30 28 -10 18 0Z" fill="#fffaf0" ${ink}/><path d="M6 0 V20 M14 0 V20" ${ink}/><circle cx="25" cy="-58" r="1.6" fill="${K}"/></g>
        ${glosa(40, 236, 'Tlaxcallan, año 1-ácatl', 20)}
      </g>
      <rect width="960" height="540" filter="url(#l-gr)"/>`;
    return svg(defs, body);
  }

  // ---------- 4 · Mural de Talavera ----------
  function talavera() {
    const R = rnd(31), C = '#1b3a8a', W = '#9fb4e0', O = '#d39a26', G = '#3d7a46';
    const br = `stroke="${C}" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round"`;
    const defs = `<filter id="t-br" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency=".05" numOctaves="2" seed="9"/><feDisplacementMap in="SourceGraphic" scale="3.5"/></filter>
      <pattern id="t-grid" width="60" height="60" patternUnits="userSpaceOnUse"><rect width="60" height="60" fill="url(#t-gl)"/><path d="M0 0.75 H60 M0.75 0 V60" stroke="#c9bfa8" stroke-width="1.5"/></pattern>
      <radialGradient id="t-gl" cx=".3" cy=".25" r=".9"><stop offset="0" stop-color="#fff" stop-opacity=".35"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#5a4a30" stop-opacity=".08"/></radialGradient>`;
    const hatch = Array.from({ length: 26 }, (_, i) => { const x = 330 + i * 6; return `<path d="M${x} ${330 - i * 4} l-26 ${60 + i}" stroke="${C}" stroke-width="1.6" opacity=".55"/>`; }).join('');
    const sky = Array.from({ length: 12 }, (_, i) => `<rect x="${R() * 700}" y="${30 + i * 13}" width="${120 + R() * 200}" height="7" rx="3.5" fill="${C}" opacity="${.08 + (12 - i) * .02}"/>`).join('');
    const clouds = [[140, 140], [600, 110], [380, 70]].map(([x, y]) => `<path d="M${x} ${y} a18 18 0 0 1 30 -14 a24 24 0 0 1 44 0 a18 18 0 0 1 30 14 Z" fill="#f6f1e6" ${br}/>`).join('');
    const body = `<rect width="960" height="540" fill="#f6f1e6"/>
      <g filter="url(#t-br)">${sky}${clouds}
        <g transform="translate(150 96) scale(.8)">${Array.from({ length: 16 }, (_, i) => `<path transform="rotate(${i * 22.5})" d="M0 -46 L0 -70" ${br}/>`).join('')}<circle r="40" fill="${O}" ${br}/><circle r="22" fill="#f2c94c" stroke="${C}" stroke-width="2"/></g>
        <path d="M-10 420 C 60 360 110 300 140 290 C 170 300 230 360 330 420Z" fill="${W}" opacity=".7" ${br}/>
        <path d="${MAL}" fill="${W}" ${br}/>${hatch}
        <path d="M400 220 C 430 196 452 184 472 182 C 492 184 512 194 540 214 C 528 226 516 222 506 232 C 494 222 484 238 472 228 C 460 238 450 224 438 232 C 428 222 414 228 400 220Z" fill="#fbf8f0" ${br}/>
        <path d="M472 186 L455 300 M472 186 L520 290 M472 186 L600 330" stroke="${C}" stroke-width="2" opacity=".7"/>
        <path d="${wave(408, 8, .014, 1)}" fill="#c8d4ee" ${br}/>
        ${Array.from({ length: 20 }, (_, i) => `<circle cx="${20 + i * 48}" cy="${404 + Math.sin(i) * 6}" r="${12}" fill="${G}" opacity=".85" ${br}/>`).join('')}
        ${teocalli(790, 432, 1, { a: '#fbf8f0', b: '#c8d4ee', s: C, r: O, w: '#fbf8f0' }, br)}
        <path d="${wave(440, 6, .02, 2)}" fill="#e6ecf8" ${br}/>
        ${milpa({ stem: C, leaf: G, cob: O, tas: O }, R, [[470, .8, 540], [500, .95, 500], [532, 1.1, 460]])}
        ${agave(640, 540, 1.3, [C, '#2f56b4', G], `stroke="${C}" stroke-width="1.6"`)}${agave(900, 540, 1.6, [C, '#2f56b4', G], `stroke="${C}" stroke-width="1.6"`)}
        ${heron(300, 120, 1, '#fbf8f0', C, 2.6)}${heron(350, 142, .8, '#fbf8f0', C, 2.6)}
      </g>
      <rect width="960" height="540" fill="url(#t-grid)"/>`;
    return svg(defs, body);
  }

  window.TlaxScenes = { plano, papel, lienzo, talavera };
})();
</script>
<script>
// Alternative character styles for the same cast (params from propuestas-v2/chars.js):
//  cuento — storybook proportions (~4.5 heads), soft shading, finer faces.
//  lienzo — Lienzo de Tlaxcala codex figure: profile head, frontal torso, thick ink line.
// The third style, "azulejo", is the chibi recoloured in cobalt by a CSS/SVG filter.
"use strict";
(function () {
  const sh = (h, k) => '#' + [1, 3, 5].map(i => Math.min(255, Math.round(parseInt(h.slice(i, i + 2), 16) * k)).toString(16).padStart(2, '0')).join('');

    // Props in front.
    if (p.prop === 'escudo') g += `<g transform="translate(96 108)"><circle r="18" fill="#f3ede2" ${ink}/><circle r="12" fill="${p.shield || '#2f5fa8'}" ${ink}/><path d="M-12 0 H12 M0 -12 V12" stroke="#f3ede2" stroke-width="2.6"/>${[-10, -3, 4, 11].map(x => `<path d="M${x} 16 l-2 10 h4Z" fill="#2f8f8a" ${ink}/>`).join('')}</g>`;
    if (p.prop === 'canasta') g += `<g transform="translate(98 112)"><path d="M-12 0 H12 L9 16 H-9Z" fill="#d8a85a" ${ink}/>${[-6, 0, 6].map((x, i) => `<circle cx="${x}" cy="-2" r="4" fill="${['#c0392b', '#e9b33e', '#7cb04a'][i]}" ${ink}/>`).join('')}</g>`;
    if (p.prop === 'jicara') g += `<g transform="translate(98 106)"><path d="M-12 0 C -12 12 12 12 12 0Z" fill="#a8522e" ${ink}/></g>`;
    if (p.prop === 'tambor') g += `<g transform="translate(102 112)"><rect x="-9" y="-12" width="18" height="26" fill="#a8522e" ${ink}/><path d="M-9 -12 H9" stroke="#f3ede2" stroke-width="3"/></g>`;
    if (p.prop === 'flores') g += `<g transform="translate(96 98)"><path d="M0 8 V-10" ${ink}/>${[[-5, -10], [5, -12], [0, -16]].map(([x, y]) => `<circle cx="${x}" cy="${y}" r="4.4" fill="#f29a1e" ${ink}/>`).join('')}</g>`;
    if (p.prop === 'cacao') g += `<path transform="translate(98 104)" d="M0 -12 C 9 -8 9 8 0 12 C -9 8 -9 -8 0 -12Z" fill="#a8521e" ${ink}/>`;
    if (p.prop === 'red') g += `<path transform="translate(100 108)" d="M-10 -10 L10 -10 L7 12 L-7 12Z" fill="none" ${ink}/>`;
    if (p.prop === 'panal') g += `<rect x="92" y="96" width="14" height="22" rx="5" fill="#c89a50" ${ink}/>`;
    return `<svg class="fig fig--lienzo" viewBox="0 -14 124 216" role="img" aria-label="${p.name}">${g}</svg>`;
  }

  window.TlaxFigs = { cuento, lienzo };
})();
</script>
<script>
// v3 options page: 4 title landscapes (with the Talavera menu) and 4 character styles.
"use strict";
(function () {
  const X = window.TlaxTex, SC = window.TlaxScenes, F = window.TlaxFigs, { chibi, CAST, PLAYER } = window.TlaxChars;
  const root = document.documentElement.style;
  root.setProperty('--deco', `url(${X.decoTile()})`); root.setProperty('--plain', `url(${X.plainTiles()})`); root.setProperty('--cobalt', `url(${X.cobaltTile()})`);

  const cacao = '<svg class="mini" viewBox="0 0 64 64"><path d="M32 6 C 50 14 50 50 32 58 C 14 50 14 14 32 6Z" fill="#a8521e" stroke="#3a2418" stroke-width="3"/></svg>';
  const glyph = `<svg class="glyph" viewBox="0 0 120 110"><path d="M14 104 C 14 60 34 30 60 30 C 86 30 106 60 106 104 Z" fill="#4f8f4a" stroke="#1a1410" stroke-width="4"/><path d="M14 92 H106 V104 H14Z" fill="#d39a26" stroke="#1a1410" stroke-width="4"/><ellipse cx="60" cy="30" rx="26" ry="7" fill="#f3e2b8" stroke="#1a1410" stroke-width="3"/><path d="M30 10 C 34 6 50 8 56 22 L48 24 C 44 18 38 16 32 18 Z" fill="#c48a5a" stroke="#1a1410" stroke-width="3"/><path d="M90 50 C 86 54 70 52 64 38 L72 36 C 76 42 82 44 88 42 Z" fill="#c48a5a" stroke="#1a1410" stroke-width="3"/></svg>`;
  const inicio = scene => `<div class="ab inicio">${scene}
    <div class="pnl logo">${glyph}<div><div class="logo__n">Tlaxcallan</div><div class="logo__t">Año 1-Ácatl · 1519 · llegan extranjeros por el oriente</div></div></div>
    <div class="pnl tmenu"><div class="tm tm--on" data-sel="tm"><span>Continuar</span><small>Día 3 · veintena Tlacaxipehualiztli · ${cacao} 900 300</small></div>
      <div class="tm" data-sel="tm"><span>Nueva partida</span><small>Hereda la milpa de tu abuela</small></div>
      <div class="tm" data-sel="tm"><span>Opciones</span><small>Volumen, idioma y mensajes</small></div>
      <div class="keys"><span><kbd>▲▼</kbd>elegir</span><span><kbd>Enter</kbd>aceptar</span></div></div>
    <div class="foot">Señorío de Tlaxcallan · Tepetícpac · Ocotelulco · Tizatlán · Quiahuiztlán · en guerra con Tenochtitlan</div></div>`;

  const LAND = [
    ['A', 'Plano geométrico', 'El estilo actual de tu juego, más pulido: facetas de luz y sombra, sol de atardecer, teocalli, casa de adobe con techo de paja y el estandarte de la garza blanca junto a la milpa.', SC.plano()],
    ['B', 'Papel recortado', 'Capas de papel de colores con sombra entre ellas, como un diorama o un papel picado. Se presta a parallax: cada capa puede moverse a distinta velocidad.', SC.papel()],
    ['C', 'Lienzo de Tlaxcala', 'Inspirado en el Lienzo de Tlaxcala, pintado por los tlaxcaltecas sobre la conquista: tinta negra sobre algodón y la Malinche como glifo de cerro con su falda azul. Lleva el río Atoyac, huellas como camino y glosas escritas a mano.', SC.lienzo()],
    ['D', 'Mural de Talavera', 'El paisaje pintado a pincel en cobalto, ocre y verde sobre azulejos con juntas y brillo. Combina directamente con los menús que te gustaron.', SC.talavera()],
  ];
  const SAMPLE = [PLAYER, CAST[2], CAST[4], CAST[8], CAST[9], CAST[11]];
  const cap = p => `<figcaption>${p.name}${p.romance ? ' ♥' : ''}<small>${p.role}</small></figcaption>`;
  const STY = [
    ['1', 'Chibi (el actual)', 'Cabeza grande y cuerpo pequeño, como los vecinos de tu plaza. Es el que te mandé antes, como referencia.', p => `<div class="niche">${chibi(p)}</div>`],
    ['2', 'Cuento ilustrado', 'Proporciones más reales (unas 4½ cabezas), caras más finas, ropa hasta el tobillo y sombreado suave. Más elegante y épico, y queda bien en retratos y escenas de diálogo.', p => `<div class="niche">${F.cuento(p)}</div>`],
    ['3', 'Lienzo de Tlaxcala', 'Como los códices: cabeza de perfil, torso de frente, tinta gruesa y colores planos. Incluye la vírgula de la palabra delante de la boca. Es el más tlaxcalteca y el más original.', p => `<div class="cotton">${F.lienzo(p)}</div>`],
    ['4', 'Azulejo pintado', 'Cada personaje pintado en cobalto sobre azulejo blanco, como una pieza de Talavera. Ideal para retratos en los menús, cartas o la pantalla de Vecinos.', p => `<div class="tilefig">${chibi(p)}</div>`],
  ];

  document.getElementById('app').innerHTML = `
    <section class="sec"><h2>Paisaje de inicio · 4 opciones</h2><p>Todas usan el menú de azulejo y ninguna es realista. Elige una o dime qué combinar.</p>
      <div class="opts">${LAND.map(([k, n, d, s]) => `<figure class="board"><div class="fit">${inicio(s)}</div><figcaption><b>${k} · ${n}</b> — ${d}</figcaption></figure>`).join('')}</div></section>
    <section class="sec"><h2>Personajes · 4 estilos</h2><p>Los mismos seis personajes en cada estilo: Tú, Nalin, Kaya, Naara, Yeyetzi y Yuki.</p>
      <div class="styles">${STY.map(([k, n, d, fn]) => `<div class="srow"><h3><span>ESTILO ${k}</span>${n}</h3><p>${d}</p><div class="line">${SAMPLE.map(p => `<figure>${fn(p)}${cap(p)}</figure>`).join('')}</div></div>`).join('')}</div></section>`;

  const fits = [...document.querySelectorAll('.fit')];
  const fit = () => fits.forEach(f => f.firstElementChild.style.setProperty('--k', f.clientWidth / 960));
  new ResizeObserver(fit).observe(document.body); fit();
  document.addEventListener('click', e => { const el = e.target.closest('[data-sel]'); if (!el) return; el.parentElement.querySelectorAll('[data-sel]').forEach(x => x.classList.toggle('tm--on', x === el)); });
})();
</script>
</body>
