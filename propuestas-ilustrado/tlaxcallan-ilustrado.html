<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tlaxcallan Ilustrado</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,500;0,700;0,800;1,500;1,700;1,800&family=Alegreya+Sans:wght@400;500;700;800&family=Alegreya+Sans+SC:wght@500;700;800&family=Fraunces:opsz,wght,SOFT,WONK@9..144,500..900,0..100,0..1&family=Yeseva+One&display=swap" rel="stylesheet">
<style>
/* Tlaxcallan — illustrated style proposals. Each artboard is 960×540 and is
   scaled to its column by app.js. Directions: .A Acuarela, .B Talavera, .C Cacaxtla. */

:root { --page: #1b1613; --page-ink: #f3e6cf; --muted: #bba88c; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--page); color: var(--page-ink); font-family: 'Alegreya Sans', system-ui, sans-serif; }
.page { max-width: 1640px; margin: 0 auto; padding: 48px 16px 80px; }
.intro { max-width: 760px; margin: 0 auto 40px; text-align: center; }
.intro h1 { font: 800 44px/1.05 'Fraunces', serif; margin: 0 0 12px; }
.intro p { font-size: 18px; color: var(--muted); margin: 0; text-wrap: pretty; }
.dir { margin: 0 0 64px; }
.dir__head { display: flex; flex-wrap: wrap; gap: 12px 28px; align-items: flex-end; justify-content: space-between; border-bottom: 1px solid #3a2f28; padding-bottom: 16px; margin-bottom: 24px; }
.dir__k { font: 800 13px 'Alegreya Sans SC', sans-serif; letter-spacing: 3px; color: #e3a83b; }
.dir__name { font: 700 34px/1.1 'Fraunces', serif; margin: 4px 0 6px; }
.dir__desc { max-width: 720px; font-size: 17px; color: var(--muted); margin: 0; text-wrap: pretty; }
.dir__spec { display: flex; flex-direction: column; gap: 8px; align-items: flex-end; font-size: 14px; color: var(--muted); }
.sw { display: flex; gap: 6px; }
.sw i { width: 28px; height: 28px; border-radius: 50%; border: 2px solid rgba(255,255,255,.15); }
.boards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 640px), 1fr)); gap: 28px; }
.board figcaption { font-size: 15px; color: var(--muted); margin-top: 10px; }
.board figcaption b { color: var(--page-ink); }
.board { margin: 0; }
.fit { position: relative; width: 100%; aspect-ratio: 960 / 540; border-radius: 6px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,.45); }
.fit > .ab { position: absolute; left: 0; top: 0; transform-origin: 0 0; transform: scale(var(--k, .5)); }

/* ---------- Artboard basics ---------- */
.ab { width: 960px; height: 540px; overflow: hidden; color: var(--ink); font-family: var(--body); font-size: 16px; }
.ab .bg { position: absolute; inset: 0; background: var(--scene) center / cover; }
.ab.menu .bg { inset: -24px; filter: blur(6px) saturate(.85); }
.veil { position: absolute; inset: 0; background: var(--veil); }
.panel { position: absolute; }
.ic { display: block; }
.hints { position: absolute; left: 0; right: 0; bottom: 14px; display: flex; justify-content: center; gap: 26px; font-size: 15px; color: #fff4e4; text-shadow: 0 1px 3px rgba(0,0,0,.6); }
.hints b { font-weight: 800; }

.A { --head: 'Fraunces', serif; --body: 'Alegreya Sans', sans-serif; --ink: #3b2a20; --soft: #7a5c48; --accent: #c8553d; --gold: #e3a83b; --veil: linear-gradient(rgba(40,26,46,.32), rgba(40,26,46,.55)); }
.B { --head: 'Alegreya', serif; --body: 'Alegreya Sans', sans-serif; --ink: #1d2a52; --soft: #5a6488; --accent: #1f3f8f; --gold: #e0a526; --veil: linear-gradient(rgba(10,18,48,.45), rgba(10,18,48,.65)); }
.C { --head: 'Yeseva One', serif; --body: 'Alegreya Sans', sans-serif; --ink: #1a1410; --soft: #6a4a36; --accent: #2e7896; --gold: #e9b33e; --red: #b8402e; --veil: linear-gradient(rgba(60,12,6,.35), rgba(40,8,4,.55)); }

/* Panels: A torn watercolour paper, B glazed tile with Talavera border, C fresco plaster. */
.A .panel, .C .panel { isolation: isolate; }
.A .panel::before { content: ''; position: absolute; inset: 0; z-index: -1; border-radius: 8px;
  background: radial-gradient(circle at 0 0, rgba(200,85,61,.22), transparent 38%), radial-gradient(circle at 100% 100%, rgba(227,168,59,.26), transparent 42%), radial-gradient(circle at 100% 0, rgba(122,154,106,.2), transparent 34%), var(--grain), #f7efe0;
  filter: url(#deckle) drop-shadow(0 10px 14px rgba(30,15,20,.45)); }
.B .panel { background: radial-gradient(120% 90% at 30% 0%, #fffdf7, #f3ecdc 60%, #e8dec8) padding-box, var(--tileB) 0 0 / 24px border-box; border: 14px solid transparent; border-radius: 4px;
  box-shadow: 0 0 0 3px #1f3f8f, inset 0 0 0 3px #1f3f8f, inset 0 0 0 6px #f6f1e6, inset 0 0 0 8px #e0a526, 0 14px 26px rgba(5,10,30,.55); }
.C .panel::before { content: ''; position: absolute; inset: 0; z-index: -1; border: 5px solid #1a1410; border-radius: 14px; background: var(--grain), radial-gradient(circle at 80% 20%, #f2e7d0, #e6d5b4); filter: url(#chip) drop-shadow(0 7px 0 rgba(26,20,16,.6)); }
.C .panel--band::after { content: ''; position: absolute; left: 14px; right: 14px; top: 10px; height: 14px; background: var(--fret) 0 0 / 28px 14px repeat-x; border: 2px solid #1a1410; border-radius: 3px; }

/* Selectable menu options. */
.opt { cursor: pointer; font-size: 19px; }
.A .opt { padding: 9px 16px; border-radius: 999px; font-weight: 600; }
.A .opt:hover { background: rgba(200,85,61,.12); }
.A .opt--on, .A .opt--on:hover { background: var(--accent); color: #fff8ec; box-shadow: 0 3px 0 #8f3524; }
.B .opt { padding: 9px 14px; background: #fbf8f0; border: 2px solid #1f3f8f; color: #1f3f8f; font: italic 700 20px var(--head); border-radius: 3px; }
.B .opt:hover { background: #fff3d2; }
.B .opt--on, .B .opt--on:hover { background: #1f3f8f; color: #fff; box-shadow: inset 0 0 0 2px #1f3f8f, inset 0 0 0 4px #e0a526; }
.C .opt { padding: 8px 18px; border: 3px solid #1a1410; border-radius: 999px; background: #f2e7d0; font: 19px var(--head); }
.C .opt:hover { background: #fff6e2; }
.C .opt--on, .C .opt--on:hover { background: var(--accent); color: #fff; box-shadow: 0 4px 0 #1a1410; }
.opt--danger { color: #b8402e; }

/* Buttons. */
.btn { cursor: pointer; text-align: center; font: 700 15px var(--body); padding: 7px 14px; }
.A .btn { border-radius: 999px; border: 2px solid rgba(120,80,50,.35); background: rgba(255,255,255,.35); }
.A .btn:hover { background: rgba(255,255,255,.7); }
.A .btn--main, .A .btn--main:hover { background: var(--accent); border-color: transparent; color: #fff8ec; box-shadow: 0 3px 0 #8f3524; }
.B .btn { border: 2px solid #1f3f8f; background: #fbf8f0; color: #1f3f8f; border-radius: 3px; }
.B .btn:hover { background: #fff3d2; }
.B .btn--main, .B .btn--main:hover { background: #1f3f8f; color: #fff; box-shadow: inset 0 0 0 2px #1f3f8f, inset 0 0 0 4px #e0a526; }
.C .btn { border: 3px solid #1a1410; background: #f2e7d0; border-radius: 999px; }
.C .btn:hover { background: #fff6e2; }
.C .btn--main, .C .btn--main:hover { background: var(--red); color: #fff4e0; box-shadow: 0 3px 0 #1a1410; }

/* Chips (shop categories, option toggles). */
.chips { display: flex; gap: 8px; }
.chip { cursor: pointer; padding: 4px 14px; font-weight: 700; font-size: 15px; }
.A .chip { border-radius: 999px; border: 2px solid rgba(120,80,50,.3); }
.A .chip--on { background: #e3a83b; border-color: transparent; color: #3b2a20; box-shadow: 0 2px 0 #a8742a; }
.B .chip { border: 2px solid #1f3f8f; color: #1f3f8f; background: #fbf8f0; border-radius: 3px; font-style: italic; font-family: var(--head); }
.B .chip--on { background: #1f3f8f; color: #fff; }
.C .chip { border: 3px solid #1a1410; border-radius: 999px; background: #f2e7d0; }
.C .chip--on { background: var(--accent); color: #fff; }

/* Meters and sliders. */
.meter { height: 10px; position: relative; }
.meter > i { position: absolute; left: 0; top: 0; bottom: 0; }
.A .meter { border-radius: 6px; background: rgba(120,80,50,.16); }
.A .meter > i { border-radius: 6px; box-shadow: inset 0 2px 0 rgba(255,255,255,.35); }
.B .meter { border: 2px solid #1f3f8f; background: #fff; height: 12px; }
.C .meter { border: 3px solid #1a1410; border-radius: 6px; background: #f6edda; height: 14px; }
.C .meter > i { border-radius: 3px; }
.slider { position: relative; height: 10px; }
.slider > i { position: absolute; left: 0; top: 0; bottom: 0; }
.slider > b { position: absolute; top: 50%; }
.A .slider { border-radius: 6px; background: rgba(120,80,50,.18); }
.A .slider > i { background: linear-gradient(90deg, #d97a50, #c8553d); border-radius: 6px; }
.A .slider > b { width: 22px; height: 22px; margin: -11px 0 0 -11px; border-radius: 50%; background: #e3a83b; border: 3px solid #fff4e0; box-shadow: 0 2px 4px rgba(0,0,0,.35); }
.B .slider { height: 12px; border: 2px solid #1f3f8f; background: #fff; }
.B .slider > i { background: #1f3f8f; }
.B .slider > b { width: 18px; height: 26px; margin: -13px 0 0 -9px; background: radial-gradient(circle, #e0a526 0 4px, #fbf8f0 5px); border: 2px solid #1f3f8f; border-radius: 3px; }
.C .slider { height: 14px; border: 3px solid #1a1410; border-radius: 8px; background: #f6edda; }
.C .slider > i { background: var(--accent); border-radius: 4px; }
.C .slider > b { width: 24px; height: 24px; margin: -12px 0 0 -12px; border-radius: 50%; background: #e9b33e; border: 3px solid #1a1410; }

/* Inventory slots. */
.slots { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 7px; }
.slot { position: relative; aspect-ratio: 1; display: flex; align-items: center; justify-content: center; cursor: pointer; }
.slot .ic { width: 74%; height: 74%; }
.slot .n { position: absolute; right: 4px; bottom: 1px; font-weight: 800; font-size: 14px; }
.slot .k { position: absolute; left: 5px; top: 2px; font-size: 11px; font-weight: 800; color: var(--soft); }
.A .slot { border-radius: 12px; background: rgba(160,120,80,.12); border: 2px solid rgba(120,80,50,.25); }
.A .slot--empty { background: rgba(160,120,80,.06); border-style: dashed; }
.A .slot:hover { border-color: #e3a83b; }
.A .slot--sel { border-color: #e3a83b; background: rgba(255,250,236,.8); box-shadow: 0 0 0 3px rgba(227,168,59,.45); }
.A .slot .n { color: #3b2a20; text-shadow: 0 0 3px #fff7ea, 0 0 3px #fff7ea; }
.B .slot { background: radial-gradient(circle at 0 0, #1f3f8f 0 5px, transparent 6px), radial-gradient(circle at 100% 0, #1f3f8f 0 5px, transparent 6px), radial-gradient(circle at 0 100%, #1f3f8f 0 5px, transparent 6px), radial-gradient(circle at 100% 100%, #1f3f8f 0 5px, transparent 6px), #fbf8f0; border: 2px solid #1f3f8f; }
.B .slot--empty { background: radial-gradient(circle at 50% 50%, rgba(31,63,143,.12) 0 6px, transparent 7px), #f4efe2; }
.B .slot:hover { border-color: #e0a526; }
.B .slot--sel { border: 3px solid #e0a526; background-color: #fff6dc; }
.B .slot .n { color: #1d2a52; text-shadow: 0 0 3px #fff; }
.B .slot .k { color: #1f3f8f; font-style: italic; font-family: var(--head); left: 9px; top: 3px; }
.C .slot { border-radius: 12px; background: #f2e7d0; border: 3px solid #1a1410; }
.C .slot--empty { background: #e2d2b2; }
.C .slot:hover { background: #fff6e2; }
.C .slot--sel { background: #c6e4ea; box-shadow: 0 0 0 3px var(--accent); }
.C .slot .n { color: #1a1410; text-shadow: 0 0 3px #f6edda; }
/* Mesoamerican dot-and-bar numerals for the C hotbar keys. */
.db { position: absolute; left: 5px; top: 4px; display: flex; flex-direction: column-reverse; gap: 2px; align-items: flex-start; }
.db span { display: flex; gap: 2px; }
.db i { width: 4px; height: 4px; border-radius: 50%; background: #1a1410; }
.db u { display: block; width: 14px; height: 3px; background: #1a1410; border-radius: 2px; }

.portrait { display: block; object-fit: cover; object-position: 50% 20%; }
.A .portrait { border-radius: 14px; border: 3px solid #fff4e0; box-shadow: 0 0 0 2px rgba(120,80,50,.3), 0 6px 12px rgba(40,20,10,.25); }
.B .portrait { border: 3px solid #1f3f8f; box-shadow: 0 0 0 4px #f6f1e6, 0 0 0 6px #e0a526; border-radius: 50% 50% 4px 4px / 30% 30% 4px 4px; }
.C .portrait { border: 5px solid #1a1410; border-radius: 16px; }

/* ---------- Title ---------- */
.logo { position: absolute; left: 0; right: 0; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; }
.logo__name { font-family: var(--head); line-height: 1; }
.logo__tag { font: 800 18px 'Alegreya Sans SC', sans-serif; letter-spacing: 6px; }
.tmenu { display: flex; flex-direction: column; gap: 6px; }
.tmenu__hint { font-size: 13px; text-align: center; color: var(--soft); padding-top: 2px; }

.A.title .logo { top: 38px; }
.A.title .logo__name { font-weight: 900; font-size: 100px; color: #fff4e2; letter-spacing: 1px; text-shadow: 0 4px 0 #b8432f, 0 10px 26px rgba(60,20,30,.55); font-variation-settings: 'SOFT' 100, 'WONK' 1; }
.A.title .logo__tag { color: #ffe8c8; text-shadow: 0 2px 6px rgba(60,20,30,.8); }
.A.title .tmenu { left: 50%; bottom: 40px; width: 300px; margin-left: -150px; padding: 18px 20px 14px; }

.B.title .strip { position: absolute; background: var(--tileB) 0 0 / 24px; }
.B.title .strip--t { left: 0; right: 0; top: 0; height: 24px; }
.B.title .strip--b { left: 0; right: 0; bottom: 0; height: 24px; }
.B.title .strip--l { top: 0; bottom: 0; left: 0; width: 24px; }
.B.title .strip--r { top: 0; bottom: 0; right: 0; width: 24px; }
.B.title .rim { position: absolute; inset: 24px; box-shadow: inset 0 0 0 3px #1f3f8f, inset 0 0 0 6px #e0a526; pointer-events: none; }
.B.title .logo { top: 50px; left: 50%; right: auto; transform: translateX(-50%); padding: 18px 54px 14px; background: radial-gradient(circle at 40% 0, #fffdf7, #efe6d2); border: 3px solid #1f3f8f; border-radius: 50% 50% 14px 14px / 34% 34% 14px 14px; box-shadow: inset 0 0 0 4px #f6f1e6, inset 0 0 0 6px #e0a526, 0 12px 26px rgba(0,0,0,.5); }
.B.title .logo__name { font-weight: 800; font-style: italic; font-size: 76px; color: #1f3f8f; }
.B.title .logo__tag { color: #9a6420; font-size: 16px; }
.B.title .tmenu { position: absolute; left: 0; right: 0; bottom: 50px; flex-direction: row; justify-content: center; gap: 14px; }
.B.title .tmenu .opt { width: 190px; text-align: center; box-shadow: 0 8px 16px rgba(0,0,0,.4); }
.B.title .tmenu .opt--on { box-shadow: inset 0 0 0 2px #1f3f8f, inset 0 0 0 4px #e0a526, 0 8px 16px rgba(0,0,0,.4); }
.B.title .tmenu__hint { position: absolute; left: 0; right: 0; bottom: 30px; color: #e8ecff; text-shadow: 0 1px 2px #000; }

.C.title .logo { top: 60px; }
.C.title .logo__name { font-size: 86px; color: #f6e3b8; text-shadow: 5px 5px 0 #1a1410; letter-spacing: 2px; }
.C.title .logo__tag { color: #e9b33e; text-shadow: 2px 2px 0 #1a1410; }
.C.title .tmenu { right: 56px; top: 222px; width: 240px; padding: 36px 18px 16px; }

/* ---------- Bolsa ---------- */
.tabs { position: absolute; top: 16px; left: 64px; display: flex; gap: 8px; z-index: 2; }
.tab { cursor: pointer; padding: 7px 16px; font: 700 18px var(--head); position: relative; isolation: isolate; }
.A .tab { color: #fff3e0; text-shadow: 0 1px 3px rgba(0,0,0,.5); }
.A .tab:hover { color: #ffd9a0; }
.A .tab--on, .A .tab--on:hover { color: #3b2a20; text-shadow: none; }
.A .tab--on::before { content: ''; position: absolute; inset: 0 -6px; z-index: -1; background: #f7efe0; border-radius: 50% 44% 52% 40% / 60% 50% 46% 55%; filter: url(#deckle); }
.B .tab { background: #fbf8f0; border: 2px solid #1f3f8f; color: #1f3f8f; font-style: italic; border-radius: 3px; }
.B .tab:hover { background: #fff3d2; }
.B .tab--on, .B .tab--on:hover { background: #1f3f8f; color: #fff; box-shadow: inset 0 0 0 2px #1f3f8f, inset 0 0 0 4px #e0a526; }
.C .tab { background: #eadcc0; border: 3px solid #1a1410; border-radius: 16px 16px 6px 6px; font-weight: 400; }
.C .tab:hover { background: #fff6e2; }
.C .tab--on, .C .tab--on:hover { background: var(--accent); color: #fff; }

.bag { left: 40px; right: 40px; top: 62px; bottom: 24px; padding: 22px 26px; display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 26px; }
.C .bag { padding-top: 38px; }
.B .bag { padding: 12px 18px; top: 66px; }
.who { display: flex; flex-direction: column; gap: 8px; }
.who .portrait { width: 220px; height: 176px; }
.who__line { display: flex; justify-content: space-between; align-items: baseline; }
.who__name { font: 700 22px var(--head); }
.who__rep { font-size: 14px; font-weight: 700; color: #2f8f8a; }
.stat-h { font: 700 17px var(--head); margin-top: 4px; }
.mrow { display: grid; grid-template-columns: 82px minmax(0, 1fr) 40px; gap: 8px; align-items: center; font-size: 15px; }
.mrow > :last-child { text-align: right; font-weight: 800; }
.bag-right { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.card { display: grid; grid-template-columns: 78px minmax(0, 1fr) 150px; gap: 14px; align-items: center; padding: 12px 14px; }
.A .card { background: rgba(255,250,238,.7); border-radius: 14px; border: 2px solid rgba(120,80,50,.18); }
.B .card { background: #fff; border: 2px solid #1f3f8f; box-shadow: inset 0 0 0 3px #fff, inset 0 0 0 4px rgba(224,165,38,.7); }
.C .card { background: #f6edda; border: 3px solid #1a1410; border-radius: 14px; }
.card__ic { width: 78px; height: 78px; display: flex; align-items: center; justify-content: center; }
.A .card__ic { background: radial-gradient(circle, rgba(227,168,59,.3), transparent 70%); }
.B .card__ic { background: radial-gradient(circle at 0 0, #1f3f8f 0 6px, transparent 7px), radial-gradient(circle at 100% 100%, #1f3f8f 0 6px, transparent 7px), #fbf8f0; border: 2px solid #1f3f8f; }
.C .card__ic { background: #e9b33e; border: 3px solid #1a1410; border-radius: 50%; }
.card__ic .ic { width: 62px; height: 62px; }
.card__name { font: 700 22px var(--head); line-height: 1.1; }
.card__kind { font: 800 11px 'Alegreya Sans SC', sans-serif; letter-spacing: 2px; color: #b8432f; }
.card__desc { font-size: 15px; line-height: 1.3; color: var(--soft); margin-top: 4px; text-wrap: pretty; }
.card__side { display: flex; flex-direction: column; gap: 6px; }
.card__info { display: flex; justify-content: space-between; font-size: 15px; padding-bottom: 4px; border-bottom: 2px dotted rgba(120,80,50,.35); }
.card__btns { display: flex; gap: 6px; }
.card__btns .btn { flex: 1; }
.slots-h { display: flex; justify-content: space-between; align-items: baseline; font-size: 15px; }
.slots-h b { font: 700 17px var(--head); }
.slots-h span { color: var(--soft); }

/* ---------- Tienda ---------- */
.shop-left { position: absolute; left: 40px; top: 26px; bottom: 26px; width: 250px; display: flex; flex-direction: column; gap: 14px; }
.shop-left .portrait { width: 250px; height: 214px; flex: none; }
.talk { position: relative; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; }
.C .talk { padding-top: 16px; }
.talk__who { font: 800 13px 'Alegreya Sans SC', sans-serif; letter-spacing: 2px; color: #2f8f8a; }
.talk__line { font-size: 17px; line-height: 1.3; text-wrap: pretty; }
.talk__more { align-self: flex-end; font-size: 13px; color: var(--soft); }
.friend { position: relative; padding: 10px 16px; display: flex; flex-direction: column; gap: 6px; font-weight: 700; font-size: 15px; }
.hearts { display: flex; gap: 4px; }
.hearts svg { width: 20px; height: 18px; }
.shop { left: 314px; right: 40px; top: 26px; bottom: 26px; padding: 20px 24px; display: flex; flex-direction: column; gap: 10px; }
.C .shop { padding-top: 36px; }
.B .shop { padding: 12px 18px; }
.shop-head { display: flex; justify-content: space-between; align-items: center; }
.shop-head__t { font: 700 26px var(--head); }
.purse { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 18px; padding: 4px 14px 4px 6px; }
.purse::before { content: ''; width: 22px; height: 22px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #a8643a, #5a2e18); box-shadow: inset 0 0 0 2px #3a1d10; }
.A .purse { background: #3b2a20; color: #f2c94c; border-radius: 999px; }
.B .purse { background: #1f3f8f; color: #fff3d2; border-radius: 3px; box-shadow: inset 0 0 0 2px #1f3f8f, inset 0 0 0 4px #e0a526; }

.qty { display: flex; align-items: center; justify-content: space-between; font-weight: 800; font-size: 17px; }

.B .qty u { border: 2px solid #1f3f8f; color: #1f3f8f; }

.C .qty u { border: 3px solid #1a1410; border-radius: 50%; background: #f2e7d0; }

.shop-foot { margin-top: auto; display: flex; justify-content: space-between; align-items: center; padding-top: 10px; border-top: 2px dotted rgba(120,80,50,.4); }

.shop-foot .btn { font-size: 17px; padding: 8px 20px; }

/* ---------- Pausa ---------- */
.phead { position: absolute; left: 0; right: 0; top: 34px; display: flex; flex-direction: column; align-items: center; gap: 6px; }

.A .phead__t { font-weight: 900; text-shadow: 0 4px 0 #b8432f, 0 10px 24px rgba(0,0,0,.5); }
.B .phead__t { font-weight: 800; font-style: italic; text-shadow: 0 3px 0 #1f3f8f, 0 6px 0 #e0a526; }
.C .phead__t { color: #f6e3b8; text-shadow: 4px 4px 0 #1a1410; }
.plist { left: 110px; top: 150px; width: 250px; padding: 18px; display: flex; flex-direction: column; gap: 6px; }

.B .plist { padding: 10px; }
.popts { left: 380px; right: 110px; top: 150px; padding: 22px 26px; display: flex; flex-direction: column; gap: 16px; }

.set { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 14px; align-items: center; font-size: 18px; }

<body>
<!-- Filters used by CSS for hand-made edges: torn paper (deckle) and chipped fresco (chip). -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <filter id="deckle" x="-4%" y="-4%" width="108%" height="108%"><feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="4" seed="7" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="9" xChannelSelector="R" yChannelSelector="G"/></filter>
  <filter id="chip" x="-4%" y="-4%" width="108%" height="108%"><feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="3" seed="4" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="6" xChannelSelector="R" yChannelSelector="G"/></filter>
</defs></svg>
<main class="page">
  <header class="intro">
    <h1>Tlaxcallan, ilustrado</h1>
    <p>Tres direcciones pintadas a mano para el nuevo estilo del juego, sin pixel art. Cada una incluye la pantalla de inicio y los menús Bolsa, Tienda y Pausa, con el mismo contenido que ya aprobaste. Puedes hacer clic en casillas, pestañas y opciones para ver los estados.</p>
  </header>
  <div id="dirs"></div>
</main>
<script>
// Illustrated (non-pixel) art for the Tlaxcallan style proposals: three title
// scenes, twelve item icons and two character portraits. Every piece is a
// standalone SVG turned into a data URL, so the browser rasterises it once and
// the painterly filters (turbulence + displacement) don't re-run per element.
"use strict";
(function () {
  const O = '#3a2418';
  const url = (vb, body, defs = '') => 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(
    `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${vb}">${defs}${body}</svg>`);
  const rnd = seed => () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
  // Wobbly "hand-drawn" edge: displaces the shape by fractal noise.
  const wob = (id, freq, scale, seed = 3) => `<filter id="${id}" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency="${freq}" numOctaves="3" seed="${seed}" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="${scale}" xChannelSelector="R" yChannelSelector="G"/></filter>`;
  // Paper/brush grain laid over a whole scene.
  const grain = (id, op) => `<filter id="${id}" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="3" seed="11" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 0.24 0 0 0 0 0.16 0 0 0 0 0.1 0 0 0 -2.4 1.25"/><feComponentTransfer><feFuncA type="linear" slope="${op}"/></feComponentTransfer></filter>`;
  const path = (pts) => pts.map(([x, y], i) => `${i ? 'L' : 'M'}${x.toFixed(1)} ${y.toFixed(1)}`).join('');
  const ridge = (f, y1 = 540, step = 8) => { const p = []; for (let x = -10; x <= 970; x += step) p.push([x, f(x)]); return path(p) + `L970 ${y1}L-10 ${y1}Z`; };

  // ---------- Shared painted elements ----------
  function maize(x, y, s, R, pal = { stem: '#4f7f2e', leaf: '#6fa23e', hi: '#9cc95a', cob: '#f0bd45', tas: '#e3b45a' }) {
    const h = (100 + R() * 30) * s; let g = '';
    g += `<path d="M${x} ${y} C ${x - 3 * s} ${y - h * .4} ${x + 3 * s} ${y - h * .7} ${x + 1 * s} ${y - h}" stroke="${pal.stem}" stroke-width="${3.4 * s}" fill="none" stroke-linecap="round"/>`;
    for (let k = 0; k < 4; k++) {
      const ly = y - h * (.25 + k * .17), d = k % 2 ? 1 : -1, L = (44 - k * 6) * s * (.85 + R() * .3);
      g += `<path d="M${x} ${ly} C ${x + d * L * .35} ${ly - 18 * s} ${x + d * L * .75} ${ly - 14 * s} ${x + d * L} ${ly + 6 * s} C ${x + d * L * .7} ${ly - 6 * s} ${x + d * L * .35} ${ly - 8 * s} ${x} ${ly + 5 * s} Z" fill="${k % 2 ? pal.leaf : pal.hi}" opacity=".95"/>`;
    }
    const ey = y - h * .48;
    g += `<ellipse cx="${x + 5 * s}" cy="${ey}" rx="${4 * s}" ry="${9 * s}" fill="${pal.cob}" transform="rotate(18 ${x + 5 * s} ${ey})"/><path d="M${x} ${ey + 8 * s} C ${x + 8 * s} ${ey + 2 * s} ${x + 9 * s} ${ey - 6 * s} ${x + 8 * s} ${ey - 10 * s}" stroke="${pal.hi}" stroke-width="${2.4 * s}" fill="none"/>`;
    const tx = x + s, ty = y - h;
    for (let k = -2; k <= 2; k++) g += `<path d="M${tx} ${ty} q ${k * 4 * s} ${-6 * s} ${k * 7 * s} ${-3 * s}" stroke="${pal.tas}" stroke-width="${1.6 * s}" fill="none"/>`;
    return g;
  }
  function maguey(x, y, s, back = '#3f6f5e', front = '#7fb09a', rim = '#d8c26a') {
    let g = '';
    [-72, 72, -52, 52, -30, 30, -12, 12, 0].forEach((a, i) => {
      const L = (78 - Math.abs(a) * .35) * s, w = 9 * s, b = i < 4;
      g += `<path transform="rotate(${a} ${x} ${y})" d="M${x - w} ${y} C ${x - w} ${y - L * .5} ${x - 2 * s} ${y - L * .85} ${x} ${y - L} C ${x + 2 * s} ${y - L * .85} ${x + w} ${y - L * .5} ${x + w} ${y} Z" fill="${b ? back : front}" stroke="${b ? '#2d4a40' : rim}" stroke-width="${1.2 * s}"/>`;
      if (!b) g += `<path transform="rotate(${a} ${x} ${y})" d="M${x - w * .3} ${y - 6 * s} C ${x - w * .3} ${y - L * .5} ${x - 1 * s} ${y - L * .8} ${x} ${y - L * .95}" stroke="#b9dccb" stroke-width="${1.4 * s}" fill="none" opacity=".7"/>`;
    });
    return g;
  }

  // ---------- A · Acuarela del amanecer ----------
  function sceneA() {
    const R = rnd(7);
    const h1 = x => 368 + 12 * Math.sin(x / 90) + 8 * Math.sin(x / 37 + 1);
    const h2 = x => 432 + 14 * Math.sin(x / 120 + 2) + 6 * Math.sin(x / 45);
    let trees = '';
    for (let x = 10; x < 960; x += 26 + R() * 30) {
      if (x > 820 && x < 900) continue;
      const y = h1(x) + 4, r = 9 + R() * 8;
      trees += `<circle cx="${x}" cy="${y - r * .6}" r="${r}" fill="#4c7038"/><circle cx="${x - r * .5}" cy="${y - r * .2}" r="${r * .7}" fill="#5c8440"/><circle cx="${x + r * .3}" cy="${y - r}" r="${r * .45}" fill="#7a9e4e"/>`;
    }
    let milpa = '';
    [[468, .62], [500, .8], [540, 1]].forEach(([y, s]) => {
      milpa += `<path d="M-10 ${y - 4 * s} C 150 ${y - 10 * s} 330 ${y - 6 * s} ${520 - (y - 468) * 2} ${y} L-10 ${y + 10} Z" fill="#7a5232" opacity=".9"/>`;
      for (let x = 6 + R() * 10; x < 500 - (y - 468) * 2.2; x += 26 * s + R() * 8) milpa += maize(x, y, s, R);
    });
    const stars = Array.from({ length: 40 }, () => `<circle cx="${R() * 960}" cy="${R() * 120}" r="${.6 + R() * 1.2}" fill="#fff" opacity="${.3 + R() * .5}"/>`).join('');
    const clouds = [[180, 150, 150, 18, '#f3a07f', .55], [430, 104, 210, 22, '#d97a85', .42], [700, 190, 170, 16, '#ffc28a', .6], [890, 120, 120, 14, '#e98a7a', .5], [90, 236, 100, 10, '#f0b090', .45]]
      .map(([x, y, w, h, c, o]) => `<ellipse cx="${x}" cy="${y}" rx="${w}" ry="${h}" fill="${c}" opacity="${o}"/><ellipse cx="${x + w * .2}" cy="${y - h * .6}" rx="${w * .5}" ry="${h * .8}" fill="${c}" opacity="${o * .8}"/>`).join('');
    const hy = h2(735);
    const defs = `<defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b2853"/><stop offset=".28" stop-color="#5d3c6c"/><stop offset=".5" stop-color="#b85c5f"/><stop offset=".66" stop-color="#ee9b5a"/><stop offset=".78" stop-color="#f8d18a"/></linearGradient>
      <radialGradient id="glow"><stop offset="0" stop-color="#ffe2a6" stop-opacity=".95"/><stop offset=".35" stop-color="#ffc276" stop-opacity=".45"/><stop offset="1" stop-color="#ffc276" stop-opacity="0"/></radialGradient>
      <linearGradient id="mal" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4b3866"/><stop offset=".47" stop-color="#6b4b78"/><stop offset=".55" stop-color="#9a6683"/><stop offset="1" stop-color="#c98a8a"/></linearGradient>
      <linearGradient id="haze" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6b48a" stop-opacity="0"/><stop offset=".5" stop-color="#f6b48a" stop-opacity=".5"/><stop offset="1" stop-color="#f6b48a" stop-opacity="0"/></linearGradient>
      <linearGradient id="near" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8cb655"/><stop offset="1" stop-color="#557f36"/></linearGradient>
      ${wob('wc', .013, 16)}${wob('wc2', .03, 6, 5)}<filter id="cl"><feGaussianBlur stdDeviation="6"/></filter>${grain('gr', .5)}
    </defs>`;
    const body = `<rect width="960" height="540" fill="url(#sky)"/>${stars}
      <circle cx="760" cy="330" r="280" fill="url(#glow)"/><circle cx="760" cy="330" r="50" fill="#fff3cf"/><circle cx="760" cy="330" r="38" fill="#fffbe8"/>
      <g filter="url(#cl)">${clouds}</g>
      <g filter="url(#wc)">
        <path d="M-10 368 L50 304 C 74 292 98 290 128 302 L196 334 C 236 312 262 302 300 322 L380 380 Z" fill="#b28caa" opacity=".9"/>
        <path d="M50 304 C 70 296 84 291 98 292 C 108 297 116 301 126 302 L108 314 L96 305 L82 316 Z" fill="#f6e2e6"/>
        <path d="M200 412 C 290 368 360 254 440 198 C 458 186 474 184 490 192 C 570 240 650 346 790 412 Z" fill="url(#mal)"/>
        <path d="M462 196 C 450 244 428 294 392 346 M446 206 C 420 250 380 300 330 356" stroke="#3f2d58" stroke-width="4" fill="none" opacity=".45"/>
        <path d="M482 196 C 504 252 536 304 580 354 M494 202 C 540 250 590 300 660 350" stroke="#f3ad94" stroke-width="4" fill="none" opacity=".5"/>
        <path d="M440 198 C 458 186 474 184 490 192 C 504 202 516 214 526 226 L510 220 L500 234 L488 218 L476 236 L464 216 L452 232 L444 214 L428 226 C 432 214 436 206 440 198 Z" fill="#fbe9e4"/>
        <path d="M440 198 C 450 192 458 188 466 187 L464 216 L452 232 L444 214 L428 226 C 432 214 436 206 440 198 Z" fill="#cdb6d2"/>
      </g>
      <rect x="0" y="320" width="960" height="110" fill="url(#haze)"/>
      <g filter="url(#wc2)">
        <path d="${ridge(h1)}" fill="#6f8f4a"/>${trees}
        <g transform="translate(860 ${h1(860) + 6})"><rect x="-22" y="-26" width="44" height="26" fill="#f4ead6"/><rect x="8" y="-26" width="14" height="26" fill="#d8c8aa"/><path d="M-7 0 V-12 a7 7 0 0 1 14 0 V0Z" fill="#3a2a3a"/><circle cx="0" cy="-30" r="10" fill="#e8d0b0"/><rect x="-1" y="-48" width="2" height="10" fill="#f4ead6"/>${[-30, 22].map(o => `<rect x="${o}" y="-56" width="10" height="56" fill="#f4ead6"/><rect x="${o + 7}" y="-56" width="3" height="56" fill="#d8c8aa"/><rect x="${o}" y="-26" width="10" height="26" fill="#c4583a"/><rect x="${o + 3}" y="-50" width="4" height="7" rx="2" fill="#3a2a3a"/><path d="M${o} -56 l5 -8 l5 8Z" fill="#c4583a"/>`).join('')}</g>
        <path d="${ridge(h2)}" fill="url(#near)"/><path d="${path(Array.from({ length: 124 }, (_, i) => [i * 8 - 10, h2(i * 8 - 10)]))}" stroke="#c4d77a" stroke-width="3" fill="none" opacity=".7"/>
        <path d="M560 540 C 600 500 650 470 700 ${hy + 8} L716 ${hy + 8} C 686 474 644 506 624 540 Z" fill="#dcb07a"/>
        <g transform="translate(735 ${hy + 10})"><rect x="-6" y="-44" width="78" height="44" fill="#e3c194"/><rect x="72" y="-44" width="22" height="44" fill="#c49c6c"/><path d="M-14 -40 L102 -40 L88 -64 L-2 -64 Z" fill="#b4482f"/>${Array.from({ length: 10 }, (_, i) => `<path d="M${-10 + i * 11} -40 L${i * 9.4} -64" stroke="#8a2f20" stroke-width="2"/>`).join('')}<rect x="26" y="-30" width="16" height="30" fill="#6a3e24"/><rect x="2" y="-32" width="14" height="12" fill="#3a2a3a"/><rect x="0" y="-20" width="18" height="3" fill="#f1e3c2"/><rect x="52" y="-12" width="10" height="12" fill="#b8432f"/><circle cx="54" cy="-15" r="3" fill="#e05a7a"/><circle cx="60" cy="-16" r="3" fill="#f2c94c"/></g>
        ${Array.from({ length: 8 }, (_, i) => `<rect x="${840 + i * 16}" y="${hy - 6}" width="3" height="22" fill="#6a4428"/>`).join('')}<rect x="840" y="${hy}" width="120" height="3" fill="#8a5a34"/><rect x="840" y="${hy + 8}" width="120" height="3" fill="#8a5a34"/>
        ${milpa}
        ${maguey(912, 548, 1.3)}${maguey(820, 540, .85)}${maguey(530, 548, .8)}
        ${Array.from({ length: 50 }, () => { const x = 520 + R() * 440, y = 470 + R() * 70; return `<circle cx="${x}" cy="${y}" r="${1.5 + R() * 2}" fill="${R() < .5 ? '#f2c94c' : '#f6f2ea'}"/>`; }).join('')}
      </g>
      <path d="M300 140 q6 -6 12 0 q6 -6 12 0 M330 156 q5 -5 10 0 q5 -5 10 0 M286 160 q4 -4 8 0 q4 -4 8 0" stroke="#2a1a38" stroke-width="2.4" fill="none"/>
      <rect width="960" height="540" filter="url(#gr)"/>`;
    return url('0 0 960 540', body, defs);
  }

  // ---------- B · Talavera al anochecer ----------
  function sceneB() {
    const R = rnd(21);
    const stars = Array.from({ length: 70 }, () => `<circle cx="${R() * 960}" cy="${R() * 200}" r="${.6 + R() * 1.3}" fill="#fff" opacity="${.3 + R() * .6}"/>`).join('');
    const pal = ['#e4b05a', '#c8553d', '#e9dcc0', '#3f6fb0', '#d98a4a', '#f1e3c2', '#7a9a6a'];
    let town = '', x = -10;
    while (x < 970) {
      const w = 70 + R() * 60, h = 64 + R() * 54, c = pal[Math.floor(R() * pal.length)], top = 432 - h;
      if (x > 560 && x < 640) { x = 650; continue; }
      town += `<rect x="${x}" y="${top}" width="${w}" height="${h}" fill="${c}"/><rect x="${x - 3}" y="${top - 6}" width="${w + 6}" height="8" fill="#5a3a2a" opacity=".55"/>`;
      for (let wx = x + 12; wx < x + w - 18; wx += 26) {
        const lit = R() < .65;
        town += `<path d="M${wx} ${top + 46} v-16 a7 7 0 0 1 14 0 v16Z" fill="${lit ? '#f8cf6a' : '#2a2a4a'}"/>${lit ? `<circle cx="${wx + 7}" cy="${top + 38}" r="16" fill="#ffd57a" opacity=".18"/>` : ''}`;
      }
      if (h > 90) town += `<path d="M${x + w / 2 - 10} 432 v-26 a10 10 0 0 1 20 0 v26Z" fill="#3a2430"/>`;
      x += w + 2;
    }
    // Convent tower with Talavera dome.
    town += `<rect x="572" y="232" width="56" height="200" fill="#efe3c8"/><rect x="612" y="232" width="16" height="200" fill="#cdbd9e"/><path d="M584 300 v-26 a16 16 0 0 1 32 0 v26Z" fill="#2a2a4a"/><path d="M590 296 v-18 a10 10 0 0 1 20 0 v18Z" fill="#f8cf6a" opacity=".85"/><rect x="566" y="226" width="68" height="10" fill="#d8c8aa"/>
      <path d="M572 226 C 572 186 628 186 628 226 Z" fill="#2f5fa8"/>${Array.from({ length: 5 }, (_, i) => `<path d="M${578 + i * 11} 224 C ${580 + i * 11} 202 ${588 + i * 9} 194 600 190" stroke="#f6f1e6" stroke-width="2" fill="none"/>`).join('')}<rect x="598" y="166" width="4" height="22" fill="#e0a526"/><rect x="592" y="172" width="16" height="4" fill="#e0a526"/>`;
    const strings = [[0, 250, 480, 300], [480, 300, 960, 240]].map(([x1, y1, x2, y2], si) => {
      const mx = (x1 + x2) / 2, my = Math.max(y1, y2) + 50; let s = `<path d="M${x1} ${y1} Q ${mx} ${my} ${x2} ${y2}" stroke="#2a2440" stroke-width="2" fill="none"/>`;
      for (let t = .04; t < 1; t += .055) {
        const px = (1 - t) ** 2 * x1 + 2 * (1 - t) * t * mx + t * t * x2, py = (1 - t) ** 2 * y1 + 2 * (1 - t) * t * my + t * t * y2;
        const c = ['#e05a7a', '#f2c94c', '#2f8f8a', '#f6f1e6', '#e07a28'][Math.floor(t * 18 + si) % 5];
        s += `<path d="M${px - 9} ${py} h18 v20 l-4.5 -4 l-4.5 4 l-4.5 -4 l-4.5 4Z" fill="${c}" opacity=".95"/><circle cx="${px}" cy="${py + 9}" r="2.5" fill="#1a2244" opacity=".5"/>`;
      }
      return s;
    }).join('');
    const lanterns = [[150, 300], [330, 330], [690, 320], [840, 290]].map(([x, y]) => `<circle cx="${x}" cy="${y}" r="40" fill="url(#lg)"/><path d="M${x} ${y - 30} v14" stroke="#2a2440" stroke-width="2"/><ellipse cx="${x}" cy="${y}" rx="11" ry="14" fill="#f6a640"/><ellipse cx="${x - 3}" cy="${y - 3}" rx="4" ry="6" fill="#ffe2a0"/>`).join('');

  // ---------- Item icons (64×64) ----------

      <path d="M72 62 C 86 52 104 50 118 55 M64 76 C 70 66 78 60 88 58" stroke="#4a3a35" stroke-width="3" fill="none" stroke-linecap="round" opacity=".85"/>
      <path d="M57 86 C 80 74 120 74 143 86 L143 97 C 120 85 80 85 57 97 Z" fill="#c0392b" stroke="${O}" stroke-width="1.5"/><path d="M58 91 C 80 80 120 80 142 91" stroke="#e8c070" stroke-width="2.2" fill="none"/>
      <g transform="rotate(16 140 82)"><path d="M140 84 C 126 60 130 28 146 12 C 158 34 156 62 140 84 Z" fill="#e07a28" stroke="${O}" stroke-width="1.5"/><path d="M146 16 C 151 24 153 34 152 42 C 146 36 143 26 146 16 Z" fill="#c0392b"/><path d="M140 84 C 142 60 144 38 146 14" stroke="#7a3a1e" stroke-width="1.6" fill="none"/></g>
      <g transform="translate(140 182)"><path d="M40 50 C 58 50 60 32 50 28" stroke="${O}" stroke-width="7" fill="none" stroke-linecap="round"/><path d="M40 50 C 58 50 60 32 50 28" stroke="#e0893a" stroke-width="4.4" fill="none" stroke-linecap="round"/>
        <path d="M8 58 C 4 38 10 24 24 22 C 38 24 44 38 40 58 Z" fill="#f6efe4" stroke="${O}" stroke-width="1.6"/><path d="M26 26 C 36 28 42 40 40 58 L31 58 C 33 42 31 34 26 26 Z" fill="#e0893a"/>
        <circle cx="22" cy="18" r="13" fill="#f6efe4" stroke="${O}" stroke-width="1.6"/><path d="M11 12 L12 0 L20 7 Z" fill="#e0893a" stroke="${O}" stroke-width="1.4"/><path d="M24 7 L33 0 L34 12 Z" fill="#f6efe4" stroke="${O}" stroke-width="1.4"/><path d="M10 15 C 12 6 18 6 21 8 C 18 12 14 16 10 15Z" fill="#e0893a"/>
        <ellipse cx="17" cy="18" rx="1.7" ry="2.5" fill="#2a1712"/><ellipse cx="27" cy="18" rx="1.7" ry="2.5" fill="#2a1712"/><path d="M21 22 L23.4 22 L22.2 23.6 Z" fill="#d06a6a"/></g>`;
    return url('0 0 200 240', `<g filter="url(#r)">${body}</g>`, `<defs>${wob('r', .05, 2.4, 3)}</defs>`);
  }
  function portraitCit(bg) {
    const sk = { b: '#b07a48', s: '#875630', h: '#cc955f' }, H = '#1a1010';
    const dia = Array.from({ length: 7 }, (_, i) => `<path d="M${77 + i * 8} 196 l4 -5 l4 5 l-4 5Z" fill="${i % 2 ? '#e05a7a' : '#2f5fa8'}"/>`).join('');
    const body = `${bg}<path d="M52 92 C 44 140 44 196 36 240 L164 240 C 156 196 156 140 148 92 C 146 46 54 46 52 92 Z" fill="${H}"/>
      <path d="M16 240 C 20 202 50 184 80 178 L120 178 C 150 184 180 202 184 240 Z" fill="#f6f2ea" stroke="${O}" stroke-width="1.6"/><path d="M142 184 C 162 194 178 212 184 240 L154 240 C 154 214 152 198 142 184 Z" fill="#dcd2c2"/>
      ${face(sk, `<path d="M91 139 C 96 143 104 143 109 139 C 105 146 95 146 91 139 Z" fill="#a8483e"/>`)}
      <path d="M72 180 L128 180 L124 204 L76 204 Z" fill="none" stroke="#2f8f8a" stroke-width="6" stroke-linejoin="round"/>${dia}
      <path d="M24 226 C 70 218 130 218 176 226 L178 240 L22 240 Z" fill="#2f5fa8"/><path d="M24 226 C 70 218 130 218 176 226" stroke="#f2c94c" stroke-width="3" fill="none" stroke-dasharray="6 5"/>
      ${eyes(true)}
      <path d="M58 98 C 52 134 54 170 46 214 L60 214 C 62 170 62 134 66 104 Z M142 98 C 148 134 146 170 154 214 L140 214 C 138 170 138 134 134 104 Z" fill="${H}"/>
      <path d="M100 47 C 72 47 54 70 56 106 C 62 88 76 72 100 64 Z M100 47 C 128 47 146 70 144 106 C 138 88 124 72 100 64 Z" fill="${H}"/><path d="M100 48 L100 64" stroke="${sk.s}" stroke-width="2"/>
      <path d="M86 54 C 74 60 66 72 62 86 M114 54 C 126 60 134 72 138 86" stroke="#3e2e2e" stroke-width="3" fill="none" stroke-linecap="round"/>
      <g transform="translate(140 70)"><path d="M-4 6 C -14 10 -18 18 -16 22 C -8 20 -4 14 -4 6Z" fill="#4f8a36"/>${[0, 72, 144, 216, 288].map(a => `<ellipse cx="0" cy="-8" rx="6" ry="9" transform="rotate(${a})" fill="#e05a7a" stroke="${O}" stroke-width="1.2"/>`).join('')}<circle r="4.5" fill="#f2c94c" stroke="${O}" stroke-width="1.2"/></g>
      ${[60, 140].map(x => `<circle cx="${x}" cy="126" r="3.4" fill="#e9b33e" stroke="${O}" stroke-width="1"/><path d="M${x} 129 l-4 9 h8Z" fill="#e9b33e" stroke="${O}" stroke-width="1"/>`).join('')}`;
    return url('0 0 200 240', `<g filter="url(#r)">${body}</g>`, `<defs>${wob('r', .05, 2.4, 5)}</defs>`);
  }

  // Runtime textures used by the CSS (grain, Talavera tile, stepped fret).
  function grainTexture() {
    const c = document.createElement('canvas'); c.width = c.height = 220;
    const g = c.getContext('2d'), img = g.createImageData(220, 220), R = rnd(5);
    for (let i = 0; i < img.data.length; i += 4) { const v = 60 + R() * 80; img.data[i] = v; img.data[i + 1] = v * .85; img.data[i + 2] = v * .7; img.data[i + 3] = R() * 34; }
    g.putImageData(img, 0, 0);
    for (let k = 0; k < 26; k++) { g.strokeStyle = `rgba(120,90,60,${.05 + R() * .08})`; g.lineWidth = .6; g.beginPath(); const x = R() * 220, y = R() * 220; g.moveTo(x, y); g.quadraticCurveTo(x + 10, y + R() * 8, x + 12 + R() * 14, y + R() * 6); g.stroke(); }
    return `url(${c.toDataURL()})`;
  }
  const svgCss = s => `url("data:image/svg+xml;charset=utf-8,${encodeURIComponent(s)}")`;
  const tile = (bg, blue, gold) => svgCss(`<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"><rect width="24" height="24" fill="${bg}"/><path d="M12 3C15 7 15 9 12 12C9 9 9 7 12 3ZM12 21C9 17 9 15 12 12C15 15 15 17 12 21ZM3 12C7 9 9 9 12 12C9 15 7 15 3 12ZM21 12C17 15 15 15 12 12C15 9 17 9 21 12Z" fill="${blue}"/><circle cx="12" cy="12" r="2.2" fill="${gold}"/><path d="M0 0h5a5 5 0 0 1-5 5zM24 0v5a5 5 0 0 1-5-5zM0 24v-5a5 5 0 0 1 5 5zM24 24h-5a5 5 0 0 1 5-5z" fill="${blue}"/></svg>`);
  const fret = svgCss(`<svg xmlns="http://www.w3.org/2000/svg" width="32" height="16"><rect width="32" height="16" fill="#b8402e"/><path d="M0 14h8v-8h8v-4h4v12h8v-8h4" stroke="#1a1410" stroke-width="2.4" fill="none"/><path d="M0 14h8v-8h8v-4h4v12h8v-8h4" stroke="#e9b33e" stroke-width="1" fill="none"/></svg>`);

  window.TlaxArt = { sceneA, sceneB, sceneC, icon, portraitTu, portraitCit, grainTexture, tile, fret };
})();
</script>
<script>
// Builds the proposal page: 3 directions × (Inicio, Bolsa, Tienda, Pausa).
// Screens are static mockups; hover states are live, slots/rows/options are clickable.
"use strict";
(function () {
  const A = window.TlaxArt, root = document.documentElement.style;
  root.setProperty('--grain', A.grainTexture());
  root.setProperty('--tileB', A.tile('#f6f1e6', '#1f3f8f', '#e0a526'));
  root.setProperty('--fret', A.fret);

  const DIRS = [
    { id: 'A', k: 'DIRECCIÓN A', name: 'Acuarela del amanecer', desc: 'La Malinche al amanecer pintada en acuarela. Paneles de papel con bordes rasgados y manchas de color, tipografía suave y redondeada. Cálido, sereno, de cuento.', sw: ['#c8553d', '#e3a83b', '#7a9a6a', '#6b4b78', '#f7efe0'], type: 'Fraunces + Alegreya Sans', scene: A.sceneA() },
    { id: 'B', k: 'DIRECCIÓN B', name: 'Talavera al anochecer', desc: 'La plaza de Tlaxcala en la hora azul, con kiosco, papel picado y faroles. Los menús son azulejos de Talavera pintados a mano en azul cobalto con toques de oro.', sw: ['#1f3f8f', '#e0a526', '#f6f1e6', '#c8553d', '#0d1a40'], type: 'Alegreya cursiva + Alegreya Sans', scene: A.sceneB() },
    { id: 'C', k: 'DIRECCIÓN C', name: 'Mural de Cacaxtla', desc: 'Fresco rojo ocre como los murales de Cacaxtla. La Malinche aparece como glifo de cerro con su falda azul (Matlalcueye). Contornos negros gruesos, azul maya y greca escalonada; las teclas se numeran con puntos y barras.', sw: ['#a63a2b', '#2e7896', '#e9b33e', '#4f8f4a', '#1a1410'], type: 'Yeseva One + Alegreya Sans', scene: A.sceneC(), bg: A.sceneC(false) },
  ];
  const bgTile = { A: '#f3e2c8', B: '#dfe6f6', C: '#e9b33e' };
  const portrait = (fn, id) => fn(`<rect width="200" height="240" fill="${bgTile[id]}"/>` + (id === 'A' ? '<circle cx="150" cy="60" r="70" fill="#f6c88a" opacity=".6"/><circle cx="40" cy="200" r="60" fill="#b9cf8a" opacity=".5"/>' : id === 'B' ? '<path d="M0 0h200v240H0z" fill="none"/><circle cx="100" cy="100" r="90" fill="#c5d2f0"/>' : '<circle cx="100" cy="96" r="84" fill="#d98a3a"/>'));

  const ITEMS = {
    maiz: 'Maíz', maizAzul: 'Maíz azul', frijol: 'Frijol', calabaza: 'Calabaza', chile: 'Chile', nopal: 'Nopal',
    tuna: 'Tuna', maguey: 'Maguey', pulque: 'Pulque', tortilla: 'Tortillas', coa: 'Coa', cantaro: 'Cántaro',
  };
  const BAR = [['coa', ''], ['cantaro', ''], ['maiz', 12], ['frijol', 19], ['calabaza', 3], ['chile', 8], ['tuna', 7], ['nopal', 5], ['pulque', 2], ['tortilla', 6]];
  const BAG = [['maizAzul', 4], ['maguey', 1], ['frijol', 6], ['tortilla', 3], ['coa', '']];
  const SHOP = [['maizAzul', 'Semilla de maíz azul', 'Brota en 6 días', 12, 3], ['frijol', 'Semilla de frijol', 'Junto al maíz', 6, 0], ['calabaza', 'Semilla de calabaza', 'Cubre la milpa', 10, 0], ['chile', 'Semilla de chile', 'Para la salsa', 8, 0], ['nopal', 'Penca de nopal', 'Crece en cualquier tierra', 5, 0]];

  const ic = (k, cls = 'ic') => `<img class="${cls}" src="${A.icon(k)}" alt="${ITEMS[k]}">`;
  // Mesoamerican numerals: bars are 5, dots are units; 0 key = 10 (two bars).
  const dotBar = n => { const bars = Math.floor(n / 5), dots = n % 5; return `<span class="db">${'<u></u>'.repeat(bars)}${dots ? `<span>${'<i></i>'.repeat(dots)}</span>` : ''}</span>`; };
  const slot = (d, s, i, bar) => `<div class="slot${s ? '' : ' slot--empty'}${bar && i === 1 ? ' slot--sel' : ''}" data-sel="slot">${s ? ic(s[0]) : ''}${bar ? (d === 'C' ? dotBar(i + 1) : `<span class="k">${(i + 1) % 10}</span>`) : ''}${s && s[1] !== '' ? `<span class="n">${s[1]}</span>` : ''}</div>`;
  const meter = (w, c) => `<div class="meter"><i style="width:${w}%;background:${c}"></i></div>`;
  const band = d => d === 'C' ? ' panel--band' : '';

  function title(d) {
    const opts = ['Nueva partida', 'Continuar', 'Opciones'].map((t, i) => `<div class="opt${i ? '' : ' opt--on'}" data-sel="opt">${t}</div>`).join('');
    const frame = d.id === 'B' ? '<div class="strip strip--t"></div><div class="strip strip--b"></div><div class="strip strip--l"></div><div class="strip strip--r"></div><div class="rim"></div>' : '';
    const menu = d.id === 'B' ? `<div class="tmenu">${opts}</div><div class="tmenu__hint">◂ ▸ + Enter</div>` : `<div class="tmenu panel${band(d.id)}">${opts}<div class="tmenu__hint">${d.id === 'C' ? '▲▼ + Enter' : '▲▼ + Enter'}</div></div>`;
    return `<div class="ab title ${d.id}"><div class="bg" style="--scene:url('${d.scene}')"></div>${frame}
      <div class="logo"><div class="logo__name">Tlaxcallan</div><div class="logo__tag">Tierra del maíz</div></div>${menu}</div>`;
  }

  function bag(d) {
    const tabs = ['Bolsa', 'Habilidades', 'Vecinos', 'Mapa', 'Diario'].map((t, i) => `<div class="tab${i ? '' : ' tab--on'}" data-sel="tab">${t}</div>`).join('');
    const bagSlots = Array.from({ length: 20 }, (_, i) => slot(d.id, BAG[i], i, false)).join('');
    return `<div class="ab menu ${d.id}"><div class="bg" style="--scene:url('${d.bg || d.scene}')"></div><div class="veil"></div>
      <div class="tabs">${tabs}</div>
      <div class="panel bag${band(d.id)}">
        <div class="who">
          <img class="portrait" src="${portrait(A.portraitTu, d.id)}" alt="Tu personaje">
          <div class="who__line"><span class="who__name">Tú</span><span class="who__rep">Respetado +43</span></div>
          <div class="stat-h">Estado</div>
          <div class="mrow"><span>Vida</span>${meter(85, '#d94a3a')}<span>85</span></div>
          <div class="mrow"><span>Energía</span>${meter(92, '#5aa84a')}<span>92</span></div>
          <div class="stat-h">Oficios</div>
          <div class="mrow"><span>Milpa</span>${meter(65, '#7cb04a')}<span>Nv. 3</span></div>
          <div class="mrow"><span>Recolección</span>${meter(30, '#e3a83b')}<span>Nv. 2</span></div>
          <div class="mrow"><span>Templos</span>${meter(17, '#2f5fa8')}<span>1/6</span></div>
        </div>
        <div class="bag-right">
          <div class="card"><div class="card__ic">${ic('cantaro')}</div>
            <div><div class="card__name">Cántaro</div><div class="card__kind">Herramienta</div><div class="card__desc">Riega 3 surcos por llenada. Rellénalo en el río o en el apantle.</div></div>
            <div class="card__side"><div class="card__info"><span>Agua</span><b>8 / 10</b></div><div class="card__btns"><div class="btn btn--main">Usar</div><div class="btn">Soltar</div></div></div>
          </div>
          <div class="slots-h"><b>Barra</b><span>teclas 1–0 · Q ⇄ bolsa</span></div>
          <div class="slots">${BAR.map((s, i) => slot(d.id, s, i, true)).join('')}</div>
          <div class="slots-h"><b>Bolsa 1/3</b><span>◂ ▸ cambiar bolsa</span></div>
          <div class="slots">${bagSlots}</div>
        </div>
      </div></div>`;
  }

  const heart = on => `<svg viewBox="0 0 20 18"><path d="M10 17 C 4 12 1 9 1 5.5 C 1 3 3 1 5.5 1 C 7.5 1 9 2.2 10 4 C 11 2.2 12.5 1 14.5 1 C 17 1 19 3 19 5.5 C 19 9 16 12 10 17 Z" fill="${on ? '#d94a3a' : 'rgba(120,80,50,.18)'}" stroke="${on ? '#8f2a24' : 'rgba(120,80,50,.4)'}" stroke-width="1.4"/></svg>`;
  function shop(d) {
    const rows = SHOP.map(([k, n, desc, p, q], i) => `<div class="row${i ? '' : ' row--sel'}" data-sel="row">${ic(k)}<div><div class="row__name">${n}</div><div class="row__desc">${desc}</div></div><span class="row__price">${p} cacao</span><div class="qty"><u>−</u><span>${q}</span><u>+</u></div></div>`).join('');
    return `<div class="ab menu ${d.id}"><div class="bg" style="--scene:url('${d.bg || d.scene}')"></div><div class="veil"></div>
      <div class="shop-left">
        <img class="portrait" src="${portrait(A.portraitCit, d.id)}" alt="Citlalmina">
        <div class="talk panel${band(d.id)}"><div class="talk__who">Citlalmina</div><div class="talk__line">Ya casi es la fiesta de Nezahual. ¿Llevas algo para la ofrenda?</div><div class="talk__more">▼</div></div>
        <div class="friend panel"><span>Amistad</span><div class="hearts">${Array.from({ length: 8 }, (_, i) => heart(i < 5)).join('')}</div></div>
      </div>
      <div class="panel shop${band(d.id)}">
        <div class="shop-head"><span class="shop-head__t">Puesto del tianguis</span><span class="purse">1888 cacao</span></div>
        <div class="chips"><span class="chip chip--on" data-sel="chip">Semillas</span><span class="chip" data-sel="chip">Comida</span><span class="chip" data-sel="chip">Ofrendas</span></div>
        <div class="rows">${rows}</div>
        <div class="shop-foot"><span class="shop-foot__t">Total: <b>36 cacao</b></span><div class="card__btns"><div class="btn">Vender</div><div class="btn btn--main">Comprar</div></div></div>
      </div></div>`;
  }

  function pause(d) {
    const list = ['Reanudar', 'Guardar partida', 'Opciones', 'Controles', 'Salir al menú'].map((t, i) => `<div class="opt${i === 2 ? ' opt--on' : ''}${i === 4 ? ' opt--danger' : ''}" data-sel="opt">${t}</div>`).join('');
    const slider = (l, v) => `<div class="set set--num"><span>${l}</span><div class="slider"><i style="width:${v * 10}%"></i><b style="left:${v * 10}%"></b></div><span>${v}</span></div>`;
    return `<div class="ab menu ${d.id}"><div class="bg" style="--scene:url('${d.bg || d.scene}')"></div><div class="veil"></div>
      <div class="phead"><div class="phead__t">Pausa</div><div class="phead__d">Verano 2 · Año 1 · 12:30 pm · Tormenta</div></div>
      <div class="panel plist${band(d.id)}">${list}</div>
      <div class="panel popts${band(d.id)}">
        ${slider('Música', 7)}${slider('Efectos', 5)}
        <div class="set set--rule"><span>Pantalla</span><div class="chips"><span class="chip chip--on" data-sel="chip">Completa</span><span class="chip" data-sel="chip">Ventana</span></div></div>
        <div class="set"><span>Idioma</span><div class="cycle"><u>◂</u><span>Español</span><u>▸</u></div></div>
        <div class="set"><span>Clima</span><div class="chips"><span class="chip chip--on" data-sel="chip">Lluvia y rayos</span><span class="chip" data-sel="chip">Suave</span></div></div>
      </div>
      <div class="hints"><span><b>Esc</b> Volver</span><span><b>Enter</b> Aceptar</span><span><b>◂ ▸</b> Cambiar</span></div></div>`;
  }

  const SCREENS = [['Inicio', title], ['Bolsa', bag], ['Tienda', shop], ['Pausa y opciones', pause]];
  document.getElementById('dirs').innerHTML = DIRS.map(d => `
    <section class="dir" id="dir-${d.id}">
      <div class="dir__head"><div><div class="dir__k">${d.k}</div><h2 class="dir__name">${d.name}</h2><p class="dir__desc">${d.desc}</p></div>
        <div class="dir__spec"><div class="sw">${d.sw.map(c => `<i style="background:${c}"></i>`).join('')}</div><span>${d.type}</span></div></div>
      <div class="boards">${SCREENS.map(([n, fn], i) => `<figure class="board"><div class="fit">${fn(d)}</div><figcaption><b>${d.id}${i + 1}</b> · ${n}</figcaption></figure>`).join('')}</div>
    </section>`).join('');

  // Scale every 960×540 artboard to its column.
  const fits = [...document.querySelectorAll('.fit')];
  const fit = () => fits.forEach(f => f.style.setProperty('--k', f.clientWidth / 960));
  new ResizeObserver(fit).observe(document.body); fit();

  // Click to move the selection inside a group (purely to feel the states).
  document.addEventListener('click', e => {
    const el = e.target.closest('[data-sel]'); if (!el) return;
    const kind = el.dataset.sel, cls = { opt: 'opt--on', tab: 'tab--on', chip: 'chip--on', row: 'row--sel', slot: 'slot--sel' }[kind];
    const scope = kind === 'slot' ? el.closest('.bag') : el.parentElement;
    scope.querySelectorAll(`[data-sel="${kind}"]`).forEach(x => x.classList.toggle(cls, x === el));
  });
})();
</script>
</body>
