<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tlaxcallan Códice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,500;0,700;0,800;1,500;1,600;1,700;1,800&family=Alegreya+Sans:wght@400;500;700;800&family=Cinzel:wght@600;700&display=swap" rel="stylesheet">
<style>
/* Tlaxcallan v4 · codex pages framed in tile. --band is the tile frame (Talavera or
   polychrome), --sel the selected state; both switch with body.poli. */
:root { --ink: #1a1410; --soft: #5a4030; --red: #b8402e; --sel-fg: #fff; }
* { box-sizing: border-box; }
html, body { margin: 0; background: #14110f; color: #f3e6cf; font-family: 'Alegreya Sans', system-ui, sans-serif; }
.page { max-width: 1640px; margin: 0 auto; padding: 40px 16px 80px; }
.intro { max-width: 860px; margin: 0 auto 26px; text-align: center; }
.intro h1 { font: 700 44px/1.05 'Cinzel', serif; margin: 0 0 12px; letter-spacing: 2px; }
.intro p { font-size: 18px; color: #c9b89a; margin: 0 0 18px; text-wrap: pretty; }
.toggle { display: inline-flex; gap: 0; border-radius: 999px; overflow: hidden; box-shadow: 0 0 0 2px #c9b89a; }
.toggle button { font: 700 16px 'Alegreya Sans', sans-serif; padding: 10px 20px; border: 0; cursor: pointer; background: transparent; color: #f3e6cf; }
.toggle button[aria-pressed="true"] { background: #f3e6cf; color: #14110f; }
.toggle-note { display: block; margin-top: 10px; font-size: 14px; color: #c9b89a; }
.sec { margin: 0 0 56px; }
.sec h2 { font: italic 800 30px 'Alegreya', serif; margin: 0 0 4px; }
.sec > p { margin: 0 0 20px; color: #c9b89a; font-size: 17px; max-width: 860px; text-wrap: pretty; }
.boards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 700px), 1fr)); gap: 28px; }
.board { margin: 0; }
.board figcaption { margin-top: 10px; font-size: 15px; color: #c9b89a; }
.board figcaption b { color: #f3e6cf; }
.fit { position: relative; width: 100%; aspect-ratio: 16 / 9; overflow: hidden; border-radius: 6px; box-shadow: 0 12px 34px rgba(0,0,0,.5); }
.fit > .ab { position: absolute; left: 0; top: 0; transform-origin: 0 0; transform: scale(var(--k, .5)); }
.fit--hero { max-width: 1280px; margin: 0 auto; }

body { --band: var(--deco) 0 0 / 18px; --sel: var(--cobalt) 0 0 / 120px; --sel-ring: #0f2458; --slot: var(--plain) 0 0 / 90px; }
body.poli { --band: var(--poli) 0 0 / 18px; --sel: linear-gradient(#c84a36, #a8382a); --sel-ring: #6a1e14; --slot: radial-gradient(circle at 35% 30%, #f6e2b8, #e8c48a); }

.ab { width: 960px; height: 540px; overflow: hidden; color: var(--ink); font-size: 15px; background: #1a1410; }
.scene { position: absolute; inset: 0; width: 100%; height: 100%; }
.gbg { position: absolute; inset: -20px; background: center / cover; filter: blur(5px) saturate(.85) sepia(.15); }
.dim { position: absolute; inset: 0; background: linear-gradient(rgba(30,20,10,.3), rgba(30,20,10,.55)); }
.dim--deep { background: rgba(26,16,8,.4); }

/* Codex page: gesso on deerskin, screenfold creases, red scene rule, tile frame. */
.cx { position: absolute; border: 18px solid transparent; border-radius: 3px; padding: 10px 12px;
  background: repeating-linear-gradient(90deg, transparent 0 176px, rgba(90,60,30,.18) 176px 178px, rgba(255,255,255,.35) 178px 180px) padding-box, var(--grain) padding-box, linear-gradient(170deg, #f4ead2, #e8d8b2) padding-box, var(--band) border-box;
  box-shadow: 0 0 0 2px var(--ink), inset 0 0 0 2px var(--ink), inset 0 0 0 7px #f4ead2, inset 0 0 0 10px var(--red), inset 0 0 0 12px var(--ink), 0 14px 26px rgba(0,0,0,.55); }
.cx > * { position: relative; }

/* Cartouche buttons with ink outline. */
.cb { cursor: pointer; border-radius: 12px; padding: 6px 14px; background: #f6edd6; color: var(--ink); font: italic 700 18px 'Alegreya', serif; box-shadow: inset 0 0 0 2.5px var(--ink), inset 0 0 0 5px #f6edd6, inset 0 0 0 6.5px rgba(184,64,46,.55), 0 3px 0 var(--ink); }
.cb:hover { background: #fffaf0; }
.cb--on, .cb--on:hover { background: var(--sel); color: var(--sel-fg); text-shadow: 0 1px 2px rgba(0,0,0,.5); box-shadow: inset 0 0 0 2.5px var(--ink), inset 0 0 0 5px rgba(255,255,255,.2), inset 0 0 0 6.5px #e9b33e, 0 3px 0 var(--ink); }
.cb--x { color: var(--red); }
.cb small { display: block; font: 500 12.5px 'Alegreya Sans', sans-serif; opacity: .9; font-style: normal; }
.row2 { display: flex; gap: 8px; }
.row2 .cb { flex: 1; text-align: center; font-size: 16px; }
.chips { display: flex; gap: 8px; }
.chip { padding: 3px 12px; font-size: 15px; }

.ic { display: block; }
.mini { display: inline-block; width: 15px; height: 15px; vertical-align: -3px; }
.day { display: inline-block; width: 18px; height: 18px; vertical-align: -4px; }
.nd { display: block; width: 22px; }
.nd--k { width: 16px; }
.nd--v { width: 24px; justify-self: end; }
.xos { display: inline-flex; gap: 1px; }
.xo { width: 15px; height: 15px; }
.xos--s .xo { width: 11px; height: 11px; }
.keys { position: absolute; left: 0; right: 0; bottom: 10px; display: flex; justify-content: center; gap: 18px; font-size: 14px; color: #f6efe0; text-shadow: 0 1px 3px #000; }
kbd { display: inline-block; min-width: 22px; padding: 1px 6px; margin-right: 5px; font: 700 12px 'Alegreya Sans', sans-serif; color: var(--ink); text-align: center; border-radius: 6px; background: #f6edd6; box-shadow: inset 0 0 0 1.5px var(--ink), 0 2px 0 var(--ink); }

.m { height: 12px; border-radius: 6px; background: #f6edd6; box-shadow: inset 0 0 0 2px var(--ink); position: relative; overflow: hidden; }
.m i { position: absolute; left: 2px; top: 2px; bottom: 2px; border-radius: 4px; }
.m--s { height: 10px; }
.sld { position: relative; height: 12px; border-radius: 6px; background: #f6edd6; box-shadow: inset 0 0 0 2px var(--ink); }
.sld i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 6px; background: var(--sel); box-shadow: inset 0 0 0 2px var(--ink); }
.sld b { position: absolute; top: 50%; width: 22px; height: 22px; margin: -11px 0 0 -11px; border-radius: 50%; background: #e9b33e; box-shadow: inset 0 0 0 2.5px var(--ink), inset 0 0 0 6px #e9b33e, inset 0 0 0 8px #3fa37a; }

/* Character frame: cotton cloth with ink rules, tile ground line. */
.cf { position: relative; display: flex; align-items: flex-end; justify-content: center; overflow: hidden; border-radius: 4px;
  background: linear-gradient(transparent 82%, rgba(184,64,46,.15) 82%), var(--grain), radial-gradient(circle at 50% 30%, #fbf2dc, #ecdcb6);
  box-shadow: inset 0 0 0 2.5px var(--ink), inset 0 0 0 6px #f4ead2, inset 0 0 0 8px var(--red), inset 0 0 0 9.5px var(--ink), 0 4px 10px rgba(0,0,0,.3); }
.cf .fig { height: 92%; width: auto; margin-bottom: 4%; }
.cf--tall { width: 196px; height: 200px; }
.cf--seller { width: 230px; height: 236px; flex: none; }
.cf--big { width: 190px; height: 176px; }

/* ---------- Inicio ---------- */
.logo { left: 50%; top: 12px; transform: translateX(-50%); width: 540px; display: flex; gap: 12px; align-items: center; padding: 6px 14px; }
.glyph { width: 60px; flex: none; }
.logo__n { font: 700 38px/1 'Cinzel', serif; color: var(--ink); letter-spacing: 1px; }
.logo__t { font: italic 600 14px 'Alegreya', serif; color: #7a3a1e; margin-top: 4px; }
.tmenu { left: 50%; bottom: 26px; transform: translateX(-50%); display: flex; gap: 8px; padding: 8px; }
.tmenu .cb { width: 210px; }
.foot { position: absolute; left: 0; right: 0; bottom: 6px; text-align: center; font: italic 500 13px 'Alegreya', serif; color: #3a2418; }

/* ---------- Tabs ---------- */
.tabs { position: absolute; left: 60px; top: 12px; display: flex; gap: 8px; z-index: 2; }
.tab { padding: 5px 16px; font-size: 17px; }

/* ---------- Bolsa ---------- */
.bag { left: 26px; right: 26px; top: 54px; bottom: 30px; display: grid; grid-template-columns: 196px minmax(0, 1fr); gap: 18px; }
.bag__l { display: flex; flex-direction: column; gap: 8px; align-items: center; }
.who { width: 100%; display: flex; justify-content: space-between; align-items: center; }
.who b { font: italic 800 21px 'Alegreya', serif; }
.who span { font-size: 12.5px; color: var(--soft); font-weight: 700; display: flex; gap: 4px; align-items: center; }
.ms { width: 100%; display: grid; grid-template-columns: 54px 1fr 26px; gap: 6px 8px; align-items: center; font-size: 14px; }
.ms em { font-style: normal; font-weight: 800; text-align: right; }
.bag__r { display: flex; flex-direction: column; gap: 7px; min-width: 0; }
.item { display: grid; grid-template-columns: 68px minmax(0, 1fr) 160px; gap: 12px; align-items: center; padding: 8px 10px; border-radius: 10px; background: rgba(255,250,236,.7); box-shadow: inset 0 0 0 2px var(--ink); }
.item__ic { width: 68px; height: 68px; display: flex; align-items: center; justify-content: center; border-radius: 50%; background: #f6edd6; box-shadow: inset 0 0 0 2.5px var(--ink), inset 0 0 0 6px #f6edd6, inset 0 0 0 8px var(--red); }
.item__ic .ic { width: 46px; height: 46px; }
.item__t b { font: italic 800 21px 'Alegreya', serif; display: block; line-height: 1.1; }
.item__t small { font: 800 11px 'Alegreya Sans', sans-serif; letter-spacing: 1.2px; text-transform: uppercase; color: var(--red); }
.item__t p { margin: 3px 0 0; font-size: 14px; line-height: 1.25; color: var(--soft); text-wrap: pretty; }
.item__s { display: flex; flex-direction: column; gap: 6px; }
.kv { display: flex; justify-content: space-between; font-size: 14px; }
.sh { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; color: var(--soft); border-top: 2px solid var(--red); padding-top: 4px; }
.sh b { font: italic 800 16px 'Alegreya', serif; color: var(--ink); }
.sls { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 6px; }
.sl { position: relative; aspect-ratio: 1; display: flex; align-items: center; justify-content: center; cursor: pointer; border-radius: 8px; background: var(--slot); box-shadow: inset 0 0 0 2px var(--ink), 0 2px 0 var(--ink); }
.sl:hover { box-shadow: inset 0 0 0 2px var(--ink), inset 0 0 0 4px #e9b33e, 0 2px 0 var(--ink); }
.sl--e { background: rgba(246,237,214,.55); box-shadow: inset 0 0 0 1.5px rgba(26,20,16,.5); }
.sl--on { box-shadow: inset 0 0 0 2.5px var(--ink), inset 0 0 0 5px #e9b33e, inset 0 0 0 6.5px var(--ink), 0 0 0 3px rgba(233,179,62,.6), 0 2px 0 var(--ink); }
.sl .ic { width: 66%; height: 66%; }
.sl__k { position: absolute; left: 4px; top: 4px; }
.sl__n { position: absolute; right: 4px; bottom: 1px; font-weight: 800; font-size: 12px; text-shadow: 0 0 3px #fff, 0 0 3px #fff; }

/* ---------- Tianguis ---------- */
.seller { position: absolute; left: 28px; top: 16px; bottom: 34px; width: 254px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.talk { position: relative; width: 254px; padding: 6px 10px; }
.talk__n { font: italic 800 18px 'Alegreya', serif; display: flex; justify-content: space-between; align-items: baseline; }
.talk__n small { font: 700 12px 'Alegreya Sans', sans-serif; color: #2f6f6a; }
.talk p { margin: 4px 0 6px; font-size: 14.5px; line-height: 1.3; text-wrap: pretty; }
.talk__f { display: flex; justify-content: space-between; align-items: center; color: var(--soft); }
.shop { left: 300px; right: 28px; top: 16px; bottom: 34px; display: flex; flex-direction: column; gap: 8px; }
.shop__h { display: flex; justify-content: space-between; align-items: center; }
.shop__h b { font: 700 24px 'Cinzel', serif; }
.purse { display: flex; align-items: center; gap: 6px; font-weight: 800; font-size: 17px; padding: 3px 12px; border-radius: 999px; background: #f6edd6; box-shadow: inset 0 0 0 2px var(--ink); }
.prs { display: flex; flex-direction: column; gap: 6px; }
.pr { display: grid; grid-template-columns: 46px minmax(0, 1fr) 70px 98px; gap: 10px; align-items: center; padding: 4px 10px 4px 5px; cursor: pointer; border-radius: 10px; background: rgba(255,250,236,.75); box-shadow: inset 0 0 0 2px var(--ink); }
.pr:hover { background: #fffaf0; }
.pr--on { background: #fff6dc; box-shadow: inset 0 0 0 2.5px var(--ink), inset 0 0 0 5px #e9b33e, inset 0 0 0 6.5px var(--ink); }
.pr__ic { width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: var(--slot); box-shadow: inset 0 0 0 2px var(--ink); }
.pr__ic .ic { width: 30px; height: 30px; }
.pr__t b { display: block; font-size: 16px; line-height: 1.15; }
.pr__t small { font-size: 13px; color: var(--soft); }
.pr__p { font-weight: 800; text-align: right; }
.qty { display: flex; align-items: center; justify-content: space-between; font-weight: 800; }
.qty u { text-decoration: none; cursor: pointer; width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; border-radius: 50%; background: #f6edd6; box-shadow: inset 0 0 0 2px var(--ink), 0 2px 0 var(--ink); }
.shop__f { margin-top: auto; display: flex; justify-content: space-between; align-items: center; font-size: 17px; border-top: 2px solid var(--red); padding-top: 8px; }
.shop__f .cb { padding: 6px 22px; }

/* ---------- Vecinos ---------- */
.vec { left: 26px; right: 26px; top: 54px; bottom: 30px; display: grid; grid-template-columns: minmax(0, 1fr) 236px; gap: 16px; }
.vec__g { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; align-content: start; }
.vc { cursor: pointer; display: flex; flex-direction: column; align-items: center; border-radius: 8px; padding: 2px 0 3px; background: rgba(255,250,236,.65); box-shadow: inset 0 0 0 1.5px var(--ink); }
.vc:hover { background: #fffaf0; }
.vc--on { background: #fff6dc; box-shadow: inset 0 0 0 2.5px var(--ink), inset 0 0 0 5px #e9b33e, inset 0 0 0 6.5px var(--ink); }
.vc__a { width: 80px; height: 92px; display: flex; justify-content: center; }
.vc__a .fig { height: 96px; width: auto; }
.vc b { font-size: 13px; line-height: 1; }
.love { color: var(--red); font-style: normal; }
.vec__s { display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; }
.vec__n { font: 700 24px 'Cinzel', serif; line-height: 1; margin-top: 2px; }
.vec__r { font: italic 700 14px 'Alegreya', serif; color: var(--red); }
.vec__l { margin: 2px 0; font: italic 500 14px 'Alegreya', serif; color: var(--soft); text-wrap: pretty; }
.facts { display: grid; grid-template-columns: auto auto; gap: 2px 10px; font-size: 13px; text-align: left; width: 100%; padding: 4px 0; border-top: 2px solid var(--red); }
.facts span { color: var(--soft); }
.vec__s .cb { width: 100%; text-align: center; font-size: 16px; }

/* ---------- Pausa ---------- */
.ph { left: 50%; top: 16px; transform: translateX(-50%); padding: 2px 18px 4px; text-align: center; white-space: nowrap; }
.ph__t { font: 700 40px/1.05 'Cinzel', serif; letter-spacing: 2px; }
.ph__d { font: italic 600 14px 'Alegreya', serif; color: #7a3a1e; }
.plist { left: 90px; top: 140px; width: 270px; display: flex; flex-direction: column; gap: 8px; }
.popts { left: 382px; right: 90px; top: 140px; display: flex; flex-direction: column; gap: 12px; padding: 12px 16px; }
.set { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 12px; align-items: center; font: italic 700 17px 'Alegreya', serif; }
.set--n { grid-template-columns: 96px minmax(0, 1fr) 26px; }
.cyc { display: flex; align-items: center; gap: 10px; }
.cyc b { min-width: 120px; text-align: center; padding: 3px 10px; border-radius: 999px; background: #f6edd6; box-shadow: inset 0 0 0 2px var(--ink); }
.cyc u { text-decoration: none; cursor: pointer; }

/* Galleries. */
.styles { display: flex; flex-direction: column; gap: 34px; }
.srow h3 { font: italic 800 24px 'Alegreya', serif; margin: 0 0 2px; }
.srow h3 span { font: 700 13px 'Alegreya Sans', sans-serif; letter-spacing: 2px; color: #d39a26; margin-right: 10px; font-style: normal; }
.srow p { margin: 0 0 14px; color: #c9b89a; max-width: 860px; text-wrap: pretty; }
.line { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 14px; }
.line figure { margin: 0; text-align: center; }
.line .cf { width: 140px; height: 180px; margin: 0 auto; }
.line figcaption { margin-top: 6px; font: italic 800 16px 'Alegreya', serif; color: #f3e6cf; }
.line figcaption small { display: block; font: 500 13px 'Alegreya Sans', sans-serif; color: #c9b89a; font-style: normal; }
/* Content must clear the inner ink + red rules (12px) of every codex page. */
.cx { padding: 18px 20px; }
.logo { padding: 16px 22px; width: 600px; }
.ph { padding: 14px 26px; }
.talk { padding: 16px 18px; }
.talk__n { flex-direction: column; align-items: flex-start; }
.who { flex-direction: column; align-items: flex-start; gap: 2px; }
.tmenu { bottom: 34px; padding: 16px; }
.foot { color: #2a1a10; font-weight: 700; text-shadow: 0 0 4px #f4ead2, 0 0 4px #f4ead2; }
.seller .cf--seller { height: 200px; }
</style>
</head>
<body>
<main class="page">
  <header class="intro">
    <h1>Tlaxcallan · Códice</h1>
    <p>Menús en estilo códice enmarcados en azulejo, y los muñecos en dos estilos prehispánicos nuevos. Cambia el marco para comparar:</p>
    <div class="toggle" role="group" aria-label="Marco de los menús"><button data-mode="tal" aria-pressed="true">Talavera azul</button><button data-mode="poli" aria-pressed="false">Policromo prehispánico</button></div>
    <span class="toggle-note">La Talavera llegó con los españoles (Puebla, hacia 1550). El policromo Mixteca-Puebla sí se hacía en Tlaxcala y Cholula antes de la conquista.</span>
  </header>

    if (s === 'rizos') return Array.from({ length: 22 }, (_, i) => { const side = i % 2 ? 1 : -1, k = Math.floor(i / 2); return `<circle cx="${60 + side * (30 + (k % 3) * 4)}" cy="${48 + k * 7}" r="11" fill="${c}" ${sw}/>`; }).join('') + `<path d="M24 50 C 24 110 96 110 96 50 Z" fill="${c}"/>`;
    if (s === 'largo') return `<path d="M24 52 C 22 90 24 112 28 124 L92 124 C 96 112 98 90 96 52 Z" fill="${c}" ${sw}/>`;
    if (s === 'coleta') return `<path d="M88 40 C 108 46 110 80 100 104 C 96 90 92 70 84 56 Z" fill="${c}" ${sw}/>`;
    if (s === 'chongo') return `<circle cx="60" cy="20" r="14" fill="${c}" ${sw}/><path d="M48 22 h24" stroke="${p.acc2 || '#c0392b'}" stroke-width="4"/>`;
    return '';
  }
  function hairFront(p) {
    const c = p.hair, hi = shade(c === '#1a1210' ? '#3a2a24' : c, 1.25), s = p.hairStyle;
    let g = `<path d="M26 58 C 22 26 44 16 60 16 C 78 16 98 26 94 58 C 88 44 78 38 70 36 C 64 42 52 44 44 40 C 38 44 32 50 26 58 Z" fill="${c}" ${sw}/>`;
    if (s === 'rizos' || s === 'afro') g = `<path d="M26 58 C 22 26 44 16 60 16 C 78 16 98 26 94 58 C 86 46 78 42 60 42 C 42 42 34 46 26 58 Z" fill="${c}" ${sw}/>` + [30, 40, 50, 60, 70, 80, 90].map((x, i) => `<circle cx="${x}" cy="${26 + Math.abs(i - 3) * 4}" r="${8}" fill="${c}"/>`).join('');

    return g;
  }
  function headwear(p) {
    const h = p.head; if (!h) return '';
    if (h === 'plumas') { const cs = p.feathers || ['#2f8f8a', '#7cb04a', '#e9b33e', '#c0392b', '#e9b33e', '#7cb04a', '#2f8f8a']; return cs.map((c, i) => { const a = (i - (cs.length - 1) / 2) * 15; return `<path transform="rotate(${a} 60 36)" d="M60 36 C 52 22 54 6 60 -2 C 66 6 68 22 60 36 Z" fill="${c}" ${sw}/>`; }).join('') + `<path d="M28 40 C 44 32 76 32 92 40 L92 47 C 76 40 44 40 28 47 Z" fill="#e9b33e" ${sw}/>${[38, 50, 60, 70, 82].map(x => `<circle cx="${x}" cy="41" r="2.2" fill="#2f8f8a"/>`).join('')}`; }

    // Top: huipil, quechquémitl over a blouse, or ichcahuipilli (quilted cotton armour).

      g += `<path d="M${60 - tw - 6} 92 C ${60 - tw} 88 ${60 + tw} 88 ${60 + tw + 6} 92 L60 128 Z" fill="${top}" ${sw}/><path d="M${60 - tw - 2} 96 L60 124 L${60 + tw + 2} 96" stroke="${trim}" stroke-width="3" fill="none"/><path d="M60 128 l-3 6 h6Z" fill="${trim}"/>`;

<script>
// Procedural "realistic" materials for Tlaxcallan v2, drawn on canvas at load:

"use strict";

  // Plain white glazed tiles, 2×2 with slight variation so repetition is less visible.

  // Matte-painting landscape: sky, fbm clouds, La Malinche with ridges and gullies lit

        const snow = dist < .16 + (h0 - .5) * .1 + N(x / 30, y / 30, 3) * .04 && h0 > .35;
        if (snow) { const s = Math.min(1.08, .55 + slope * .5 + side * .3 + .3); r = 255 * s; gg = 236 * s; b = 240 * s; }
        const haze = Math.min(.6, Math.max(0, (y - H * .42) / (H * .32)));
        r = mix(r, 230, haze * .55); gg = mix(gg, 156, haze * .55); b = mix(b, 140, haze * .55);
      }
      // Forest belt.
      if (y > forest(x)) { const t = N(x / 6, y / 6, 4); const l = .5 + (t - .5) * 1.4 + (x / W) * .2; r = 34 * l + 10; gg = 62 * l + 14; b = 36 * l + 10; }
      // Valley fields in warm light.

    }

    // Village + church catching the sun.
    for (let k = 0; k < 26; k++) { const x = W * .55 + R() * W * .4, y = valley(x) + 2 + R() * 10, w = 6 + R() * 10; g.fillStyle = R() < .5 ? '#e8cfa6' : '#d8b48a'; g.fillRect(x, y - 6, w, 6); g.fillStyle = '#a8432f'; g.fillRect(x - 1, y - 8, w + 2, 2.4); }
    // Basílica de Ocotlán on its hill: white stucco towers over red petatillo bases.

    g.fillStyle = '#5a7a3a'; g.beginPath(); g.ellipse(cx, cy + 14, 90, 22, 0, Math.PI, 0); g.fill();
    const tower = (tx, s) => { g.fillStyle = '#b8432f'; g.fillRect(tx - 7 * s, cy - 22 * s, 14 * s, 22 * s); g.strokeStyle = 'rgba(120,40,30,.8)'; g.lineWidth = .6; for (let k = 0; k < 8; k++) { g.beginPath(); g.moveTo(tx - 7 * s, cy - k * 2.8 * s); g.lineTo(tx + 7 * s, cy - (k + 1) * 2.8 * s); g.stroke(); }
      g.fillStyle = '#f6f0e4'; g.fillRect(tx - 6 * s, cy - 42 * s, 12 * s, 20 * s); g.fillRect(tx - 4.5 * s, cy - 54 * s, 9 * s, 12 * s); g.beginPath(); g.arc(tx, cy - 54 * s, 4.5 * s, Math.PI, 0); g.fill();
      g.fillStyle = '#3a2a3a'; g.fillRect(tx - 2 * s, cy - 38 * s, 4 * s, 8 * s); g.fillRect(tx - 1.5 * s, cy - 51 * s, 3 * s, 6 * s); g.fillStyle = '#e0c070'; g.fillRect(tx - .5 * s, cy - 64 * s, 1 * s, 6 * s); g.fillRect(tx - 2 * s, cy - 62 * s, 4 * s, 1 * s); };

    g.fillStyle = '#d8c09a'; g.fillRect(cx - 8 * s, cy - 36 * s, 16 * s, 26 * s); g.fillStyle = '#4a2e2a'; g.beginPath(); g.moveTo(cx - 4 * s, cy); g.lineTo(cx - 4 * s, cy - 10 * s); g.arc(cx, cy - 10 * s, 4 * s, Math.PI, 0); g.lineTo(cx + 4 * s, cy); g.fill();

        g.strokeStyle = 'rgba(240,200,110,.9)'; g.lineWidth = 1.2 * s; g.beginPath(); g.moveTo(x + lean * 1.6, by - h); g.lineTo(x + lean * 1.6 - 4 * s, by - h - 7 * s); g.moveTo(x + lean * 1.6, by - h); g.lineTo(x + lean * 1.6 + 4 * s, by - h - 7 * s); g.stroke();

<script>

      <g transform="translate(640 452)"><rect x="-10" y="-46" width="110" height="46" fill="#e8c69a"/><rect x="72" y="-46" width="28" height="46" fill="#d4ad7c"/><path d="M-20 -44 L110 -44 L80 -82 L10 -82Z" fill="#c8a050"/><path d="M-20 -44 L110 -44 L104 -50 L-14 -50Z" fill="#a8823a"/>${Array.from({ length: 9 }, (_, i) => `<path d="M${-14 + i * 14} -46 L${12 + i * 8} -80" stroke="#a8823a" stroke-width="1.6"/>`).join('')}<rect x="36" y="-30" width="18" height="30" fill="#5a3a24"/></g>

  // ---------- 2 · Papel recortado ----------
  function papel() {
    const R = rnd(14);
    const defs = `<linearGradient id="q-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5a2f6e"/><stop offset=".45" stop-color="#d0607a"/><stop offset=".8" stop-color="#f6b07a"/></linearGradient>
      <filter id="q-ds" x="-5%" y="-10%" width="110%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="3.5" flood-color="#2a1030" flood-opacity=".5"/></filter>

      <g filter="url(#q-ds)"><path d="M-10 420 C 60 360 110 300 140 290 C 170 300 230 360 330 420Z" fill="#b0789a"/><path d="M118 300 C 128 292 152 290 162 298 L150 312 L140 304 L128 312Z" fill="#fbeef4"/></g>
      <g filter="url(#q-ds)"><path d="${MAL}" fill="#7a4a86"/></g>

      <g filter="url(#q-ds)"><path d="${wave(400, 8, .012, 1)}" fill="#5a3f7a"/></g>

      <g filter="url(#q-ds)"><path d="${wave(520, 6, .02, 3)}" fill="#183028"/>${agave(700, 540, 1.4, ['#183028', '#183028', '#183028'])}${agave(880, 540, 1.7, ['#183028', '#183028', '#183028'])}${banner(610, 520, .8).replace(/#[0-9a-f]{6}/gi, m => m.toLowerCase() === '#fffaf0' ? m : '#183028')}</g>
      <g filter="url(#q-ds)">${heron(300, 110, 1, '#fffaf0')}${heron(350, 132, .8, '#fffaf0')}${heron(260, 140, .7, '#fffaf0')}</g>
      <rect width="960" height="540" filter="url(#q-gr)"/>`;
    return svg(defs, body);
  }

  // ---------- 3 · Lienzo de Tlaxcala ----------
  function lienzo() {
    const R = rnd(21), K = '#2a1a10', ink = `stroke="${K}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"`;
    const glosa = (x, y, t, s = 17) => `<text x="${x}" y="${y}" font-family="Alegreya, serif" font-style="italic" font-size="${s}" fill="#5a3418">${t}</text>`;
    const spiral = (x, y, s) => `<path d="M${x} ${y} c 0 ${-10 * s} ${15 * s} ${-10 * s} ${15 * s} 0 c 0 ${7 * s} ${-9 * s} ${7 * s} ${-9 * s} ${2 * s}" fill="none" ${ink}/>`;
    const foot = (x, y, a) => `<path transform="rotate(${a} ${x} ${y})" d="M${x} ${y} c -4 -10 6 -14 9 -6 c 2 6 -2 12 -9 6Z" fill="${K}"/>`;
    const plant = (x, y, s) => `<g transform="translate(${x} ${y}) scale(${s})"><path d="M0 0 V-90" ${ink}/>${[[-20, 1], [-40, -1], [-60, 1]].map(([yy, d]) => `<path d="M0 ${yy} C ${d * 20} ${yy - 22} ${d * 34} ${yy - 14} ${d * 38} ${yy + 4} C ${d * 26} ${yy - 4} ${d * 14} ${yy - 4} 0 ${yy + 6}Z" fill="#7aa45a" ${ink}/>`).join('')}<path d="M8 -50 C 2 -64 6 -76 14 -80 C 22 -76 24 -64 18 -50Z" fill="#e9b33e" ${ink}/><path d="M0 -90 l-8 -12 M0 -90 l0 -14 M0 -90 l8 -12" ${ink}/></g>`;
    const stains = Array.from({ length: 30 }, () => `<ellipse cx="${R() * 960}" cy="${R() * 540}" rx="${20 + R() * 70}" ry="${10 + R() * 40}" fill="#b8925a" opacity="${.05 + R() * .08}"/>`).join('');
    const defs = `<filter id="l-gr" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".7 .9" numOctaves="3" seed="5"/><feColorMatrix values="0 0 0 0 .45 0 0 0 0 .35 0 0 0 0 .2 0 0 0 -1.8 1"/><feComponentTransfer><feFuncA type="linear" slope=".45"/></feComponentTransfer></filter>
      <filter id="l-wob" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency=".04" numOctaves="2" seed="2"/><feDisplacementMap in="SourceGraphic" scale="3"/></filter>`;
    const body = `<rect width="960" height="540" fill="#ecdfc0"/>${stains}
      <g filter="url(#l-wob)">
        <rect x="14" y="14" width="932" height="512" fill="none" ${ink}/><rect x="22" y="22" width="916" height="496" fill="none" stroke="${K}" stroke-width="1.4"/>
        <g transform="translate(830 92)"><circle r="30" fill="#e9b33e" ${ink}/><circle r="16" fill="#c0392b" ${ink}/>${Array.from({ length: 8 }, (_, i) => `<path transform="rotate(${i * 45})" d="M-8 -32 L0 -50 L8 -32Z" fill="#e9b33e" ${ink}/>`).join('')}</g>
        <g transform="translate(470 0)"><path d="M-170 430 C -170 320 -110 196 0 188 C 110 196 170 320 170 430 Z" fill="#7aa45a" ${ink}/>
          <path d="M-160 350 C -100 332 100 332 160 350 C 166 380 170 410 170 430 L-170 430 C -170 410 -166 380 -160 350Z" fill="#4f86b8" ${ink}/>
          ${Array.from({ length: 6 }, (_, i) => spiral(-140 + i * 50, 398, 1.1)).join('')}
          ${[[-60, 260], [10, 230], [62, 290], [-24, 306], [100, 320], [-104, 316]].map(([x, y]) => `<circle cx="${x}" cy="${y}" r="7" fill="#c8e0a0" ${ink}/>`).join('')}
          <path d="M-28 196 C -18 172 18 172 28 196" fill="#f6efe0" ${ink}/>
          <rect x="-180" y="426" width="360" height="20" fill="#e9b33e" ${ink}/>${Array.from({ length: 9 }, (_, i) => `<rect x="${-172 + i * 40}" y="430" width="20" height="12" fill="#c0392b"/>`).join('')}</g>
        ${glosa(390, 178, 'matlalcueye')}
        ${teocalli(780, 446, 1.1, { a: '#f6efe0', b: '#d8c8a8', s: '#c0392b', r: '#c0392b', w: '#f6efe0' }, ink)}
        <path d="M780 300 c -10 -14 10 -22 0 -36 c -8 -12 8 -20 2 -30" fill="none" ${ink}/>
        ${glosa(728, 474, 'tlaxcallan · ocotelulco')}
        ${plant(90, 470, 1.2)}${plant(150, 480, .9)}${plant(210, 474, 1.05)}
        <path d="M30 500 C 200 488 360 520 520 500 C 680 482 800 512 930 498" stroke="#4f86b8" stroke-width="16" fill="none"/><path d="M30 500 C 200 488 360 520 520 500 C 680 482 800 512 930 498" stroke="${K}" stroke-width="2" fill="none" transform="translate(0 -9)"/><path d="M30 500 C 200 488 360 520 520 500 C 680 482 800 512 930 498" stroke="${K}" stroke-width="2" fill="none" transform="translate(0 9)"/>
        ${Array.from({ length: 14 }, (_, i) => `<circle cx="${50 + i * 64}" cy="${500 + Math.sin(i) * 6}" r="3" fill="#f6efe0" stroke="${K}" stroke-width="1.4"/>`).join('')}
        ${glosa(600, 530, 'atoyac', 14)}
        ${Array.from({ length: 10 }, (_, i) => foot(250 + i * 44, 470 - i * 4 + (i % 2) * 8, 80)).join('')}
        ${heron(250, 110, 1.2, '#fffaf0', K, 2.4)}${heron(310, 136, .9, '#fffaf0', K, 2.4)}
        <g transform="translate(660 486)"><path d="M0 0 C -2 -20 6 -34 18 -40 L28 -62 L24 -40 C 30 -30 28 -10 18 0Z" fill="#fffaf0" ${ink}/><path d="M6 0 V20 M14 0 V20" ${ink}/><circle cx="25" cy="-58" r="1.6" fill="${K}"/></g>
        ${glosa(40, 236, 'Tlaxcallan, año 1-ácatl', 20)}
      </g>
      <rect width="960" height="540" filter="url(#l-gr)"/>`;
    return svg(defs, body);
  }

  // ---------- 4 · Mural de Talavera ----------
  function talavera() {
    const R = rnd(31), C = '#1b3a8a', W = '#9fb4e0', O = '#d39a26', G = '#3d7a46';
    const br = `stroke="${C}" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round"`;
    const defs = `<filter id="t-br" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency=".05" numOctaves="2" seed="9"/><feDisplacementMap in="SourceGraphic" scale="3.5"/></filter>
      <pattern id="t-grid" width="60" height="60" patternUnits="userSpaceOnUse"><rect width="60" height="60" fill="url(#t-gl)"/><path d="M0 0.75 H60 M0.75 0 V60" stroke="#c9bfa8" stroke-width="1.5"/></pattern>
      <radialGradient id="t-gl" cx=".3" cy=".25" r=".9"><stop offset="0" stop-color="#fff" stop-opacity=".35"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#5a4a30" stop-opacity=".08"/></radialGradient>`;
    const hatch = Array.from({ length: 26 }, (_, i) => { const x = 330 + i * 6; return `<path d="M${x} ${330 - i * 4} l-26 ${60 + i}" stroke="${C}" stroke-width="1.6" opacity=".55"/>`; }).join('');
    const sky = Array.from({ length: 12 }, (_, i) => `<rect x="${R() * 700}" y="${30 + i * 13}" width="${120 + R() * 200}" height="7" rx="3.5" fill="${C}" opacity="${.08 + (12 - i) * .02}"/>`).join('');
    const clouds = [[140, 140], [600, 110], [380, 70]].map(([x, y]) => `<path d="M${x} ${y} a18 18 0 0 1 30 -14 a24 24 0 0 1 44 0 a18 18 0 0 1 30 14 Z" fill="#f6f1e6" ${br}/>`).join('');
    const body = `<rect width="960" height="540" fill="#f6f1e6"/>
      <g filter="url(#t-br)">${sky}${clouds}
        <g transform="translate(150 96) scale(.8)">${Array.from({ length: 16 }, (_, i) => `<path transform="rotate(${i * 22.5})" d="M0 -46 L0 -70" ${br}/>`).join('')}<circle r="40" fill="${O}" ${br}/><circle r="22" fill="#f2c94c" stroke="${C}" stroke-width="2"/></g>
        <path d="M-10 420 C 60 360 110 300 140 290 C 170 300 230 360 330 420Z" fill="${W}" opacity=".7" ${br}/>
        <path d="${MAL}" fill="${W}" ${br}/>${hatch}
        <path d="M400 220 C 430 196 452 184 472 182 C 492 184 512 194 540 214 C 528 226 516 222 506 232 C 494 222 484 238 472 228 C 460 238 450 224 438 232 C 428 222 414 228 400 220Z" fill="#fbf8f0" ${br}/>
        <path d="M472 186 L455 300 M472 186 L520 290 M472 186 L600 330" stroke="${C}" stroke-width="2" opacity=".7"/>
        <path d="${wave(408, 8, .014, 1)}" fill="#c8d4ee" ${br}/>
        ${Array.from({ length: 20 }, (_, i) => `<circle cx="${20 + i * 48}" cy="${404 + Math.sin(i) * 6}" r="${12}" fill="${G}" opacity=".85" ${br}/>`).join('')}
        ${teocalli(790, 432, 1, { a: '#fbf8f0', b: '#c8d4ee', s: C, r: O, w: '#fbf8f0' }, br)}
        <path d="${wave(440, 6, .02, 2)}" fill="#e6ecf8" ${br}/>
        ${milpa({ stem: C, leaf: G, cob: O, tas: O }, R, [[470, .8, 540], [500, .95, 500], [532, 1.1, 460]])}
        ${agave(640, 540, 1.3, [C, '#2f56b4', G], `stroke="${C}" stroke-width="1.6"`)}${agave(900, 540, 1.6, [C, '#2f56b4', G], `stroke="${C}" stroke-width="1.6"`)}
        ${heron(300, 120, 1, '#fbf8f0', C, 2.6)}${heron(350, 142, .8, '#fbf8f0', C, 2.6)}
      </g>
      <rect width="960" height="540" fill="url(#t-grid)"/>`;
    return svg(defs, body);
  }

  window.TlaxScenes = { plano, papel, lienzo, talavera };
})();
</script>
<script>
// Two new character styles for the Tlaxcallan cast (params from propuestas-v2/chars.js):
//  borgia — Códice Borgia (Puebla-Tlaxcala codex): big profile head, large eye, ear
//           spool, thick ink contour, flat colour, stepping pose, speech scroll.
//  barro  — Xochitécatl clay figurine (Tlaxcala): burnished terracotta doll with
//           jointed arms and legs, appliqué pellets and mineral paint.
"use strict";
(function () {
  const K = '#1a1410', ink = `stroke="${K}" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"`;
  const sh = (h, k) => '#' + [1, 3, 5].map(i => Math.min(255, Math.round(parseInt(h.slice(i, i + 2), 16) * k)).toString(16).padStart(2, '0')).join('');
  // Xicalcoliuhqui (stepped fret) band.
  const fret = (x0, x1, y, h, c) => { let d = ''; for (let x = x0; x < x1 - 8; x += 10) d += `M${x} ${y + h} v${-h * .5} h4 v${-h * .4} h5`; return `<path d="${d}" fill="none" stroke="${c}" stroke-width="2"/>`; };

  // ---------- Códice Borgia ----------
  function borgia(p) {
    const sk = p.skin, hair = p.hair, hs = p.hairStyle, top = p.top || '#f3ede2', trim = p.trim || '#c0392b', skirt = p.skirt || '#2f5fa8';
    const bw = [0, 4, 9][p.build || 0];
    let g = '';
    // Props behind the body.
    if (p.prop === 'lanza') g += `<path d="M112 196 V14" stroke="${K}" stroke-width="6"/><path d="M112 196 V14" stroke="#b07a3a" stroke-width="3"/><path d="M112 0 l-7 18 h14Z" fill="#3a3a4a" ${ink}/><path d="M106 26 l-6 8 M118 26 l6 8" stroke="#c0392b" stroke-width="4" stroke-linecap="round"/>`;
    if (p.prop === 'arco') g += `<path d="M112 70 C 134 100 134 160 112 190" fill="none" stroke="${K}" stroke-width="6"/><path d="M112 70 C 134 100 134 160 112 190" fill="none" stroke="#9a6438" stroke-width="3"/><path d="M112 70 V190" stroke="${K}" stroke-width="1.2"/>`;
    // Feathers behind the head.
    if (p.head === 'plumas') g += ['#2f8f8a', '#3fa37a', '#7cb04a', '#e9b33e', '#c0392b', '#3fa37a', '#2f8f8a'].map((c, i) => `<g transform="rotate(${-78 + i * 15} 46 26)"><path d="M46 26 C 38 8 40 -18 46 -32 C 52 -18 54 8 46 26Z" fill="${c}" ${ink}/><path d="M46 20 V-24" stroke="${K}" stroke-width="1.2"/><circle cx="46" cy="-22" r="3.4" fill="#f6efe0" stroke="${K}" stroke-width="1.4"/></g>`).join('');
    // Hair mass behind.
    if (hs === 'afro') g += `<circle cx="56" cy="42" r="40" fill="${hair}" ${ink}/>${Array.from({ length: 12 }, (_, i) => { const a = i / 12 * Math.PI * 2; return `<circle cx="${56 + Math.cos(a) * 38}" cy="${42 + Math.sin(a) * 38}" r="7" fill="${hair}" ${ink}/>`; }).join('')}`;
    else if (hs === 'rizos') g += `<path d="M36 34 C 22 70 22 120 32 138 L60 138 C 56 110 56 70 60 50Z" fill="${hair}" ${ink}/>${[48, 62, 76, 90, 104, 118, 132].map(y => `<circle cx="${28 + (y % 3)}" cy="${y}" r="8" fill="${hair}" ${ink}/>`).join('')}`;
    else if (hs === 'largo') g += `<path d="M36 34 C 24 70 24 116 32 138 L58 138 C 54 110 54 70 58 52Z" fill="${hair}" ${ink}/><path d="M34 60 C 30 90 30 116 34 132" stroke="#4a3a34" stroke-width="1.6" fill="none"/>`;
    else if (hs === 'coleta') g += `<path d="M36 38 C 14 46 8 90 18 116 C 24 96 28 72 42 54Z" fill="${hair}" ${ink}/><rect x="30" y="42" width="10" height="8" fill="${p.acc2 || '#c0392b'}" ${ink} transform="rotate(-30 35 46)"/>`;
    else if (hs === 'trenzas') g += `${Array.from({ length: 8 }, (_, i) => `<ellipse cx="${36 - i * .6}" cy="${70 + i * 9}" rx="6" ry="6" fill="${hair}" ${ink}/>`).join('')}<rect x="28" y="138" width="12" height="6" fill="${p.acc2 || '#c0392b'}" ${ink}/>`;
    else if (hs === 'chongo') g += `<circle cx="38" cy="18" r="11" fill="${hair}" ${ink}/>`;
    // Back arm (behind the torso).
    g += `<path d="M44 96 C 36 112 36 124 40 134" fill="none" stroke="${K}" stroke-width="12" stroke-linecap="round"/><path d="M44 96 C 36 112 36 124 40 134" fill="none" stroke="${sh(sk, .85)}" stroke-width="7.4" stroke-linecap="round"/>`;
    // Legs and feet in profile, stepping forward.
    const foot = x => `<path d="M${x} 182 h9 v6 h14 c 5 0 5 8 0 8 h-25Z" fill="${sk}" ${ink}/><path d="M${x} 190 H${x + 26}" stroke="#7a4a24" stroke-width="3.4"/><path d="M${x + 4} 182 v6" stroke="#7a4a24" stroke-width="3"/>`;
    g += foot(42) + foot(74);
    // Cueitl.
    g += `<path d="M${42 - bw} 132 H${88 + bw} L${96 + bw} 184 H${34 - bw}Z" fill="${skirt}" ${ink}/><path d="M${35 - bw} 170 H${95 + bw} L${96 + bw} 184 H${34 - bw}Z" fill="#f3ede2" ${ink}/>${fret(37 - bw, 95 + bw, 171, 12, trim)}`;
    // Torso.
    if (p.style === 'quech') g += `<path d="M${42 - bw} 88 H${86 + bw} L${90 + bw} 132 H${38 - bw}Z" fill="#f3ede2" ${ink}/><path d="M${34 - bw} 88 H${94 + bw} L64 146Z" fill="${top}" ${ink}/><path d="M${42 - bw} 94 L64 136 L${86 + bw} 94" fill="none" stroke="${trim}" stroke-width="4"/>${Array.from({ length: 7 }, (_, i) => `<path d="M${58 + i * 2} 142 v8" stroke="${trim}" stroke-width="2"/>`).join('')}`;
    else if (p.style === 'armadura') { g += `<path d="M${40 - bw} 86 H${88 + bw} L${90 + bw} 136 H${38 - bw}Z" fill="${top}" ${ink}/>`; for (let y = 94; y < 134; y += 8) g += `<path d="M${40 - bw} ${y} H${88 + bw}" stroke="${K}" stroke-width="1.2"/>`; for (let x = 46 - bw; x < 88 + bw; x += 8) g += `<path d="M${x} 86 V136" stroke="${K}" stroke-width=".8"/>`; g += `<rect x="${38 - bw}" y="130" width="${52 + 2 * bw}" height="8" fill="${trim}" ${ink}/>`; }
    else { g += `<path d="M${38 - bw} 86 H${90 + bw} L${94 + bw} 138 H${34 - bw}Z" fill="${top}" ${ink}/><path d="M54 86 V100 H74 V86" fill="none" stroke="${trim}" stroke-width="3.4"/><path d="M${35 - bw} 126 H${93 + bw} L${94 + bw} 138 H${34 - bw}Z" fill="${p.band2 || trim}" ${ink}/>${fret(37 - bw, 93 + bw, 127, 10, p.hem2 || '#f3ede2')}`; if (p.stars) g += [[50, 112], [78, 108]].map(([x, y]) => `<path d="M${x} ${y - 4} l1.4 2.6 l2.6 1.4 l-2.6 1.4 l-1.4 2.6 l-1.4 -2.6 l-2.6 -1.4 l2.6 -1.4Z" fill="#f2c94c" stroke="${K}" stroke-width=".8"/>`).join(''); }
    if (p.jade) g += [52, 58, 64, 70, 76].map((x, i) => `<circle cx="${x}" cy="${90 + [0, 3, 4, 3, 0][i]}" r="3.4" fill="#3fa37a" ${ink}/>`).join('');
    // Neck and head.
    g += `<path d="M56 76 L56 88 L76 88 L74 78" fill="${sk}" ${ink}/>`;
    g += `<path d="M42 72 C 30 56 30 32 40 22 C 50 10 74 8 88 18 C 94 24 96 32 96 38 L102 48 C 103 50 102 52 100 52 L98 54 C 100 56 100 58 97 59 C 99 62 97 66 93 66 L92 72 C 88 78 76 82 66 82 L50 80Z" fill="${sk}" ${ink}/>`;
    g += `<path d="M76 38 C 80 32 88 32 92 38 C 88 43 80 43 76 38Z" fill="#fff" ${ink}/><circle cx="86" cy="38" r="2.8" fill="${K}"/><path d="M76 29 Q84 25 92 29" stroke="${K}" stroke-width="2.4" fill="none"/>`;
    g += `<path d="M92 63 h6" stroke="${K}" stroke-width="2.4"/>`;
    if (p.paint) g += `<path d="M66 50 H90" stroke="${p.paint}" stroke-width="4" stroke-linecap="round"/>`;
    if (p.freckles) g += [[74, 50], [79, 52], [84, 50]].map(([x, y]) => `<circle cx="${x}" cy="${y}" r="1.2" fill="${sh(sk, .6)}"/>`).join('');
    g += `<circle cx="58" cy="52" r="9" fill="${p.orejeras ? '#e9b33e' : '#3fa37a'}" ${ink}/><circle cx="58" cy="52" r="3.6" fill="#f6efe0" ${ink}/>`;
    // Hair cap.

  const calli = `<svg class="day" viewBox="0 0 40 40"><path d="M6 18 L20 6 L34 18Z" fill="#c0392b" ${O}/><rect x="9" y="18" width="22" height="16" fill="#f3ede2" ${O}/><rect x="16" y="24" width="8" height="10" fill="${K}"/></svg>`;
  const keys = (...ks) => `<div class="keys">${ks.map(([k, t]) => `<span><kbd>${k}</kbd>${t}</span>`).join('')}</div>`;
  const bg = src => `<div class="gbg" style="background-image:url('${src}')"></div><div class="dim"></div>`;
  const page = (cls, inner) => `<div class="cx ${cls}">${inner}</div>`;
  const frame = (fig, cls = '') => `<div class="cf ${cls}">${fig}</div>`;

  // ---------- Inicio ----------
  function inicio(T) {
    return `<div class="ab">${T.lienzo}
      ${page('logo', `<svg class="glyph" viewBox="0 0 120 110"><path d="M14 104 C 14 60 34 30 60 30 C 86 30 106 60 106 104 Z" fill="#7aa45a" ${O}/><path d="M14 92 H106 V104 H14Z" fill="#e9b33e" ${O}/><ellipse cx="60" cy="30" rx="26" ry="7" fill="#f3e2b8" ${O}/><path d="M30 10 C 34 6 50 8 56 22 L48 24 C 44 18 38 16 32 18 Z" fill="#c48a5a" ${O}/><path d="M90 50 C 86 54 70 52 64 38 L72 36 C 76 42 82 44 88 42 Z" fill="#c48a5a" ${O}/></svg>
        <div><div class="logo__n">Tlaxcallan</div><div class="logo__t">${calli} Año 1-Ácatl · 1519 · llegan extranjeros por el oriente</div></div>`)}
      ${page('tmenu', `<div class="cb cb--on" data-sel="cb"><span>Continuar</span><small>Día 3-Calli · ${bean} 900 300</small></div><div class="cb" data-sel="cb"><span>Nueva partida</span><small>Hereda la milpa de tu abuela</small></div><div class="cb" data-sel="cb"><span>Opciones</span><small>Volumen, idioma y mensajes</small></div>`)}
      <div class="foot">Señorío de Tlaxcallan · Tepetícpac · Ocotelulco · Tizatlán · Quiahuiztlán · en guerra con Tenochtitlan</div></div>`;
  }

  const TABS = ['Bolsa', 'Oficios', 'Vecinos', 'Amoxtli', 'Mapa'];
  const tabs = on => `<div class="tabs">${TABS.map(t => `<div class="cb tab${t === on ? ' cb--on' : ''}" data-sel="cb">${t}</div>`).join('')}</div>`;

  // ---------- Bolsa ----------
  const BAR = [['coa', 225], ['cantaro', 8], ['hacha', ''], ['obsidiana', 12], ['coa', ''], ['maizAzul', 19], ['frijol', 14], ['chile', 8], ['maiz', 12], ['calabaza', 3]];
  const BAG = [['calabaza', 12], ['nopal', 5], ['tlaxcalli', 6], ['octli', 2], ['cacao', 18], ['maiz', 19], ['cempa', 9], ['frijol', 7]];
  const slot = (s, i, bar, on) => `<div class="sl${s ? '' : ' sl--e'}${on ? ' sl--on' : ''}" data-sel="sl">${s ? icon(s[0]) : ''}${bar ? `<span class="sl__k">${dots(i + 1 > 9 ? 10 : i + 1, 'nd nd--k')}</span>` : ''}${s && s[1] !== '' ? `<span class="sl__n">${s[1]}</span>` : ''}</div>`;
  const meter = (l, v, c) => `<label>${l}</label><div class="m"><i style="width:${v}%;background:${c}"></i></div><em>${v}</em>`;
  function bolsa(T) {
    return `<div class="ab">${bg(T.milpa)}${tabs('Bolsa')}
      ${page('bag', `<div class="bag__l">${frame(F.borgia(PLAYER), 'cf--tall')}<div class="who"><b>Tú</b><span>Macehualli ${flowers(3).replace('xos', 'xos xos--s')}</span></div>
          <div class="ms">${meter('Energía', 92, '#2f7ac0')}${meter('Vida', 85, '#c0392b')}${meter('Ánimo', 70, '#3f9a3a')}</div></div>
        <div class="bag__r">
          <div class="item"><div class="item__ic">${icon('coa')}</div><div class="item__t"><b>Coa</b><small>Huictli · herramienta de labranza</small><p>Abre la tierra frente a ti. Pulsa Espacio con la coa en la mano.</p></div>
            <div class="item__s"><div class="kv"><span>Usos</span><b>225 / 225</b></div><div class="m m--s"><i style="width:100%;background:#3f9a3a"></i></div><div class="row2"><div class="cb cb--on">Usar</div><div class="cb">Soltar</div></div></div></div>
          <div class="sh"><b>Barra</b><span>teclas 1–0 · Q ⇄ bolsa</span></div>
          <div class="sls">${BAR.map((s, i) => slot(s, i, true, i === 0)).join('')}</div>
          <div class="sh"><b>Chitatli 1 de 5</b><span>◂ ▸ cambiar morral · +151</span></div>
          <div class="sls">${Array.from({ length: 20 }, (_, i) => slot(BAG[i], i, false, false)).join('')}</div>
        </div>`)}
      ${keys(['Q', 'cerrar'], ['1–0', 'barra'], ['◂ ▸', 'morral'])}</div>`;
  }

  // ---------- Tianguis ----------
  function tianguis(T) {
    const seller = CAST[12];
    const rows = [['maizAzul', 'Maíz azul', 'Semilla · brota en 6 días', 12, 3], ['frijol', 'Frijol ayocote', 'Semilla · trepa por la caña', 6, 0], ['calabaza', 'Calabaza', 'Semilla · cubre la milpa', 10, 0], ['chile', 'Chilli', 'Semilla · para el molli', 8, 0], ['obsidiana', 'Navaja de obsidiana', 'Filo para la macuahuitl', 20, 0]]
      .map(([k, n, d, p, q], i) => `<div class="pr${i ? '' : ' pr--on'}" data-sel="pr"><div class="pr__ic">${icon(k)}</div><div class="pr__t"><b>${n}</b><small>${d}</small></div><span class="pr__p">${bean} ${p}</span><div class="qty"><u>−</u><b>${q}</b><u>+</u></div></div>`).join('');
    return `<div class="ab">${bg(T.plaza)}
      <div class="seller">${frame(F.borgia(seller), 'cf--seller')}
        ${page('talk', `<div class="talk__n">${seller.name}<small>${seller.role}</small></div><p>Llegaron cargadores de la costa con cacao. La sal ya no pasa: los mexicas cerraron los caminos.</p><div class="talk__f">${flowers(6)}<span>▼</span></div>`)}</div>
      ${page('shop', `<div class="shop__h"><b>Tianguis de Ocotelulco</b><span class="purse">${bean} 900 300</span></div>
        <div class="chips"><span class="cb chip cb--on" data-sel="cb">Semillas</span><span class="cb chip" data-sel="cb">Comida</span><span class="cb chip" data-sel="cb">Ofrendas</span><span class="cb chip" data-sel="cb">Armas</span></div>
        <div class="prs">${rows}</div>
        <div class="shop__f"><span>Total <b>${bean} 36</b></span><div class="row2"><div class="cb">Vender</div><div class="cb cb--on">Trocar</div></div></div>`)}
      ${keys(['▲▼', 'producto'], ['◂ ▸', 'cantidad'], ['Enter', 'trocar'], ['Esc', 'salir'])}</div>`;
  }

  // ---------- Vecinos ----------
  const HOME = ['Tepetícpac', 'Ocotelulco', 'Tizatlán', 'Quiahuiztlán'];
  function vecinos(T) {
    const sel = 4, p = CAST[sel];
    const cards = CAST.map((c, i) => `<div class="vc${i === sel ? ' vc--on' : ''}" data-sel="vc"><div class="vc__a">${F.borgia(c)}</div><b>${c.name}${c.romance ? ' <i class="love">♥</i>' : ''}</b></div>`).join('');
    return `<div class="ab">${bg(T.plaza)}${tabs('Vecinos')}
      ${page('vec', `<div class="vec__g">${cards}</div>
        <div class="vec__s">${frame(F.borgia(p), 'cf--big')}
          <div class="vec__n">${p.name}</div><div class="vec__r">${p.role}</div>${flowers(9)}
          <p class="vec__l">«${p.line}»</p>
          <div class="facts"><span>Vive en</span><b>${HOME[sel % 4]}</b><span>Le encanta</span><b>${icon('octli', 'mini')} Octli</b><span>Nació</span><b>${calli} 7-Calli</b></div>
          <div class="cb cb--on">Hacer un regalo</div></div>`)}
      ${keys(['Q', 'cerrar'], ['◂ ▸', 'pestaña'], ['Enter', 'ver'])}</div>`;
  }

  // ---------- Pausa ----------
  function pausa(T) {
    const sl = (l, v) => `<div class="set set--n"><span>${l}</span><div class="sld"><i style="width:${v * 10}%"></i><b style="left:${v * 10}%"></b></div>${dots(v, 'nd nd--v')}</div>`;
    const tg = (l, a, b) => `<div class="set"><span>${l}</span><div class="chips"><span class="cb chip cb--on" data-sel="cb">${a}</span><span class="cb chip" data-sel="cb">${b}</span></div></div>`;
    return `<div class="ab">${bg(T.milpa)}<div class="dim dim--deep"></div>
      ${page('ph', `<div class="ph__t">Pausa</div><div class="ph__d">${calli} Día 3-Calli · veintena Tlacaxipehualiztli · año 1-Ácatl</div>`)}
      ${page('plist', ['Reanudar', 'Guardar en el amoxtli', 'Opciones', 'Controles', 'Salir al menú'].map((t, i) => `<div class="cb${i === 2 ? ' cb--on' : ''}${i === 4 ? ' cb--x' : ''}" data-sel="cb"><span>${t}</span></div>`).join(''))}
      ${page('popts', `${sl('Música', 7)}${sl('Efectos', 5)}${tg('Pantalla', 'Completa', 'Ventana')}${tg('Tutorial', 'Mostrar', 'Ocultar')}${tg('Clima', 'Lluvia y rayos', 'Suave')}
        <div class="set"><span>Idioma</span><div class="cyc"><u>◂</u><b>Español</b><u>▸</u></div></div>`)}
      ${keys(['Esc', 'volver'], ['Enter', 'aceptar'], ['◂ ▸', 'cambiar'])}</div>`;
  }

  window.TlaxMenus4 = { inicio, bolsa, tianguis, vecinos, pausa };
})();
</script>
<script>
// v4 page: codex menus framed in tile, with a Talavera / polychrome switch,
// plus the cast in the two new styles (Códice Borgia, barro de Xochitécatl).
"use strict";
(function () {
  const X = window.TlaxTex, M = window.TlaxMenus4, F = window.TlaxFigs4, { CAST, PLAYER } = window.TlaxChars;
  const root = document.documentElement.style;
  root.setProperty('--deco', `url(${X.decoTile()})`); root.setProperty('--plain', `url(${X.plainTiles()})`); root.setProperty('--cobalt', `url(${X.cobaltTile()})`);
  // Mixteca-Puebla polychrome tile: cream slip, red and black stepped fret, white dots.
  const poli = `<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48"><rect width="48" height="48" fill="#ecc890"/><rect x="1" y="1" width="46" height="46" fill="#f1d6a2" stroke="#1a1410" stroke-width="2"/><path d="M6 42 V28 H16 V18 H26 V8 H42 V20 H32 V30 H22 V42Z" fill="#b8402e" stroke="#1a1410" stroke-width="2.4" stroke-linejoin="round"/><path d="M32 8 V14 H38" fill="none" stroke="#1a1410" stroke-width="2.4"/><path d="M12 42 V36 H6" fill="none" stroke="#1a1410" stroke-width="2.4"/>${[[38, 34], [42, 40], [34, 40], [8, 10], [14, 6], [6, 16]].map(([x, y]) => `<circle cx="${x}" cy="${y}" r="2" fill="#fffaf0" stroke="#1a1410" stroke-width="1"/>`).join('')}</svg>`;
  root.setProperty('--poli', `url("data:image/svg+xml;charset=utf-8,${encodeURIComponent(poli)}")`);
  // Paper grain.
  const c = document.createElement('canvas'); c.width = c.height = 160; const g = c.getContext('2d'), img = g.createImageData(160, 160);
  for (let i = 0; i < img.data.length; i += 4) { const v = 90 + Math.random() * 70; img.data[i] = v; img.data[i + 1] = v * .8; img.data[i + 2] = v * .6; img.data[i + 3] = Math.random() * 26; }
  g.putImageData(img, 0, 0); root.setProperty('--grain', `url(${c.toDataURL()})`);

  const T = { lienzo: window.TlaxScenes.lienzo(), milpa: window.TLAX_ASSETS?.milpa || '../propuestas-v2/assets/juego-milpa.jpg', plaza: window.TLAX_ASSETS?.plaza || '../propuestas-v2/assets/juego-plaza.png' };
  const board = (html, cap) => `<figure class="board"><div class="fit">${html}</div><figcaption>${cap}</figcaption></figure>`;
  const all = [PLAYER, ...CAST];
  const home = ['Tepetícpac', 'Ocotelulco', 'Tizatlán', 'Quiahuiztlán'];
  const row = (k, n, d, fn) => `<div class="srow"><h3><span>ESTILO ${k}</span>${n}</h3><p>${d}</p><div class="line">${all.map((p, i) => `<figure><div class="cf">${fn(p)}</div><figcaption>${p.name}${p.romance ? ' ♥' : ''}<small>${p.role}${i ? ' · ' + home[(i - 1) % 4] : ''}</small></figcaption></figure>`).join('')}</div></div>`;

  document.getElementById('app').innerHTML = `
    <section class="sec"><h2>Inicio</h2><p>El paisaje del Lienzo de Tlaxcala con el logo y el menú como páginas de códice. La fecha usa el calendario mexica: día 3-Calli, año 1-Ácatl (1519).</p>
      <div class="fit fit--hero">${M.inicio(T)}</div></section>
    <section class="sec"><h2>Menús en el juego</h2><p>Cada panel es una página de códice en tira plegada: estuco sobre piel de venado, con dobleces, contorno de tinta y filete rojo que separa las escenas. Los marcos van en azulejo. Los números de la barra se escriben con puntos y barras, la amistad se mide en flores (xóchitl) y los precios en granos de cacao.</p>
      <div class="boards">${board(M.bolsa(T), '<b>Bolsa</b> · el chitatli (morral) con coa, hacha y navajas de obsidiana')}${board(M.tianguis(T), '<b>Tianguis de Ocotelulco</b> · trueque con cacao; la sal no llega por el cerco mexica')}${board(M.vecinos(T), '<b>Vecinos</b> · los 15 en estilo Códice Borgia')}${board(M.pausa(T), '<b>Pausa</b> · volumen contado con puntos y barras')}</div></section>
    <section class="sec"><h2>Muñecos · 2 estilos nuevos</h2>
      <div class="styles">${row('A', 'Códice Borgia', 'El Códice Borgia se pintó en la región Puebla-Tlaxcala antes de la conquista. Sus figuras tienen cabeza grande de perfil, ojo grande, orejera de jade, pie de perfil con sandalia y tinta gruesa, y llevan la vírgula de la palabra (la voluta delante de la boca). Es el estilo que uso en los menús.', F.borgia)}
        ${row('B', 'Muñecas de barro de Xochitécatl', 'Inspiradas en las figurillas articuladas de barro halladas en Xochitécatl, Tlaxcala: muñecas con brazos y piernas sueltos y amarrados, ojos incisos, pastillaje (bolitas de barro pegadas) y pintura mineral gastada. Se verían muy bien animadas, con las extremidades balanceándose al caminar.', F.barro)}</div></section>`;

  const fits = [...document.querySelectorAll('.fit')];
  const fit = () => fits.forEach(f => f.firstElementChild.style.setProperty('--k', f.clientWidth / 960));
  new ResizeObserver(fit).observe(document.body); fit();

  document.querySelectorAll('.toggle button').forEach(b => b.addEventListener('click', () => {
    document.body.classList.toggle('poli', b.dataset.mode === 'poli');
    document.querySelectorAll('.toggle button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
  }));
  document.addEventListener('click', e => {
    const el = e.target.closest('[data-sel]'); if (!el) return;
    const k = el.dataset.sel, cls = { cb: 'cb--on', pr: 'pr--on', vc: 'vc--on', sl: 'sl--on' }[k];
    const scope = k === 'sl' ? el.closest('.bag') : el.parentElement;
    scope.querySelectorAll(`[data-sel="${k}"]`).forEach(x => x.classList.toggle(cls, x === el));
  });
})();
</script>
</body>
</html>
